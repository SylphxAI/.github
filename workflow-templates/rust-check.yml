name: Rust check

# Remote `cargo check` for `sylphx build check` (SylphxAI/.github docs/rust-check.md).
# Copy this file to .github/workflows/sylphx-check.yml and keep the name.
# Until the CLI ships: gh workflow run sylphx-check.yml -R ORG/REPO -f ref=BRANCH -f packages="crate1 crate2"
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit
        required: true
        type: string
      packages:
        description: Space-separated package names
        required: false
        type: string
        default: ''
      tests:
        description: Also check test targets
        required: false
        type: boolean
        default: false
      workspace:
        description: Cargo workspace directory
        required: false
        type: string
        default: '.'
      request:
        description: Request id (names the run)
        required: false
        type: string
        default: ''

run-name: sylphx-check ${{ inputs.request }}

permissions:
  contents: read

jobs:
  check:
    # id-token: the compile cache knows the job by its GitHub OIDC identity
    # (a called workflow can only narrow what its caller grants, and GitHub
    # refuses to start the run when the called job asks for more).
    permissions:
      contents: read
      id-token: write
    uses: SylphxAI/.github/.github/workflows/rust-check.yml@b051405836fcc2346300b21bd5f3af9e8eae5419 # main after #217
    with:
      ref: ${{ inputs.ref }}
      packages: ${{ inputs.packages }}
      tests: ${{ inputs.tests }}
      workspace: ${{ inputs.workspace }}
      # Private git dependencies Cargo fetches, one OWNER/REPO per line, read
      # through your own reader App (GIT_DEPS_APP_ID / GIT_DEPS_APP_KEY below).
      # git-deps: |
      #   OWNER/REPO
    # Only for a runner without the platform's per-org credential (optional).
    secrets:
      SYLPHX_CI_CACHE_ACCESS_KEY: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
      SYLPHX_CI_CACHE_SECRET_KEY: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}
      # GIT_DEPS_APP_ID: ${{ secrets.YOUR_READER_APP_ID }}
      # GIT_DEPS_APP_KEY: ${{ secrets.YOUR_READER_APP_KEY }}
