name: Rust check

# Remote `cargo check` for `sylphx build check` (SylphxAI/.github docs/rust-check.md).
# Copy this file to .github/workflows/sylphx-check.yml and keep the name.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit
        required: true
        type: string
      packages:
        description: Space-separated package names
        required: false
        type: string
        default: ''
      tests:
        description: Also check test targets
        required: false
        type: boolean
        default: false
      workspace:
        description: Cargo workspace directory
        required: false
        type: string
        default: '.'
      request:
        description: Request id (names the run)
        required: false
        type: string
        default: ''

run-name: sylphx-check ${{ inputs.request }}

permissions:
  contents: read

jobs:
  check:
    uses: SylphxAI/.github/.github/workflows/rust-check.yml@d488b95155b2c1c48f81610d70a9213262903a19 # main 2026-09-29
    with:
      ref: ${{ inputs.ref }}
      packages: ${{ inputs.packages }}
      tests: ${{ inputs.tests }}
      workspace: ${{ inputs.workspace }}
    secrets:
      RGW_S3_ACCESS_KEY: ${{ secrets.RGW_S3_ACCESS_KEY }}
      RGW_S3_SECRET_KEY: ${{ secrets.RGW_S3_SECRET_KEY }}
