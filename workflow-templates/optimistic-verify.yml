# Post-merge verification for optimistic merge (docs/optimistic-merge.md in
# SylphxAI/.github). Everything the gate dropped - integration, database and
# browser tests, device matrices, release builds - runs here on each push to
# the trunk, and on every pull request push, including drafts (ci.yml calls
# this file). The `verified` job's check run on the head commit is the marker
# the platform's Release reads: only verified commits deploy.
#
# One run covers every commit since the last one whose suite passed, so a
# newer run supersedes an in-flight one on the trunk: the newest run still
# carries the commits the superseded one held (the latest push wins).
# The red-main handler dispatches this workflow on a temporary branch with
# `lanes` set to the lanes it suspects.
#
# Adopting: replace each `@main` below with the commit of SylphxAI/.github
# main you adopt, then fill in the lanes. A repository whose default branch is
# not `main` lists its own branch under `push` below.
name: Verify

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      lanes:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      code-merge:
        type: string
      code-head:
        type: string
      code-base:
        type: string
      lanes:
        description: Comma-separated lanes to run. Empty runs every lane the range selects.
        type: string
        default: ""

# A newer run supersedes an in-flight one on the trunk and on a pull request.
# A merge group never cancels: a cancelled entry ejects the queue.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  id-token: write

jobs:
  plan:
    runs-on: sylphx-linux-standard
    timeout-minutes: 10
    outputs:
      base: ${{ steps.range.outputs.base }}
      run: ${{ steps.range.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          filter: blob:none
      - id: range
        uses: SylphxAI/.github/.github/actions/ci-range@main
        with:
          only: ${{ inputs.lanes }}
          lanes: |
            integration: src/* tests/*
            e2e:

  integration:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).integration
    runs-on: sylphx-linux-standard
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
      - run: echo "the full test suite; write a JUnit report"
      # Keep this explicit step name equal to "run-store put <name>".
      # red-main discovers exact names (including matrix shards) from run jobs.
      # Diagnostics remain optional; a missing report falls back to lane evidence.
      - name: run-store put junit-integration
        uses: SylphxAI/.github/.github/actions/run-store@main
        if: always()
        continue-on-error: true
        with:
          mode: put
          name: junit-integration
          path: junit.xml
          required: "false"

  e2e:
    needs: plan
    if: fromJSON(needs.plan.outputs.run).e2e
    runs-on: sylphx-linux-standard
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
      - run: echo "browser, device or release-build lanes"

  # The marker. Named exactly `verified`; never a required check (it exists
  # only after a merge).
  verified:
    name: verified
    if: always() && !cancelled()
    needs: [plan, integration, e2e]
    # The current workflow's verdict has a reserved seat; cancelled workflows
    # must not publish a stale aggregate after their cancellation, and a lane a
    # cancellation left `cancelled` is reported CANCELLED rather than failed.
    runs-on: sylphx-linux-control
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@main
        with:
          separate-pr-metadata: 'true'
          needs: ${{ toJSON(needs) }}
          required: plan
