name: Keel pin check

# Fails a pull request that moves the Keel pin to a commit that is not on Keel main, to a branch, or to a
# second commit, and warns when the pin is not a keel-verified-* / keel-weekly-* tag. A pull request that
# leaves the pin alone is only warned about, so an existing fork stays green until its pin moves
# (SylphxAI/.github docs/keel-pin-check.md).
# Before adding it, audit the repository's main with every rule enforced (`keel_pin_check.py audit`, see the
# guide's "Rolling it out"): a main that fails gets its pin fix in the same pull request, or is skipped.
# Copy to .github/workflows/keel-pin-check.yml and replace the commit placeholder with the pinned commit of
# SylphxAI/.github. Add the job (`keel-pin-check`) to the ruleset's required checks, or to the aggregate
# check, once the repository's pin is clean. The Keel repin bot's pull requests pin a verified tag, so
# list this workflow in its `ci-workflows` only if it should run on them too.
# Under optimistic merge (docs/optimistic-merge.md) call this file from .github/workflows/ci.yml (it now
# declares `on: workflow_call`) and list the calling job in `ci-ok`'s `needs:`: `ci-ok` needs only
# ci.yml's jobs, so a check required on its own is admitted while it is still pending. Where the check
# should not gate the merge, keep it standalone and add the line `# optimistic-merge: gate-external`
# (audit row R3b).
on:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: keel-pin-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  keel-pin-check:
    runs-on: sylphx-linux-standard
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The merge commit and its parents: the first parent is the pull request's base.
          fetch-depth: 2
      - uses: SylphxAI/.github/.github/actions/keel-pin-check@PINNED_COMMIT_SHA
        with:
          reader-app-id: ${{ secrets.CUBEAGE_CI_READER_APP_ID }}
          reader-app-key: ${{ secrets.CUBEAGE_CI_READER_APP_KEY }}
          # A manual run audits every pin (empty base); a pull request or merge group is judged against its
          # base. The empty string must be the last operand: `cond && '' || x` always yields x, since '' is falsy.
          base: ${{ github.event_name != 'workflow_dispatch' && 'auto' || '' }}
