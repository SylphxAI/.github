# Install beside ci.yml and pin the shared action to the release you adopt.
# Require pr-metadata separately from ci-ok after observing both PR and
# merge-group checks. A metadata verdict never supplies code-test evidence.
# optimistic-merge: gate-external
name: PR metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

# This namespace must never match a code workflow's concurrency group.
concurrency:
  group: pr-metadata-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-metadata:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    runs-on: sylphx-linux-control
    timeout-minutes: 5
    steps:
      # Only changes.base dispatches code; title/body edits make no write.
      - uses: SylphxAI/.github/.github/actions/pr-base-ci@main
        with:
          workflow: ci.yml
      - uses: SylphxAI/.github/.github/actions/contribution-policy@main
