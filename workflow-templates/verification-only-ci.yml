# Verification-only CI — Agent-native Fast Trunk
# Canonical: platform ADR-01KYTNAGENTFASTTRUNK01
name: CI
on:
  pull_request:
  push:
    branches: [main]
  # No merge_group — Merge Queue off by default.
permissions:
  contents: read
concurrency:
  # PR number || ref — never github.sha (no free-runners).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-ci:
    name: source-ci/pass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Forbidden: production packaging (next/bun app build, cargo --release ship, docker deploy image)
