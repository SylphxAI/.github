# Verification-only CI — Agent-native Fast Trunk
# Canonical: platform ADR-01KYTNAGENTFASTTRUNK01
# Platform packages the deployable digest once. Do not add production packaging here.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref
  }}
  cancel-in-progress: true
jobs:
  verify:
    name: source-ci/pass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Forbidden residual:
      # - bun run build / next build (app production)
      # - cargo build --release (ship binary packaging)
      # - docker build for deploy images discarded after CI
