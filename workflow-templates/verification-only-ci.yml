# Verification-only CI template (build once — Platform packages).
# Copy into product repos as .github/workflows/ci.yml and adjust steps.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Do NOT add production packaging here (next build / cargo --release / docker build).
      # Platform builds the deployable digest once.
