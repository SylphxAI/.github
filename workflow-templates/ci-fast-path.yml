# Fast-path CI: docs-only pull requests skip the heavy jobs, a new push
# supersedes the pull request's run, heavy jobs wait for the cheap gate, and
# one `ci-ok` aggregate (skipped = pass) is the required check. See
# docs/ci-template.md in SylphxAI/.github. Replace each `@main` with the
# commit you adopt (callers pin by commit), then fill in the jobs.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: SylphxAI/.github/.github/workflows/changes.yml@main

  # The cheap gate: format, lint, typecheck, unit tests. Standard runner.
  gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: SylphxAI/.github/.github/actions/cache-toolchain@main
        with:
          toolchain: npm
      - run: echo "format, lint, typecheck, unit tests"

  # Heavy jobs (release build, e2e, iOS/Android) wait for the gate, skip on a
  # docs-only change, and run on a ready pull request, the trunk and nightly -
  # not on a draft.
  heavy:
    needs: [changes, gate]
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-xlarge-merge' || 'sylphx-linux-xlarge' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: echo "full build, e2e, mobile"

  # The required check. Skipped jobs pass; failed or cancelled ones fail.
  ci-ok:
    if: always()
    needs: [changes, gate, heavy]
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@main
        with:
          needs: ${{ toJSON(needs) }}
          required: changes
