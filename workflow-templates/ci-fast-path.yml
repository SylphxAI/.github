# Fast-path CI: docs-only pull requests skip the heavy jobs, a new push
# supersedes the pull request's run, heavy jobs wait for the cheap gate, and
# one `ci-ok` aggregate (skipped = pass) is the required check. See
# docs/ci-template.md in SylphxAI/.github. Replace each `@main` with the
# commit you adopt (callers pin by commit), then fill in the jobs. Install
# pr-metadata.yml alongside this workflow for title, body and ready events.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:
    inputs:
      code-merge:
        type: string
      code-head:
        type: string
      code-base:
        type: string
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: SylphxAI/.github/.github/workflows/changes.yml@main

  # The cheap gate: format, lint, typecheck, unit tests. Standard runner.
  gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
      - uses: SylphxAI/.github/.github/actions/cache-toolchain@main
        with:
          toolchain: npm
      - run: echo "format, lint, typecheck, unit tests"

  # Heavy jobs (release build, e2e, iOS/Android) wait for the gate, skip on a
  # docs-only change. Drafts run the same checks: marking ready is metadata
  # only and must never restart or cancel the head's code evidence.
  heavy:
    needs: [changes, gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-xlarge-merge' || 'sylphx-linux-xlarge' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
      - run: echo "full build, e2e, mobile"

  # The required check. Skipped jobs pass; a failed job fails; a cancelled job
  # (a superseded push) is reported CANCELLED and does not fail.
  ci-ok:
    if: always() && !cancelled()
    needs: [changes, gate, heavy]
    # The current workflow's verdict has a reserved seat; superseded workflows
    # must not publish a stale red aggregate beside their replacement.
    runs-on: sylphx-linux-control
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@main
        with:
          separate-pr-metadata: 'true'
          needs: ${{ toJSON(needs) }}
          required: changes
