# Review policy for SylphxAI/.github, read by the desk review gate from the base branch, so a pull request cannot
# lower its own tier. Paths are globs: `*` stays in one path segment, `**/` is any number of directories; matching is
# case-sensitive. This file itself is always reviewed. Bump `version` with every change; a tier-0 change that is later
# reverted moves its glob out of tier0 in the same change.
version = 1

# Every changed file here, and none under [review]: review-ok passes as tier 0; ci-ok still gates the merge. Docs
# that are not policy, and test code.
[tier0]
paths = ["**/*.md", "tests/**"]

# Any changed file here is always reviewed. This repository is org-wide CI and policy, so most of its prose is rules.
[review]
paths = [
  # shared CI, reusable actions and workflow templates, rulesets and their policy
  ".github/**", "workflow-templates/**", "templates/**", "policy/**", "scripts/**",
  # agent instructions, company and project rules, security policy, decision records and CI policy docs
  "**/AGENTS.md", "**/CLAUDE.md", "**/SKILL.md", "COMPANY.md", "PROJECT.md", "SECURITY.md", "docs/**",
  # the data a check compares against, and build files, even under tests/
  "**/fixtures/**", "**/*.json", "**/*.yaml", "**/*.yml", "**/*.sh", "**/*.sql", "**/*.toml",
]

# Nothing here is regenerated by CI and compared.
[generated]
paths = []

[format]
rust_edition = "2021"
