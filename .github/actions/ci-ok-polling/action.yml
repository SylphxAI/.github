name: ci-ok-polling
description: >
  Legacy aggregate gate for repositories whose checks live in several workflows or in
  path-filtered workflows, where one ci-ok job cannot `needs:` them all. Waits
  for every other GitHub Actions check run on the commit to complete before
  passing, but fails immediately if any concluded failure, cancellation or
  timeout, even while others are pending (skipped and neutral pass). Make the job
  that runs it the required status check. Where all gating jobs share one
  workflow, use the strict ci-ok action with explicit job dependencies instead.

inputs:
  token:
    description: "Token that can read check runs (the job needs `checks: read`)."
    default: ${{ github.token }}
  job-name:
    description: Name of the calling job's check run, ignored while waiting.
    default: ci-ok
  ignore:
    description: Comma-separated check names to ignore (advisory checks).
    default: ""
  timeout-minutes:
    description: Give up after this many minutes.
    default: "110"
  all-apps:
    description: "Also wait for check runs from other apps (deploy and preview statuses). Default: GitHub Actions only."
    default: "false"

runs:
  using: composite
  steps:
    - name: Require successful cross-workflow checks
      shell: bash
      env:
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        TOKEN: ${{ inputs.token }}
        SELF_NAME: ${{ inputs.job-name }}
        CI_OK_IGNORE: ${{ inputs.ignore }}
        CI_OK_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        CI_OK_ALL_APPS: ${{ inputs.all-apps }}
      run: python3 "$GITHUB_ACTION_PATH/ci_ok.py"
