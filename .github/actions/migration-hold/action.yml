name: migration-hold
description: >
  The queue side of the red-main migration hold. While an open issue labelled
  `red-main-migration-hold` exists (the red-main handler opens one when a red
  commit changes a migration and so is never auto-reverted), a merge-queue
  group fails unless its pull request carries `red-main-forward-fix`. The
  forward-fix pull request itself passes, so the queue drains through it.
  Runs on `merge_group` only; every other event passes. On a merge group it
  fails closed: an API error (retried three times) fails the job, because a
  token that cannot read issues would otherwise switch the hold off for good.
  In a batched group every pull request must carry the label. Add the job that
  runs this action to `ci-ok`'s `needs`. The token needs `issues: read` and
  `pull-requests: read`.

inputs:
  token:
    description: Token that can read issues and pull requests.
    default: ${{ github.token }}
  hold-label:
    description: Label of the hold issue.
    default: red-main-migration-hold
  forward-fix-label:
    description: Label that lets a pull request through the hold.
    default: red-main-forward-fix

runs:
  using: composite
  steps:
    - name: No merge while a migration hold is open
      shell: bash
      env:
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        HEAD_REF: ${{ github.event.merge_group.head_ref }}
        BASE_SHA: ${{ github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        TOKEN: ${{ inputs.token }}
        HOLD_LABEL: ${{ inputs.hold-label }}
        FIX_LABEL: ${{ inputs.forward-fix-label }}
      run: python3 "$GITHUB_ACTION_PATH/migration_hold.py"
