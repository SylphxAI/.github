name: rust-sccache
description: >
  Rust compile cache for a CI job: installs a pinned, checksum-verified
  sccache, points it at a backend and sets RUSTC_WRAPPER, so every rustc
  invocation after this step is served from the cache when it can be. Run it
  after the Rust toolchain is installed and before the first cargo command.
  Backend, first that applies (backend.sh): (1) BuildCache, the platform's
  compile-cache gateway: the job's GitHub OIDC token (the job needs
  `permissions: id-token: write`) is exchanged for a run token scoped by the
  event - main, the merge queue and schedules write the protected scope, every
  other event a dev scope that reads protected - and the token goes only to
  the sccache server, never to the job's environment; (2) the organization's
  own bucket when the s3-* inputs carry its SYLPHX_CI_CACHE_* pair; (3) the
  repository's GitHub Actions cache, which needs no secret. A backend that
  fails or whose server will not start falls through to the next. Never the
  platform's ci-sccache bucket. The cache only ever speeds a job up: if no
  backend works the job compiles cold and says so. Linux x86_64 only; on any
  other runner it does nothing.

inputs:
  s3-access-key:
    description: >
      S3 access key - the organization secret SYLPHX_CI_CACHE_ACCESS_KEY, an
      object-store user of the organization's own (never shared across
      organizations). The fallback when BuildCache is not available to the
      job. Empty selects the GitHub Actions cache backend.
    default: ""
  s3-secret-key:
    description: S3 secret key.
    default: ""
  s3-endpoint:
    description: S3 endpoint URL.
    default: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
  s3-bucket:
    description: >
      S3 bucket. Empty means `ci-sccache-<organization, lowercase>`, created on
      first use with a 14-day expiry so the cache stays bounded.
    default: ""
  key-prefix:
    description: >
      Prefix for every cache entry, inside the organization's cache.
      Defaults to the repository, so no two repositories share entries.
    default: ${{ github.repository }}
  actions-cache:
    description: >
      "false" skips the GitHub Actions cache backend, for a caller that brings
      its own fallback (read the `backend` output).
    default: "true"
  build-cache:
    description: >
      "false" skips the BuildCache backend (it is also skipped when the job
      has no `id-token: write` permission).
    default: "true"
  build-cache-url:
    description: BuildCache gateway URL.
    default: https://build-cache.sylphx.net
  build-cache-network:
    description: >
      Which of the gateway's endpoints the run token is for: `public`, or
      `cluster` for jobs on the platform's own network.
    default: public

outputs:
  backend:
    description: >
      The backend sccache runs on - buildcache|static|gha|none - also written
      to the job summary.
    value: ${{ steps.sccache.outputs.backend }}

runs:
  using: composite
  steps:
    - name: Export the Actions cache service to sccache
      if: inputs.s3-access-key == '' && inputs.actions-cache != 'false' && runner.os == 'Linux' && runner.arch == 'X64'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      with:
        script: |
          // Only a JavaScript action sees these; sccache reads them from the environment.
          for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_SERVICE_V2']) {
            if (process.env[name]) core.exportVariable(name, process.env[name]);
          }
    - name: sccache
      id: sccache
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        VERSION: v0.18.0
        SHA256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
        S3_ACCESS_KEY: ${{ inputs.s3-access-key }}
        S3_SECRET_KEY: ${{ inputs.s3-secret-key }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        KEY_PREFIX: ${{ inputs.key-prefix }}
        ACTIONS_CACHE: ${{ inputs.actions-cache }}
        BUILD_CACHE: ${{ inputs.build-cache }}
        BUILD_CACHE_URL: ${{ inputs.build-cache-url }}
        BUILD_CACHE_NETWORK: ${{ inputs.build-cache-network }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/sccache-bin"
        mkdir -p "$dir"
        name="sccache-$VERSION-x86_64-unknown-linux-musl"
        curl --retry 5 --retry-connrefused -sSfL -o "$dir/sccache.tgz" \
          "https://github.com/mozilla/sccache/releases/download/$VERSION/$name.tar.gz"
        echo "$SHA256  $dir/sccache.tgz" | sha256sum -c --quiet
        tar -xzf "$dir/sccache.tgz" -C "$dir" --strip-components=1 "$name/sccache"
        echo "$dir" >> "$GITHUB_PATH"
        export PATH="$dir:$PATH"
        # Incremental artifacts are not cacheable, and sccache refuses them.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
        . "$GITHUB_ACTION_PATH/start.sh"
