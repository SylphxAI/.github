name: setup-keel-tools
description: >
  Puts the keel CLI, built from the Keel rev a title pins, and the wasm-bindgen
  CLI, at the version the title's Cargo.lock pins, on PATH. Each has a separate
  cache per runner OS and arch, its own revision/features and this action's
  installer, so moving one pin never rebuilds the other tool; a warm run
  logs "keel tools from cache" and takes seconds. Run it after checkout and the
  Rust toolchain (and rust-sccache, which speeds the cold build). See
  docs/setup-keel-tools.md.

inputs:
  pin:
    description: The Keel commit (40 hex). Empty reads pin-file.
    default: ""
  pin-file:
    description: File holding the Keel commit, relative to working-directory.
    default: KEEL_PIN
  wasm-bindgen:
    description: >
      "auto" installs the version Cargo.lock pins for the wasm-bindgen crate,
      "none" skips it, or an exact x.y.z.
    default: auto
  cargo-lock:
    description: Lockfile read when wasm-bindgen is auto, relative to working-directory.
    default: Cargo.lock
  keel-src:
    description: An existing Keel checkout at the pin to build from; empty clones SylphxAI/keel.
    default: ""
  features:
    description: >
      Extra cargo features for the keel CLI, on top of its defaults, as `cargo
      install --features` takes them (space or comma separated). A title whose
      keel.toml encodes GPU textures needs `texture-encoder`.
    default: ""
  working-directory:
    description: Directory that holds pin-file and cargo-lock.
    default: .

outputs:
  bin:
    description: The directory holding keel and wasm-bindgen (already on PATH).
    value: ${{ steps.key.outputs.root }}/bin
  cache-hit:
    description: '"true" when every requested tool came from the cache.'
    value: ${{ steps.restore-keel.outputs.cache-hit == 'true' && (steps.key.outputs.wasm-bindgen == 'none' || steps.restore-bindgen.outputs.cache-hit == 'true') }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KEEL_PIN: ${{ inputs.pin }}
        KEEL_PIN_FILE: ${{ inputs.pin-file }}
        WASM_BINDGEN: ${{ inputs.wasm-bindgen }}
        CARGO_LOCK: ${{ inputs.cargo-lock }}
        KEEL_FEATURES: ${{ inputs.features }}
        INSTALLER: ${{ github.action_path }}/install-keel-tools.sh
      run: |
        set -euo pipefail
        keel="$(bash "$INSTALLER" key keel)"
        bindgen="$(bash "$INSTALLER" key wasm-bindgen)"
        script="$(sha256sum "$INSTALLER" | cut -c1-12)"
        echo "keel-key=keel-tools-${RUNNER_OS}-${RUNNER_ARCH}-${keel}-${script}" >> "$GITHUB_OUTPUT"
        echo "bindgen-key=keel-tools-${RUNNER_OS}-${RUNNER_ARCH}-${bindgen}-${script}" >> "$GITHUB_OUTPUT"
        echo "wasm-bindgen=${bindgen#wasm-bindgen-}" >> "$GITHUB_OUTPUT"
        echo "root=${RUNNER_TEMP}/keel-tools" >> "$GITHUB_OUTPUT"
    - id: restore-keel
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.root }}/keel
        key: ${{ steps.key.outputs.keel-key }}
    - id: restore-bindgen
      if: steps.key.outputs.wasm-bindgen != 'none'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.root }}/wasm-bindgen
        key: ${{ steps.key.outputs.bindgen-key }}
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KEEL_PIN: ${{ inputs.pin }}
        KEEL_PIN_FILE: ${{ inputs.pin-file }}
        WASM_BINDGEN: ${{ inputs.wasm-bindgen }}
        CARGO_LOCK: ${{ inputs.cargo-lock }}
        KEEL_SRC: ${{ inputs.keel-src }}
        KEEL_FEATURES: ${{ inputs.features }}
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        INSTALLER: ${{ github.action_path }}/install-keel-tools.sh
        ROOT: ${{ steps.key.outputs.root }}
      run: bash "$INSTALLER" install "$ROOT"
    # Saved right after a build, so a later failing step still leaves it for the next run.
    - if: steps.restore-keel.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.root }}/keel
        key: ${{ steps.key.outputs.keel-key }}
    - if: steps.key.outputs.wasm-bindgen != 'none' && steps.restore-bindgen.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.root }}/wasm-bindgen
        key: ${{ steps.key.outputs.bindgen-key }}
