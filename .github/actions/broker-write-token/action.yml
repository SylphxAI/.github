name: broker-write-token
description: Exchange this signed job identity for one repository through Access and Broker. No PEM, fallback, persisted
  token URL or retried write. Read-only uses the separate ExchangeReadToken RPC.
inputs:
  trust-policy:
    description: The Kernel Broker TrustPolicy, `orgs/{org}/trust_policies/{policy}`.
    required: true
  ci-name:
    description: The `[[ci]]` declaration name this workflow exchanges under. Defaults to the TrustPolicy id (the
      last path segment).
    required: false
    default: ''
  repository:
    description: The one repository the token may cover, `owner/name`.
    required: true
  api-url:
    description: Platform API base URL.
    required: false
    default: https://api.sylphx.com
  soft-fail:
    description: '`true` writes the reason to the `failure` output and succeeds instead of failing the step; the
      caller reports it by name. Default `false`.'
    required: false
    default: 'false'
  permissions:
    description: Explicit JSON map of GitHub permissions; empty inherits policy only for ordinary exchange.
    required: false
    default: '{}'
  read-only:
    description: true selects ExchangeReadToken; explicit read permissions required.
    required: false
    default: 'false'
  app-slug:
    description: Optional bot slug, checked against the returned issuer via public GitHub App metadata.
    required: false
    default: ''
  expected-issuer:
    description: Optional exact issuer pin, github-apps/{numeric id}.
    required: false
    default: ''
  expected-connection:
    description: Optional exact canonical Connection resource pin.
    required: false
    default: ''
outputs:
  token:
    description: The installation token, empty when the exchange failed.
    value: ${{ steps.exchange.outputs.token }}
  app-slug:
    description: The App's slug, for the git bot identity.
    value: ${{ steps.exchange.outputs.app-slug }}
  failure:
    description: A one-line reason when the exchange failed, empty on success.
    value: ${{ steps.exchange.outputs.failure }}
  issuer:
    description: Authoritative nonsecret Broker issuer.
    value: ${{ steps.exchange.outputs.issuer }}
  connection:
    description: Authoritative nonsecret Broker connection.
    value: ${{ steps.exchange.outputs.connection }}
  expire-time:
    description: Authoritative nonsecret Broker expire-time.
    value: ${{ steps.exchange.outputs.expire-time }}
  token-exchange:
    description: Authoritative nonsecret Broker token-exchange.
    value: ${{ steps.exchange.outputs.token-exchange }}
  permissions:
    description: Authoritative nonsecret Broker permissions.
    value: ${{ steps.exchange.outputs.permissions }}
runs:
  using: composite
  steps:
  - name: Exchange the OIDC token for an installation token
    id: exchange
    shell: bash
    env:
      BROKER_POLICY: ${{ inputs.trust-policy }}
      BROKER_CI_NAME: ${{ inputs.ci-name }}
      REPO: ${{ inputs.repository }}
      API_URL: ${{ inputs.api-url }}
      SOFT_FAIL: ${{ inputs.soft-fail }}
      READ_ONLY: ${{ inputs.read-only }}
      PERMISSIONS: ${{ inputs.permissions }}
      APP_SLUG: ${{ inputs.app-slug }}
      EXPECTED_ISSUER: ${{ inputs.expected-issuer }}
      EXPECTED_CONNECTION: ${{ inputs.expected-connection }}
    run: python3 "$GITHUB_ACTION_PATH/exchange.py"
