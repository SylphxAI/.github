name: main-red-gate
description: >
  Judge trunk Verify at the merge group's base SHA. An optional verdict-check
  job decides before trailing jobs finish. On red, ordinary groups wait up to
  hold-minutes for a newer pending verdict instead of leaving the queue
  immediately; green admits, red or expiry refuses. Reverts, outage fixes and
  labelled fixes pass immediately. An open fix holds the line; nothing in
  motion or an unreadable state admits with a warning. Needs actions: read,
  contents: read and pull-requests: read.

inputs:
  token:
    description: Token that can read workflow runs/jobs, commit ancestry and pull requests.
    default: ${{ github.token }}
  verify-workflow:
    description: File name of the post-merge verify workflow, e.g. verify.yml.
    default: verify.yml
  verdict-check:
    description: >
      Exact workflow job name of the authoritative Verify verdict, e.g.
      full-suite / suite-ok. Its completed verdict decides even when trailing
      jobs keep the run alive. Empty preserves run-conclusion behaviour.
      Ignored in watch mode.
    default: ""
  hold-minutes:
    description: >
      Maximum time to hold an ordinary merge group while a newer Verify
      verdict is pending. Polls every 60 seconds; defaults to 20 minutes.
      Must stay below the repository's merge-queue check timeout, allowing
      margin for API calls and other gate steps. Zero disables waiting.
    default: "20"
  mode:
    description: >
      `enforce` fails the gate while the trunk is red, its way back is in
      motion and the change is not that way back; `observe` only prints what
      it would have done (adoption canary); `watch` runs on a schedule instead
      of a merge group and files one issue per repository when the trunk has
      stayed red past `watch-limit-minutes`, whatever the red-main handler's
      verdict was (watch the watcher).
    default: enforce
  watch-limit-minutes:
    description: >
      In `watch` mode, how long the trunk may stay red before the watchdog
      alerts. 30 by default.
    default: "30"
  fix-label:
    description: >
      Label that marks a pull request as the fix for the red trunk. A revert
      needs none: a branch `auto-revert/*`, a title starting `Revert`, or the
      `auto-revert` / `queue-jump:red-main` labels of the red-main handler.
      A live-outage fix (`queue-jump:outage`) is admitted the same way.
    default: main-red-fix

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPO: ${{ github.repository }}
        TOKEN: ${{ inputs.token }}
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        BASE_SHA: ${{ github.event.merge_group.base_sha }}
        VERDICT_CHECK: ${{ inputs.verdict-check }}
        HOLD_MINUTES: ${{ inputs.hold-minutes }}
        BASE_BRANCH: ${{ github.event.merge_group.base_ref || github.event.repository.default_branch }}
        VERIFY_WORKFLOW: ${{ inputs.verify-workflow }}
        MODE: ${{ inputs.mode }}
        WATCH_LIMIT_MINUTES: ${{ inputs.watch-limit-minutes }}
        FIX_LABEL: ${{ inputs.fix-label }}
      run: python3 "$GITHUB_ACTION_PATH/main_red_gate.py"
