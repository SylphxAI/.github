name: migration-guard
description: Refuse destructive SQL, schema contractions and changes to already merged migrations.

inputs:
  dialect:
    description: SQL dialect (postgres or mysql).
    required: true
  dialect-from-suffix:
    description: Route .mysql.sql and .postgresql.sql migrations by filename; other migrations and schema snapshots use dialect.
    default: 'false'
  migration-directories:
    description: Repository-relative migration directories, one per line; SQL files are read recursively.
    default: ''
  schema-files:
    description: Repository-relative CREATE TABLE schema snapshots to compare, one file per line. Configure this or migration-directories, or both.
    default: ''
  base-ref:
    description: Base Git commit; defaults to the pull request, merge group, or push base.
    default: ''
  head-ref:
    description: Head Git commit; defaults to the event head.
    default: ''
  concurrent-index-runtime:
    description: Explicit supported runtime contract for PostgreSQL concurrent indexes (atlas-qualified-v1). Empty refuses new concurrent CREATE intent.
    default: ''

runs:
  using: composite
  steps:
    - name: Check migration safety
      shell: bash
      env:
        MIGRATION_DIALECT: ${{ inputs.dialect }}
        MIGRATION_DIALECT_FROM_SUFFIX: ${{ inputs.dialect-from-suffix }}
        MIGRATION_DIRECTORIES: ${{ inputs.migration-directories }}
        MIGRATION_SCHEMA_FILES: ${{ inputs.schema-files }}
        MIGRATION_BASE: ${{ inputs.base-ref }}
        MIGRATION_HEAD: ${{ inputs.head-ref }}
        MIGRATION_CONCURRENT_INDEX_RUNTIME: ${{ inputs.concurrent-index-runtime }}
      run: python3 "$GITHUB_ACTION_PATH/migration_guard.py"
