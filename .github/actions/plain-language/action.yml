name: Plain language
description: >
  Flags a coined term that the company replaces with standard
  vocabulary (owner standards/docs.md, "Plain language"). Checks only the lines
  this pull request or merge group adds, so existing text does not block a
  change. The action owns checkout: two commits for merge groups and pushes,
  or a blobless commit graph for pull-request merge-base calculation. A line that must keep
  a term (quoting it, or a standard sense) carries `plain-language: allow`.
  With `list: product-names`, a platform repository fails a change that names a
  product (owner standards/architecture.md).

inputs:
  list:
    description: Which list to enforce, `terms` (coined jargon) or `product-names` (platform repositories).
    required: false
    default: terms
  mode:
    description: >
      `warn` annotates hits and passes; `fail` fails the job. Coined-term lists are
      open-ended, so `terms` stays advisory; `product-names` is a closed list and fails.
    required: false
    default: ""
  exclude:
    description: Newline-separated git pathspecs to skip, for example tests or recorded evidence.
    required: false
    default: ""
  baseline:
    description: >
      Path of the repository's committed ratchet baseline (path, name, count per line, tab
      separated), for example `.plain-language-baseline.tsv`. When set, the check scans every
      tracked file instead of only added lines: a hit above its baseline count fails, and a
      baselined hit that is gone must be removed from the baseline, so it only shrinks.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout the checked revision
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '2' }}
        filter: blob:none
        persist-credentials: true
    - name: Check added lines for coined terms
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        GIT_SHA: ${{ github.sha }}
        LIST: ${{ inputs.list }}
        MODE: ${{ inputs.mode }}
        EXCLUDE: ${{ inputs.exclude }}
        PLAIN_LANGUAGE_BASELINE: ${{ inputs.baseline }}
      run: |
        set -euo pipefail
        range="$(bash "$GITHUB_ACTION_PATH/range.sh")"
        case "$LIST" in
          terms) mode="${MODE:-warn}" ;;
          product-names) mode="${MODE:-fail}" ;;
          *) echo "::error::unknown list '$LIST'"; exit 1 ;;
        esac
        export PLAIN_LANGUAGE_MODE="$mode"
        specs=()
        while IFS= read -r p; do [ -n "$p" ] && specs+=(":(exclude)$p"); done <<<"$EXCLUDE"
        "$GITHUB_ACTION_PATH/check.sh" "$range" "$GITHUB_ACTION_PATH/$LIST.tsv" ${specs[@]+"${specs[@]}"}
