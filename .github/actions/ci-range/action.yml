name: ci-range
description: >
  The commit range a CI run covers and which of the caller's lanes it
  selects - one answer for the merge-queue gate and the post-merge verify
  workflow (docs/optimistic-merge.md). Pull request: its base. Merge group:
  the group's base. Push or dispatch: the last commit whose full suite passed
  (the newest ancestor with an authenticated successful `verified` job from
  a full push of the approved workflow on the tracked branch). Schedule: everything.
  Outputs `base`, `run` (JSON lane -> bool; use
  `fromJSON(needs.<job>.outputs.run).<lane>`) and `changed`.
  The base is read one commit at a time, newest first, so its cost follows
  the range and never the length of the history. Run history itself is read
  unfiltered, because GitHub caps a filtered run list at 1,000 results, and
  must have a valid, stable total_count and complete pages within 50 pages of
  100 rows. Missing, inconsistent or larger history is unavailable, never an
  older proof or a confirmed absent predecessor.
  Previous failing lanes also require complete jobs with valid names,
  run membership, completed statuses and recognized conclusions.
  The job needs `actions: read` and `checks: read`, and a checkout of HEAD
  (any depth: the base commit, and on a push the history, are fetched
  without blobs).

inputs:
  mode:
    description: "range (default), or run to authenticate a post-main run's verified verdict."
    default: range
  proof-run:
    description: "Run id for mode=run; empty selects the newest full push of the approved workflow."
    default: ""
  proof-workflow:
    description: Approved workflow file for mode=run.
    default: verify.yml
  proof-branch:
    description: Tracked branch for mode=run.
    default: main
  lanes:
    description: >
      One lane per line, `name: pattern pattern ...`. Patterns are fnmatch
      globs over repository paths where `*` also crosses `/`. A lane with no
      pattern, or with `*`, always runs. Global patterns also select every
      lane. Omit lanes for range outputs only; `run` is then `{}`.
    required: false
    default: ""
  global-patterns:
    description: >
      Whitespace-separated fnmatch globs over repository-relative paths;
      `*` also crosses `/`. A matching changed file selects every lane.
      Defaults to `.github/*`; caller patterns replace that default.
      Set to an empty string to disable global matching. Without a trusted
      base, every lane still runs (unless `only` selects named lanes).
    default: ".github/*"
  only:
    description: >
      Comma-separated lanes to run, whatever the range selected (the verify
      workflow's dispatch input, which the red-main handler fills with the
      failed job names). Names that are not lanes are ignored; if none is a
      lane, the range's selection runs.
    default: ""
  reuse-workflow:
    description: "Opt-in queue workflow filename for exact-source reuse on a default-branch push only."
    default: ""
  reuse-aggregate:
    description: "Exact successful aggregate job name in reuse-workflow, separate from lane jobs."
    default: ""
  reuse-jobs:
    description: 'JSON object mapping declared lanes to nonempty arrays of exact queue job names; e.g. {"test":["tests"]}. No matrix or reusable-job name normalization.'
    default: ""
  token:
    description: Token that can read this repository's workflow runs and check runs.
    default: ${{ github.token }}

outputs:
  verdict:
    description: "Authenticated verified verdict for mode=run; ineligible names a non-proof producer, unknown is unverified and keeps recovery active."
    value: ${{ steps.range.outputs.verdict }}
  base:
    description: The base commit, or empty when every lane runs.
    value: ${{ steps.range.outputs.base }}
  run:
    description: JSON object mapping each lane to true or false.
    value: ${{ steps.range.outputs.run }}
  execute:
    description: "JSON lane selection after exact-source reuse; equals run when disabled or unproven."
    value: ${{ steps.range.outputs.execute }}
  reused:
    description: "JSON lane to boolean authenticated queue reuse; never changes the ordinary run output."
    value: ${{ steps.range.outputs.reused }}
  reuse-proof:
    description: "JSON authenticated queue run/attempt/source/job/check identities, or an empty object."
    value: ${{ steps.range.outputs.reuse-proof }}
  changed:
    description: Number of changed files, or empty when there is no base.
    value: ${{ steps.range.outputs.changed }}

runs:
  using: composite
  steps:
    - id: range
      shell: bash
      env:
        PROOF_MODE: ${{ inputs.mode }}
        PROOF_IDENTITY: ${{ inputs.proof-run }}
        PROOF_WORKFLOW: ${{ inputs.proof-workflow }}
        PROOF_BRANCH: ${{ inputs.proof-branch }}
        REUSE_WORKFLOW: ${{ inputs.reuse-workflow }}
        REUSE_AGGREGATE: ${{ inputs.reuse-aggregate }}
        REUSE_JOBS: ${{ inputs.reuse-jobs }}
        LANES: ${{ inputs.lanes }}
        GLOBAL_PATTERNS: ${{ inputs.global-patterns }}
        ONLY: ${{ inputs.only }}
        TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/ci_range.py"
