name: Auth surface guard
description: >
  Enforces the group-wide Single Source of Truth (SSOT) Passwordless Auth
  standard across product repositories: rejects new standalone /signup,
  /register, or /forgot-password routes, handwritten <input type="password">
  forms in product web UIs, and public web SMS OTP sign-in surfaces, while
  preserving shared Sylphx Auth / @sylphx/apps implementations and legacy
  live-title continuity (# auth-surface-guard: allow(legacy-continuity)).
inputs:
  base-ref:
    description: Git base for the diff or to verify full-mode inheritance. Defaults to the PR or merge group base SHA, or the push before SHA in diff mode.
    default: ""
  base:
    description: Legacy alias for base-ref. Ignored when base-ref is set.
    default: ""
  strict:
    description: Require a base in diff mode and verify inheritance for full-mode waivers. Full mode can audit without a base.
    default: 'true'
  head:
    description: Head commit of the diff or full audit.
    default: HEAD
  root:
    description: Repository checkout root to inspect.
    default: .
  mode:
    description: diff (added findings) or full (committed-tree audit).
    default: diff
  baseline:
    description: Tracked auth departures file, relative to root (full mode only).
    default: ""
  token:
    description: Read-only GitHub token to check sylphx_delivery custom property.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Enforce unified passwordless auth surface contract
      shell: bash
      env:
        AUTH_GUARD_BASE_REF: ${{ inputs.base-ref }}
        AUTH_GUARD_BASE: ${{ inputs.base }}
        AUTH_GUARD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        AUTH_GUARD_MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        AUTH_GUARD_PUSH_BEFORE: ${{ github.event.before }}
        AUTH_GUARD_STRICT: ${{ inputs.strict }}
        AUTH_GUARD_HEAD: ${{ inputs.head }}
        AUTH_GUARD_ROOT: ${{ inputs.root }}
        AUTH_GUARD_MODE: ${{ inputs.mode }}
        AUTH_GUARD_BASELINE: ${{ inputs.baseline }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        if [ -n "${GITHUB_REPOSITORY:-}" ] && [ -n "${GH_TOKEN:-}" ]; then
          delivery="$(gh api "repos/$GITHUB_REPOSITORY/properties/values" \
            --jq '.[] | select(.property_name == "sylphx_delivery") | .value' 2>/dev/null || true)"
          if [ "$delivery" = "delivered" ]; then
            echo "::notice::$GITHUB_REPOSITORY is a delivered customer repository; auth-surface-guard is skipped."
            exit 0
          fi
        fi
        base="${AUTH_GUARD_BASE_REF:-$AUTH_GUARD_BASE}"
        if [ -z "$base" ]; then
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$AUTH_GUARD_PR_BASE" ;;
            merge_group) base="$AUTH_GUARD_MERGE_GROUP_BASE" ;;
            push)
              if [ "$AUTH_GUARD_MODE" = diff ]; then
                base="$AUTH_GUARD_PUSH_BEFORE"
              fi
              ;;
          esac
        fi
        if [ "$AUTH_GUARD_MODE" = diff ] && [ -z "$base" ]; then
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group|push)
              echo '::error::auth-surface-guard: event base revision is required for diff mode'
              exit 2
              ;;
          esac
        fi
        strict=()
        case "$AUTH_GUARD_STRICT" in
          true) strict=(--strict) ;;
          false) ;;
          *)
            echo '::error::auth-surface-guard: strict must be true or false'
            exit 2
            ;;
        esac
        python3 "$GITHUB_ACTION_PATH/check.py" \
          --root "$AUTH_GUARD_ROOT" \
          --base "$base" \
          --head "$AUTH_GUARD_HEAD" --mode "$AUTH_GUARD_MODE" --baseline "$AUTH_GUARD_BASELINE" "${strict[@]}"
