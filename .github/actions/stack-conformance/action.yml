name: stack-conformance
description: >
  Fails a change that adds a departure from the default stack (SylphxAI/skills
  skills/self-challenge/references/stack.md): a backend service on a runtime other than Rust (a
  TypeScript server framework as a runtime dependency, or a sylphx.toml
  service built on a Bun or Node image that is not a web app), or a
  `[database.migrations]` engine other than atlas. Departures a repository
  already has are listed in its baseline file, which may only shrink: a line
  the base did not have fails, and so does a line whose departure is gone.
  A base without the file accepts the head's file as the seed. Reads git
  objects only; needs a checkout of the head (any depth) and fetches the base
  commit without blobs when it is missing. It also fails a product repository
  that holds an agent-runtime part Sylphx Agents owns (a vault-proxy,
  egress-guard, credential-crypto or agent-harness package, or a session-log,
  tool-call or agent-memory table) unless policy/agent-runtime.json in this
  repository lists it and its expiry date has not passed. A delivered customer
  repository (custom property sylphx_delivery = delivered) is not checked.
  With a base, it also fails a SQL file added since the base that creates a
  work-engine table (a status, an assignee or role, and a due date, deadline,
  SLA, overdue or escalation column) unless the file's header names the Work
  resource it feeds or says `customer records (Work ADR 0010 D1)`; and a
  knowledge-graph or CRM table (a name starting kg_, knowledge_ or crm_, or
  entities, entity, relations, relation, contacts, contact or
  customer_profiles) unless policy/knowledge-tables.json here records it for
  the repository and its expiry date has not passed.
  Keel game consumers also reject local *Sku structs, *_pixels functions
  returning Vec<u8>, and docs/BUILDING.md or scripts/measure-rust-debug.py
  boilerplate. These boundaries cannot be waived in the local baseline.
  See docs/stack-conformance.md.
  The same action reports C1–C7 structural regressions with exact commit,
  file, line and contract, keeping inherited findings and recorded decisions
  visible. A passing check is not a semantic census.

inputs:
  base:
    description: Base commit of the change (the ci-range `base` output). Empty checks the head against its own baseline.
    default: ""
  head:
    description: Head commit to check.
    default: HEAD
  baseline:
    description: Baseline file, relative to the repository root.
    default: .github/stack-departures.txt
  token:
    description: Token that reads the repository's custom properties (the delivered-customer exclusion).
    default: ${{ github.token }}

outputs:
  report:
    description: Local JSON report path (findings, exceptions, coverage and limits).
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Stack and architecture conformance
      id: check
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD_REV: ${{ inputs.head }}
        BASELINE: ${{ inputs.baseline }}
        GH_TOKEN: ${{ inputs.token }}
        STACK_CONFORMANCE_CHECKER_COMMIT: ${{ github.action_ref || github.sha }}
      run: |
        # Delivered customer repositories are hands-off; an unreadable property
        # leaves the check on.
        delivery="$(gh api "repos/$GITHUB_REPOSITORY/properties/values" \
          --jq '.[] | select(.property_name == "sylphx_delivery") | .value' 2>/dev/null || true)"
        if [ "$delivery" = "delivered" ]; then
          echo "::notice::$GITHUB_REPOSITORY is a delivered customer repository; stack conformance is not checked."
          exit 0
        fi
        report="$RUNNER_TEMP/stack-conformance-report.json"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        python3 "$GITHUB_ACTION_PATH/stack_conformance.py" check --base "$BASE" --head "$HEAD_REV" --baseline "$BASELINE" --report "$report"
