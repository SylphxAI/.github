name: stack-conformance
description: >
  Fails a change that adds a departure from the default stack (SylphxAI/skills
  skills/self-challenge/references/stack.md): a backend service on a runtime other than Rust (a
  TypeScript server framework as a runtime dependency, or a sylphx.toml
  service built on a Bun or Node image that is not a web app), or a
  `[database.migrations]` engine other than sylphx or transitional atlas.
  A repository lists existing departures in its baseline, which may only shrink:
  a line the base did not have fails; a fixed departure is an informational notice.
  A base without the file accepts the head's file as the seed. Reads git
  objects only; needs a checkout of the head (any depth) and fetches the base
  commit without blobs when it is missing. A confirmed delivered customer
  repository is not checked.
  Vendor model version literals in product source must use the runtime
  default or a Sylphx AI <provider>/<line>-latest alias. Existing literals
  use a separate shrinking model-pin category in the repository baseline.
  Shared SylphxAI/.github references are checked offline for full commit SHAs
  (the source repository also allows @main for its own references).
  Repository automation also refuses forced branch updates, including force
  options, + refspecs, mirror pushes and forced GitHub branch-ref PATCH calls.
  Exact inherited occurrences use an independently shrinking force-push baseline.
  Rust source reachability also rejects disconnected .rs files beneath Cargo
  packages without compiling; exact reasoned template/vendor exceptions live in
  .rust-reachability.json. See docs/rust-source-reachability.md.
  See docs/stack-conformance.md.
  The same action reports C1–C7 structural regressions with exact commit,
  file, line and contract, keeping inherited findings and recorded decisions
  visible. A passing check is not a semantic census.

inputs:
  base:
    description: Base commit of the change (the ci-range `base` output). Empty checks the head against its own baseline.
    default: ""
  head:
    description: Head commit to check.
    default: HEAD
  baseline:
    description: Baseline file, relative to the repository root.
    default: .github/stack-departures.txt
  model-aliases:
    description: Optional offline catalog alias declaration to tighten the naming contract. Path in the checked checkout; empty permits <provider>/<line>-latest.
    default: ""
  auth-surface:
    description: Opt in to the passwordless auth gate (diff or full); off keeps existing callers unchanged.
    default: "off"
  auth-baseline:
    description: Tracked auth departures file, relative to the repo root (full mode only).
    default: ""
  token:
    description: Optional token to read caller custom properties. Not needed for the pin format check.
    default: ${{ github.token }}

outputs:
  report:
    description: Local JSON report path (findings, exceptions, coverage and limits).
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Stack and architecture conformance
      id: check
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD_REV: ${{ inputs.head }}
        BASELINE: ${{ inputs.baseline }}
        MODEL_ALIASES: ${{ inputs.model-aliases }}
        AUTH_SURFACE: ${{ inputs.auth-surface }}
        AUTH_BASELINE: ${{ inputs.auth-baseline }}
        GH_TOKEN: ${{ inputs.token }}
        STACK_CONFORMANCE_CHECKER_COMMIT: ${{ github.action_ref || github.sha }}
      run: |
        # Delivered customer repositories are hands-off; an unreadable property
        # leaves the check on.
        delivery=""
        if [ -n "${GH_TOKEN:-}" ]; then
          delivery="$(gh api "repos/$GITHUB_REPOSITORY/properties/values" \
            --jq '.[] | select(.property_name == "sylphx_delivery") | .value' 2>/dev/null || true)"
        fi
        if [ "$delivery" = "delivered" ]; then
          echo "::notice::$GITHUB_REPOSITORY is a delivered customer repository; stack conformance is not checked."
          exit 0
        fi
        report="$RUNNER_TEMP/stack-conformance-report.json"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        model_policy=()
        if [ -n "$MODEL_ALIASES" ]; then
          model_policy=(--model-aliases "$MODEL_ALIASES")
        fi
        python3 "$GITHUB_ACTION_PATH/stack_conformance.py" check --base "$BASE" --head "$HEAD_REV" --baseline "$BASELINE" --report "$report" "${model_policy[@]}"
        case "$AUTH_SURFACE" in
          off)
            if [ -n "$AUTH_BASELINE" ]; then
              echo '::error::auth-baseline requires auth-surface: full'
              exit 2
            fi
            ;;
          diff|full)
            python3 "$GITHUB_ACTION_PATH/../auth-surface-guard/check.py" --strict \
              --mode "$AUTH_SURFACE" --base "$BASE" --head "$HEAD_REV" --baseline "$AUTH_BASELINE"
            ;;
          *)
            echo '::error::auth-surface must be off, diff, or full'
            exit 2
            ;;
        esac
        python3 "$GITHUB_ACTION_PATH/rust_reachability.py"
