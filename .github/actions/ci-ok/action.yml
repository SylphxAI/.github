name: ci-ok
description: >
  Aggregate gate for repositories whose checks live in several workflows or in
  path-filtered workflows, where one ci-ok job cannot `needs:` them all. Waits
  until every other GitHub Actions check run on the commit has completed, then fails if any
  failed, was cancelled or timed out (skipped and neutral pass). It fails closed
  when a check never ran: a workflow that failed to start (a GitHub Actions
  check suite with a bad conclusion and no jobs), no other check run at all, or
  a `required` check that is missing or did not succeed. Make the job
  that runs it the required status check. Each check is judged by its latest
  run (a run cancelled by a newer run of its workflow does not count), and an
  API rate limit spent past the deadline fails the gate at once. Where all
  gating jobs share one workflow, use a plain `needs:` + `if: always()` job instead.

inputs:
  token:
    description: >
      Token that can read check runs and workflow runs (the job needs
      `checks: read` and `actions: read`; without `actions: read` a workflow_run
      or push workflow that failed to start on the commit also fails the gate).
    default: ${{ github.token }}
  job-name:
    description: Name of the calling job's check run, ignored while waiting.
    default: ci-ok
  ignore:
    description: Comma-separated check names to ignore (advisory checks).
    default: ""
  required:
    description: >
      Comma-separated check names that must be present and have succeeded
      (skipped, neutral or missing fails), for the jobs every change must run.
    default: ""
  allow-none-on-pull-request:
    description: >
      "true" lets a pull_request run pass when no other check ran, for a
      repository whose every workflow is path-filtered on pull_request but
      runs in full on merge_group. The merge group still fails when none ran.
    default: "false"
  timeout-minutes:
    description: Give up after this many minutes.
    default: "110"
  all-apps:
    description: "Also wait for check runs from other apps (deploy and preview statuses). Default: GitHub Actions only."
    default: "false"

runs:
  using: composite
  steps:
    - name: Wait for every other check on this commit
      shell: bash
      env:
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        TOKEN: ${{ inputs.token }}
        SELF_NAME: ${{ inputs.job-name }}
        CI_OK_IGNORE: ${{ inputs.ignore }}
        CI_OK_REQUIRED: ${{ inputs.required }}
        CI_OK_ALLOW_NONE_ON_PR: ${{ inputs.allow-none-on-pull-request }}
        EVENT_NAME: ${{ github.event_name }}
        CI_OK_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        CI_OK_ALL_APPS: ${{ inputs.all-apps }}
      run: python3 "$GITHUB_ACTION_PATH/ci_ok.py"
