name: ci-ok
description: >
  Enforces shared contribution metadata policy and scans added commits for
  secrets, then requires explicitly named job dependencies to have succeeded.
  Run the calling job with needs for every required job and if always(), and
  pass toJSON(needs) plus the required YAML job IDs. An absent, skipped,
  cancelled, failed or unfinished required job fails. Optional dependencies
  may skip but may not fail or be cancelled. No check-inventory polling.
  Requires contents and pull-requests read. See docs/ci-ok.md.

inputs:
  separate-pr-metadata:
    description: >
      Set true only with a separate required pr-metadata producer. This code
      verdict retains commit attribution and checks mutable PR text separately.
    default: "false"
  needs:
    description: The calling job's needs context as JSON (toJSON of needs).
    required: true
  required:
    description: Comma-separated YAML job IDs that must be present and have succeeded.
    required: true
  token:
    description: Token for contribution metadata and added-commit secret scanning.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check contribution metadata
      shell: bash
      env:
        CONTRIBUTION_POLICY_TOKEN: ${{ inputs.token }}
        CONTRIBUTION_POLICY_SCOPE: ${{ inputs.separate-pr-metadata == 'true' && 'commits' || 'all' }}
      run: python3 "$GITHUB_ACTION_PATH/../contribution-policy/contribution_policy.py" --scope "$CONTRIBUTION_POLICY_SCOPE"
    - name: Scan added commits for secrets
      shell: bash
      env:
        SECRET_SCAN_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/../secret-scan/secret_scan.py" --fetch --pre-merge-only
    - name: Require successful job dependencies
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        REQUIRED: ${{ inputs.required }}
        EVENT_NAME: ${{ github.event_name }}
      run: python3 "$GITHUB_ACTION_PATH/ci_ok.py"
