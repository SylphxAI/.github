name: workflow-lint
description: >
  Parses and lints every workflow in the repository with a pinned,
  checksum-verified actionlint (the gate's "workflow parse" check), using the
  repository's own `.github/actionlint.yaml` for self-hosted runner labels
  (declare labels there, not with an ignore pattern). A broken workflow then
  fails the pull request instead of the first run on the trunk. Then refuses
  a timing or performance budget (PERF_ENFORCE, Lighthouse, hyperfine, k6)
  in a pull_request, merge_group or reusable workflow: timing gates run after
  merge. Also refuses mutable-registry package-manager audits before merge:
  launched products audit the default branch on a separate schedule, and
  unlaunched products defer audits to launch. Delivered customer repositories
  skip these rules. Needs a checkout and
  python3 with pip (the scalar scanner supplies pinned PyYAML). Linux x86_64.

inputs:
  ignore:
    description: >
      Findings to ignore, one regular expression per line, each passed to
      actionlint as its own `-ignore` argument. Spaces and quotes are part of
      the pattern; write it without shell quoting, for example
      `property "workflow_sha" is not defined`.
    default: ""
  args:
    description: >
      Extra actionlint arguments, ONE ARGUMENT PER LINE (a line is never split
      on spaces), for example `-config-file` on one line and its path on the
      next, or workflow file paths to lint instead of the whole repository.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 1.7.12
        SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        IGNORE: ${{ inputs.ignore }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        bin=actionlint
        if [ "$(actionlint -version 2>/dev/null | head -1)" != "$VERSION" ]; then
          dir="$RUNNER_TEMP/actionlint-$VERSION"
          mkdir -p "$dir"
          curl --retry 5 --retry-connrefused -sSfL -o "$dir/a.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/a.tgz" | sha256sum -c --quiet
          tar -xzf "$dir/a.tgz" -C "$dir" actionlint
          bin="$dir/actionlint"
        fi
        # shellcheck and pyflakes integrations are off: they depend on what the
        # runner image happens to carry, and a gate must not.
        # Every argument is one line of an input: nothing is word-split or
        # glob-expanded, so a pattern with spaces or quotes stays one argument.
        argv=(-shellcheck= -pyflakes=)
        while IFS= read -r line; do
          [ -n "$line" ] && argv+=(-ignore "$line")
        done <<<"$IGNORE"
        while IFS= read -r line; do
          [ -n "$line" ] && argv+=("$line")
        done <<<"$ARGS"
        "$bin" "${argv[@]}"
    - name: No non-deterministic gate before merge
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Decode YAML scalars with one pinned parser, not physical-line guesses.
        # A private target works on externally managed runner Python installs.
        deps="$RUNNER_TEMP/workflow-lint-pyyaml-6.0.3"
        if ! PYTHONPATH="$deps" python3 -c 'import yaml; assert yaml.__version__ == "6.0.3"' 2>/dev/null; then
          python3 -m pip install --disable-pip-version-check --no-input \
            --only-binary=:all: --target "$deps" 'PyYAML==6.0.3'
        fi
        PYTHONPATH="$deps" python3 "$GITHUB_ACTION_PATH/perf_gate.py"
