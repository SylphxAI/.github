name: workflow-lint
description: >
  Parses and lints every workflow in the repository with a pinned,
  checksum-verified actionlint (the gate's "workflow parse" check), using the
  repository's own `.github/actionlint.yaml` for self-hosted runner labels.
  A broken workflow then fails the pull request instead of the first run on
  the trunk. Needs a checkout. Linux x86_64.

inputs:
  args:
    description: Extra actionlint arguments (for example `-ignore <pattern>`).
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 1.7.12
        SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        bin=actionlint
        if [ "$(actionlint -version 2>/dev/null | head -1)" != "$VERSION" ]; then
          dir="$RUNNER_TEMP/actionlint-$VERSION"
          mkdir -p "$dir"
          curl --retry 5 --retry-connrefused -sSfL -o "$dir/a.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/a.tgz" | sha256sum -c --quiet
          tar -xzf "$dir/a.tgz" -C "$dir" actionlint
          bin="$dir/actionlint"
        fi
        # shellcheck and pyflakes integrations are off: they depend on what the
        # runner image happens to carry, and a gate must not.
        # shellcheck disable=SC2086
        "$bin" -shellcheck= -pyflakes= $ARGS
