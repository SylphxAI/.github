name: workflow-lint
description: >
  Parses and lints every workflow in the repository with a pinned,
  checksum-verified actionlint (the gate's "workflow parse" check), using the
  repository's own `.github/actionlint.yaml` for self-hosted runner labels
  (declare labels there, not with an ignore pattern). A broken workflow then
  fails the pull request instead of the first run on the trunk. Then refuses
  a timing or performance budget (PERF_ENFORCE, Lighthouse, hyperfine, k6)
  in a pull_request, merge_group or reusable workflow: timing gates run after
  merge. LHCI collection and literal JSON assertions limited to non-timing
  accessibility, best-practices and SEO scores remain allowed. Also refuses mutable-registry package-manager audits before merge:
  launched products audit the default branch on a separate schedule, and
  unlaunched products defer audits to launch. Delivered customer repositories
  skip these rules. Also requires job timeouts, forbids manual approval and
  maintenance-window booking gates, and forbids failure masking on required needs paths. PR-triggered workflows must supersede per PR while giving non-PR events unique run groups, with only named, reasoned literal concurrency exceptions. Every PR and merge-group job must reach ci-ok or declare a reasoned advisory workflow. Needs a checkout and
  python3 with pip (the scalar scanner supplies pinned PyYAML). Linux x86_64.

inputs:
  rules:
    description: >
      all runs the existing full lint. pr-concurrency adopts only the canonical
      PR-concurrency rule, without actionlint, performance or other contract rules.
      Other values fail rather than skipping lint.
    default: all
  io-reviewer-secrets:
    description: >
      Comma-separated repository secret names allowed only for SHA-pinned
      shared pr-review jobs on sylphx-linux-io. Empty denies all secrets.
    default: ""
  contract-mode:
    description: >
      enforce fails all contract violations; report-only warns on legacy
      timeout and failure-masking findings. Manual approval and maintenance-window
      booking gates, missing ci-ok coverage and enrolled expected-check declaration drift always fail. Actionlint always fails syntax/reference errors.
    default: report-only
  ignore:
    description: >
      Findings to ignore, one regular expression per line, each passed to
      actionlint as its own `-ignore` argument. Spaces and quotes are part of
      the pattern; write it without shell quoting, for example
      `property "workflow_sha" is not defined`.
    default: ""
  args:
    description: >
      Extra actionlint arguments, ONE ARGUMENT PER LINE (a line is never split
      on spaces), for example `-config-file` on one line and its path on the
      next, or workflow file paths to lint instead of the whole repository.
    default: ""

runs:
  using: composite
  steps:
    - name: Validate rule selection
      shell: bash
      env:
        RULES: ${{ inputs.rules }}
      run: |
        case "$RULES" in
          all|pr-concurrency) ;;
          *) echo "::error::Unknown workflow-lint rules: $RULES"; exit 1 ;;
        esac
    - name: Restore actionlint release archive
      id: restore-binary
      if: inputs.rules == 'all'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/pinned-tools/actionlint-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        key: pinned-release-actionlint-linux-x64-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    - if: inputs.rules == 'all'
      shell: bash
      env:
        VERSION: 1.7.12
        GITHUB_TOKEN: ${{ github.token }}
        SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        IGNORE: ${{ inputs.ignore }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/pinned-tools/actionlint-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        mkdir -p "$dir"
        if [ ! -f "$dir/a.tgz" ]; then
          python3 "$GITHUB_ACTION_PATH/../_shared/release_download.py" \
            --repository rhysd/actionlint --tag "v$VERSION" \
            --filename "actionlint_${VERSION}_linux_amd64.tar.gz" \
            --asset-id 384924896 --sha256 "$SHA256" --destination "$dir/a.tgz.part"
          echo "$SHA256  $dir/a.tgz.part" | sha256sum -c --quiet
          mv "$dir/a.tgz.part" "$dir/a.tgz"
        else
          echo "actionlint release archive from cache"
        fi
        echo "$SHA256  $dir/a.tgz" | sha256sum -c --quiet
        tar -xzf "$dir/a.tgz" -C "$dir" actionlint
        bin="$dir/actionlint"
        # shellcheck and pyflakes integrations are off: they depend on what the
        # runner image happens to carry, and a gate must not.
        # Every argument is one line of an input: nothing is word-split or
        # glob-expanded, so a pattern with spaces or quotes stays one argument.
        argv=(-shellcheck= -pyflakes=)
        while IFS= read -r line; do
          [ -n "$line" ] && argv+=(-ignore "$line")
        done <<<"$IGNORE"
        while IFS= read -r line; do
          [ -n "$line" ] && argv+=("$line")
        done <<<"$ARGS"
        "$bin" "${argv[@]}"
    - name: Save actionlint release archive
      if: inputs.rules == 'all' && steps.restore-binary.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/pinned-tools/actionlint-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        key: pinned-release-actionlint-linux-x64-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    - name: No non-deterministic gate before merge
      if: inputs.rules == 'all'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Decode YAML scalars with one pinned parser, not physical-line guesses.
        # A private target works on externally managed runner Python installs.
        deps="$RUNNER_TEMP/workflow-lint-pyyaml-6.0.3"
        if ! PYTHONPATH="$deps" python3 -c 'import yaml; assert yaml.__version__ == "6.0.3"' 2>/dev/null; then
          python3 -m pip install --disable-pip-version-check --no-input \
            --only-binary=:all: --target "$deps" 'PyYAML==6.0.3'
        fi
        PYTHONPATH="$deps" python3 "$GITHUB_ACTION_PATH/perf_gate.py"
    - name: Required workflow contract
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CONTRACT_MODE: ${{ inputs.contract-mode }}
        WORKFLOW_LINT_RULES: ${{ inputs.rules }}
        IO_REVIEWER_SECRETS: ${{ inputs.io-reviewer-secrets }}
      run: |
        python3 -m pip install --quiet --target "$RUNNER_TEMP/workflow-contract" PyYAML==6.0.3
        PYTHONPATH="$RUNNER_TEMP/workflow-contract" python3 "$GITHUB_ACTION_PATH/contract.py"