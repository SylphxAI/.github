name: Standards lint
description: >
  Fails a change that adds a sleep or a polling loop on an event-driven primary
  path (owner standards/architecture.md, "Real time: events first, resync as the
  safety net"). The normal path waits on the event: a watch or informer, a
  transactional outbox, a webhook, or Postgres LISTEN/NOTIFY. A slow resync is
  the safety net and is allowed when the line says so. Checks only the lines
  this pull request, merge group or push adds, so existing code does not block
  adoption. The calling job checks out with `fetch-depth: 0`.

inputs:
  mode:
    description: "`fail` fails the job; `warn` annotates findings and passes."
    required: false
    default: fail
  exclude:
    description: Newline-separated git pathspecs to skip, for example recorded evidence.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check added lines for a sleep or poll on a primary path
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        GIT_SHA: ${{ github.sha }}
        MODE: ${{ inputs.mode }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        case "$EVENT_NAME" in
          pull_request)
            # Diff from the merge base with the current base branch so only the
            # pull request's own lines are checked.
            base="$PR_BASE_SHA"
            if git fetch --quiet --no-tags origin "$PR_BASE_REF" 2>/dev/null; then
              base="$(git merge-base FETCH_HEAD "$PR_HEAD_SHA")"
            fi
            range="${base}..${PR_HEAD_SHA}" ;;
          merge_group) range="${MG_BASE_SHA}..${MG_HEAD_SHA}" ;;
          *)
            before="${PUSH_BEFORE:-}"
            # A new branch reports an all-zero before; check the tip commit.
            if [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ]; then
              before="${GIT_SHA}~1"
            fi
            range="${before}..${GIT_SHA}" ;;
        esac
        export STANDARDS_LINT_MODE="${MODE:-fail}"
        specs=()
        while IFS= read -r p; do [ -n "$p" ] && specs+=(":(exclude)$p"); done <<<"$EXCLUDE"
        "$GITHUB_ACTION_PATH/check.sh" "$range" "$GITHUB_ACTION_PATH/rules.tsv" "${specs[@]}"
