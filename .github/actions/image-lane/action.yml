# Generated by scripts/generate-ci-composites.py; do not edit directly.
name: Image lane (top-level identity)
description: Native build, evidence, publish and readback with Broker-only source reads. Top-level caller owns jobs, permissions,
  environment and concurrency; composite preserves its signed workflow identity.
inputs:
  image:
    description: Registry host + repository, e.g. registry.sylphx.com/library/sylphx-hands
    required: true
  tag:
    description: 'Content tag: the lowercase hex source SHA (8-64 characters). The lane shortens it to 8 characters and refuses
      anything else, so mutable names like `latest` cannot be published.'
    required: true
  source-sha:
    description: Exact source commit to build when a verified commit dispatches the lane after main has moved. Empty uses
      the triggering commit. The checkout and evidence use this same revision.
    required: false
    default: ''
  source-fetch-depth:
    description: Number of source commits to fetch for the publish job. 0 fetches all history.
    required: false
    default: '1'
  platforms:
    description: Comma-separated platforms. Must equal the job runner's native platform.
    required: false
    default: linux/amd64
  context:
    description: Build context for the default build command.
    required: false
    default: .
  dockerfile:
    description: Dockerfile for the default build command.
    required: false
    default: ''
  build-command:
    description: 'Optional caller-owned build command (the single home for a repo-specific build). It runs in the caller checkout
      with OCI_DIR, BUILD_EVIDENCE_DIR, BUILD_EVIDENCE_OCI_DIR, IMAGE, IMAGE_TAG, PLATFORMS, SOURCE_SHA and CARGO_GIT_CREDENTIALS_FILE
      exported, and must leave an OCI layout in OCI_DIR. Buildx derives `-dirty` from ignored files too, so this lane''s nested
      `.image-lane` checkout brands engine builds dirty: callers needing VCS-clean provenance must relocate `.image-lane`
      outside the checkout for engine execution and restore it after.'
    required: false
    default: ''
  evidence-command:
    description: Optional caller-owned evidence packaging command, run after the build with the same environment plus BUILD_EVIDENCE_TAG.
      It must leave the evidence bundle in BUILD_EVIDENCE_DIR and its data-only OCI artifact in BUILD_EVIDENCE_OCI_DIR.
    required: false
    default: ''
  evidence-tag-prefix:
    description: Prefix for the evidence tag; the lane publishes <prefix>-<sha>-<run>-<attempt>.
    required: false
    default: image-evidence
  verify-command:
    description: Optional caller-owned verification command, run ONCE in the publish job after the registry readback with
      REGISTRY_DIGEST, IMAGE_REGISTRY_MANIFEST, EVIDENCE_REGISTRY_MANIFEST, BUILD_EVIDENCE_TAG, BUILD_EVIDENCE_DIGEST, BUILD_EVIDENCE_DIR,
      BUILD_EVIDENCE_OCI_DIR, OCI_DIR, IMAGE, IMAGE_TAG, SOURCE_SHA, LANE_ROOT and GH_TOKEN exported. It must leave its receipt
      in ${LANE_ROOT}/verify; the promotion boundary records that receipt instead of re-verifying. It never receives the registry
      credential.
    required: false
    default: ''
  preflight-timeout-seconds:
    description: Bound for the publisher credential mint during pre-flight.
    required: false
    default: '20'
  phase:
    description: all runs preflight before publish; split jobs use preflight then publish with needs. Each signed top-level
      job needs its own exact publisher grant.
    required: false
    default: all
  broker-ci-name:
    description: Exact Access CI declaration for this top-level source-read job.
    required: false
    default: ''
  broker-trust-policies:
    description: Exact JSON owner/name -> TrustPolicy map for source-repositories.
    required: false
    default: '{}'
  source-repositories:
    description: Optional comma/newline separated full owner/name private source repositories.
    required: false
    default: ''
  api-url:
    description: Ordinary platform API endpoint.
    required: false
    default: https://api.sylphx.com
  expected-issuer:
    description: Optional exact Broker issuer pin.
    required: false
    default: ''
  expected-connection:
    description: Optional exact Broker Connection pin.
    required: false
    default: ''
outputs:
  image_tag:
    description: Content tag published for the image.
    value: ${{ steps.readback.outputs.image_tag }}
  digest:
    description: Immutable repository digest of the published image.
    value: ${{ steps.readback.outputs.digest }}
  evidence_tag:
    description: Tag the evidence bundle was published under.
    value: ${{ steps.readback.outputs.evidence_tag }}
  evidence_digest:
    description: Immutable repository digest of the published evidence bundle.
    value: ${{ steps.readback.outputs.evidence_digest }}
  verify_receipt:
    description: 'The caller verification receipt: the files the verify-command left in ${LANE_ROOT}/verify, as a base64 gzip
      tar (empty when no verify-command was given). Unpack with `printf ''%s'' "$RECEIPT" | base64 -d | tar -xzf - -C <dir>`.'
    value: ${{ steps.verify.outputs.verify_receipt }}
runs:
  using: composite
  steps:
  - name: Validate execution phase
    shell: bash
    run: |
      set -euo pipefail
      case "$PHASE" in all|preflight|publish) ;; *) echo '::error::phase must be all, preflight or publish'; exit 1;; esac
    env:
      PHASE: ${{ inputs.phase }}
  - name: Publisher credential pre-flight (GitHub OIDC -> repository JWT)
    shell: bash
    env:
      LANE_IMAGE: ${{ inputs.image }}
      LANE_PREFLIGHT_TIMEOUT: ${{ inputs.preflight-timeout-seconds }}
    run: |
      set -euo pipefail
      test -f "$GITHUB_ACTION_PATH/../../../scripts/mint-registry-auth.py" || {
        echo "FATAL: the lane checkout is incomplete (lane ref not resolved)" >&2
        exit 1
      }
      python3 "$GITHUB_ACTION_PATH/../../../scripts/mint-registry-auth.py" \
        --identity github-oidc \
        --image "${LANE_IMAGE}" \
        --probe \
        --timeout-seconds "${LANE_PREFLIGHT_TIMEOUT}"
    if: ${{ inputs.phase != 'publish' }}
  - uses: actions/checkout@v4
    with:
      ref: ${{ inputs.source-sha || github.sha }}
      fetch-depth: ${{ inputs['source-fetch-depth'] }}
      persist-credentials: false
    if: ${{ inputs.phase != 'preflight' }}
  - name: Snapshot the pinned lane tools
    shell: bash
    run: |
      set -euo pipefail
      # No network checkout or moving ref. These bytes belong to the pinned action.
      mkdir -p .image-lane/scripts
      for tool in mint-registry-auth pack-image-evidence read-registry-manifest; do
        cp "$GITHUB_ACTION_PATH/../../../scripts/$tool.py" ".image-lane/scripts/$tool.py"
      done
    if: ${{ inputs.phase != 'preflight' }}
  - name: Exclude the lane scratch checkout from caller dirty checks
    shell: bash
    run: |
      # Best effort: a caller that cannot be helped here must still fail on
      # its own evidence gate (with its own message), not on this step.
      if exclude="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then
        mkdir -p "$(dirname "$exclude")" 2>/dev/null || true
        grep -qxF '.image-lane/' "$exclude" 2>/dev/null ||
          printf '.image-lane/\n' >> "$exclude" 2>/dev/null || true
      fi
    if: ${{ inputs.phase != 'preflight' }}
  - name: Prepare lane environment
    id: name
    shell: bash
    env:
      LANE_IMAGE: ${{ inputs.image }}
      LANE_TAG_INPUT: ${{ inputs.tag }}
      LANE_PLATFORMS: ${{ inputs.platforms }}
      LANE_DOCKERFILE: ${{ inputs.dockerfile }}
      LANE_CONTEXT: ${{ inputs.context }}
      LANE_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
      LANE_RUN_ID: ${{ github.run_id }}
      LANE_RUN_ATTEMPT: ${{ github.run_attempt }}
      LANE_EVIDENCE_TAG_PREFIX: ${{ inputs.evidence-tag-prefix }}
    run: |
      set -euo pipefail
      LANE_ROOT="${RUNNER_TEMP}/image-lane"
      BUILD_HOME="${LANE_ROOT}/home"
      mkdir -p "$BUILD_HOME/.docker" "$BUILD_HOME/.cargo-home" "$BUILD_HOME/.rustup-home" \
        "$BUILD_HOME/.cache" "${LANE_ROOT}/image-oci" "${LANE_ROOT}/evidence" "${LANE_ROOT}/evidence-oci" \
        "${LANE_ROOT}/readback"
      case "${LANE_TAG_INPUT}" in
        *[!0-9a-f]*|'') echo "FATAL: tag must be the lowercase hex source SHA (8-64 hex characters), not a mutable name" >&2; exit 1 ;;
      esac
      case "${#LANE_TAG_INPUT}" in
        8|9|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9]|6[0-4]) : ;;
        *) echo "FATAL: tag must be 8-64 hex characters" >&2; exit 1 ;;
      esac
      LANE_TAG="${LANE_TAG_INPUT:0:8}"
      test -n "${LANE_TAG}"
      case "${LANE_EVIDENCE_TAG_PREFIX}" in
        ''|*[!a-z0-9.-]*) echo "FATAL: evidence-tag-prefix must be [a-z0-9.-]" >&2; exit 1 ;;
      esac
      {
        printf 'HOME=%s\n' "${BUILD_HOME}"
        printf 'DOCKER_CONFIG=%s\n' "${BUILD_HOME}/.docker"
        printf 'XDG_CACHE_HOME=%s\n' "${BUILD_HOME}/.cache"
        printf 'CARGO_HOME=%s\n' "${BUILD_HOME}/.cargo-home"
        printf 'RUSTUP_HOME=%s\n' "${BUILD_HOME}/.rustup-home"
        printf 'PYTHONDONTWRITEBYTECODE=1\n'
        printf 'LANE_ROOT=%s\n' "${LANE_ROOT}"
        printf 'IMAGE=%s\n' "${LANE_IMAGE}"
        printf 'IMAGE_TAG=%s\n' "${LANE_TAG}"
        printf 'PLATFORMS=%s\n' "${LANE_PLATFORMS}"
        printf 'DOCKERFILE=%s\n' "${LANE_DOCKERFILE}"
        printf 'CONTEXT=%s\n' "${LANE_CONTEXT}"
        printf 'SOURCE_SHA=%s\n' "${LANE_SOURCE_SHA}"
        printf 'OCI_DIR=%s\n' "${LANE_ROOT}/image-oci"
        printf 'EVIDENCE_DIR=%s\n' "${LANE_ROOT}/evidence"
        printf 'BUILD_EVIDENCE_DIR=%s\n' "${LANE_ROOT}/evidence"
        printf 'BUILD_EVIDENCE_OCI_DIR=%s\n' "${LANE_ROOT}/evidence-oci"
        printf 'READBACK_DIR=%s\n' "${LANE_ROOT}/readback"
        printf 'BUILD_EVIDENCE_TAG=%s-%s-%s-%s\n' "${LANE_EVIDENCE_TAG_PREFIX}" "${LANE_SOURCE_SHA}" "${LANE_RUN_ID}" "${LANE_RUN_ATTEMPT}"
      } >> "$GITHUB_ENV"
      echo "lane_context image=${LANE_IMAGE} tag=${LANE_TAG} platforms=${LANE_PLATFORMS}"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Prove native single-platform build
    shell: bash
    run: |
      set -euo pipefail
      case "$(uname -m)" in
        x86_64|amd64) native=amd64 ;;
        aarch64|arm64) native=arm64 ;;
        *) echo "FATAL: unsupported runner architecture $(uname -m)" >&2; exit 1 ;;
      esac
      if [ "${PLATFORMS}" != "linux/${native}" ]; then
        echo "FATAL: platforms '${PLATFORMS}' is not this runner's native platform 'linux/${native}'" >&2
        echo "The lane does not emulate foreign architectures; use a native runner class." >&2
        exit 1
      fi
      echo "native_platform_ok platforms=${PLATFORMS} machine=$(uname -m)"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Authorize independent source repositories
    shell: bash
    run: |
      python3 "$GITHUB_ACTION_PATH/../broker-git-credentials/configure.py"
    env:
      BROKER_CI_NAME: ${{ inputs.broker-ci-name }}
      REPOSITORIES: ${{ inputs.source-repositories }}
      TRUST_POLICIES: ${{ inputs.broker-trust-policies }}
      API_URL: ${{ inputs.api-url }}
      EXPECTED_ISSUER: ${{ inputs.expected-issuer }}
      EXPECTED_CONNECTION: ${{ inputs.expected-connection }}
    if: ${{ inputs.phase != 'preflight' && (inputs.source-repositories != '') }}
  - name: Prove native build engine
    shell: bash
    env:
      BUILD_COMMAND: ${{ inputs['build-command'] }}
    run: |
      set -euo pipefail
      if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
        docker version
      elif [[ -n "${BUILD_COMMAND}" ]]; then
        echo "no live Docker daemon; the caller build command owns its engine"
      else
        echo "FATAL: no live Docker daemon and no caller build command" >&2
        exit 1
      fi
    if: ${{ inputs.phase != 'preflight' }}
  - name: Ensure a docker-container builder for OCI export
    shell: bash
    run: |
      set -euo pipefail
      if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
        echo "no live Docker daemon; caller owns its engine (host-pack)"
        exit 0
      fi
      if docker buildx inspect 2>/dev/null | grep -q 'Driver: *docker-container'; then
        echo "docker-container builder already active"
        exit 0
      fi
      docker buildx create \
        --name "lane-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        --driver docker-container \
        --driver-opt network=host \
        --buildkitd-flags "--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host" \
        --use
      docker buildx inspect --bootstrap
    if: ${{ inputs.phase != 'preflight' }}
  - name: Build image
    shell: bash
    env:
      BUILD_COMMAND: ${{ inputs['build-command'] }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
    run: |
      set -euo pipefail
      if [[ -n "${BUILD_COMMAND}" ]]; then
        echo "lane_build=custom"
        bash -lc "${BUILD_COMMAND}"
        exit 0
      fi
      test -n "${DOCKERFILE:?dockerfile input required for the default build}"
      echo "lane_build=default dockerfile=${DOCKERFILE} context=${CONTEXT}"
      BUILDX_GIT_INFO=true BUILDX_GIT_CHECK_DIRTY=true docker buildx build \
        --platform "${PLATFORMS}" \
        --file "${DOCKERFILE}" \
        --tag "${IMAGE}:${IMAGE_TAG}" \
        --output "type=oci,tar=false,dest=${OCI_DIR}" \
        --metadata-file "${LANE_ROOT}/buildx-metadata.json" \
        --provenance=false --sbom=false \
        "${CONTEXT}"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Prove the OCI layout
    shell: bash
    run: |
      set -euo pipefail
      test -d "${OCI_DIR}"
      test -f "${OCI_DIR}/index.json"
      test -f "${OCI_DIR}/oci-layout"
      test -d "${OCI_DIR}/blobs"
      python3 - "${OCI_DIR}/index.json" <<'PY'
      import json, sys
      index = json.load(open(sys.argv[1]))
      manifests = index.get("manifests", [])
      assert manifests, "index has no manifests"
      images = [m for m in manifests if (m.get("platform") or {}).get("os") != "unknown"]
      assert len(images) == 1, f"expected exactly one image, found {len(images)}"
      print(f"oci_layout_ok images=1 attestations={len(manifests) - len(images)}")
      PY
    if: ${{ inputs.phase != 'preflight' }}
  - name: Package build evidence
    shell: bash
    env:
      EVIDENCE_COMMAND: ${{ inputs['evidence-command'] }}
    run: |
      set -euo pipefail
      mkdir -p "${BUILD_EVIDENCE_DIR}" "${BUILD_EVIDENCE_OCI_DIR}"
      if [[ -n "${EVIDENCE_COMMAND}" ]]; then
        echo "lane_evidence=custom"
        bash -lc "${EVIDENCE_COMMAND}"
      else
        echo "lane_evidence=default"
        python3 .image-lane/scripts/pack-image-evidence.py
      fi
      test -n "$(ls -A "${BUILD_EVIDENCE_DIR}")"
      echo "evidence_dir_ok files=$(find "${BUILD_EVIDENCE_DIR}" -type f | wc -l)"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Remove the job-scoped git credential
    if: ${{ inputs.phase != 'preflight' && (always()) }}
    shell: bash
    run: |
      set -euo pipefail
      if [[ -n "${CARGO_GIT_CREDENTIALS_FILE:-}" && "${CARGO_GIT_CREDENTIALS_FILE}" == "${RUNNER_TEMP}/"* ]]; then
        rm -f -- "${CARGO_GIT_CREDENTIALS_FILE}"
      fi
      echo "git_credential_split_context_cleared"
  - name: Install the publisher tools
    shell: bash
    run: |
      set -euo pipefail
      if ! command -v skopeo >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
        sudo -n apt-get update -qq
        sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq skopeo python3
      fi
      skopeo --version
      python3 -c 'import sys; assert sys.version_info >= (3, 11), "evidence tooling requires Python 3.11+"'
    if: ${{ inputs.phase != 'preflight' }}
  - name: Registry auth (GitHub OIDC -> identitytoken)
    shell: bash
    env:
      LANE_IMAGE: ${{ inputs.image }}
      LANE_RUN_ID: ${{ github.run_id }}
      DOCKER_CONFIG: ${{ runner.temp }}/image-lane/registry-v2-docker
      SKOPEO_AUTH_FILE: ${{ runner.temp }}/image-lane/registry-v2-docker/skopeo-auth.json
    run: |
      set -euo pipefail
      mkdir -p "${DOCKER_CONFIG}"
      python3 .image-lane/scripts/mint-registry-auth.py \
        --identity github-oidc \
        --image "${LANE_IMAGE}" \
        --output-dir "${DOCKER_CONFIG}" \
        --run-id "${LANE_RUN_ID}"
      test -s "${DOCKER_CONFIG}/config.json"
      test -s "${SKOPEO_AUTH_FILE}"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Push immutable image and evidence bytes
    shell: bash
    env:
      LANE_IMAGE: ${{ inputs.image }}
      LANE_RUN_ID: ${{ github.run_id }}
      SKOPEO_AUTH_FILE: ${{ runner.temp }}/image-lane/registry-v2-docker/skopeo-auth.json
    run: |
      set -euo pipefail
      fail() { echo "::error title=Image push precondition::$*"; exit 1; }
      [[ -n "${IMAGE_TAG:-}" ]] || fail "IMAGE_TAG is empty"
      [[ -f "${OCI_DIR}/index.json" && -f "${OCI_DIR}/oci-layout" ]] \
        || fail "the built image at ${OCI_DIR} is not an OCI layout"
      [[ -s "${SKOPEO_AUTH_FILE:-}" ]] || fail "registry auth file missing (the auth step did not write it)"
      # skopeo's own errors go to the log; the auth file is read by path
      # and its contents are never printed.
      skopeo copy --authfile "${SKOPEO_AUTH_FILE}" --all --preserve-digests \
        "oci:${OCI_DIR}" "docker://${LANE_IMAGE}:${IMAGE_TAG}"
      if [ -f "${BUILD_EVIDENCE_OCI_DIR}/index.json" ]; then
        skopeo copy --authfile "${SKOPEO_AUTH_FILE}" --preserve-digests \
          "oci:${BUILD_EVIDENCE_OCI_DIR}" "docker://${LANE_IMAGE}:${BUILD_EVIDENCE_TAG}"
      fi
      echo "push_ok image=${LANE_IMAGE}:${IMAGE_TAG} evidence_tag=${BUILD_EVIDENCE_TAG}"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Capture registry readback
    id: readback
    shell: bash
    env:
      LANE_IMAGE: ${{ inputs.image }}
      SKOPEO_AUTH_FILE: ${{ runner.temp }}/image-lane/registry-v2-docker/skopeo-auth.json
    run: |
      set -euo pipefail
      mkdir -p "${READBACK_DIR}"
      DIGEST="$(python3 .image-lane/scripts/read-registry-manifest.py \
        --image "${LANE_IMAGE}" --reference "${IMAGE_TAG}" \
        --auth-file "${SKOPEO_AUTH_FILE}" --output "${READBACK_DIR}/image.json")"
      # Content equality, not byte equality: the registry may normalize the
      # envelope (OCI index vs Docker list, whitespace, key order), and a
      # single-platform push may be stored as one manifest while the local
      # layout keeps its index wrapper (live 2026-09-14: byte comparison
      # refused a correct push, e7f9ee94.. vs 90580359..). Compare the
      # referenced content digests exactly; promotion uses the authenticated
      # HEAD identity whose digest GET returned these exact registry bytes.
      python3 - "${READBACK_DIR}/image.json" "${OCI_DIR}" <<'PY'
      import json, sys
      from pathlib import Path
      remote = json.loads(Path(sys.argv[1]).read_bytes())
      root_dir = Path(sys.argv[2])
      local_index = json.loads((root_dir / "index.json").read_bytes())

      def resolved_entry(doc, directory):
          """The document the tag resolves to.

          `containers/image` resolves `oci:DIR` to the entry the layout root
          names (`oci/layout/oci_transport.go::getManifestDescriptor`), so a
          caller that wraps a one-platform layout in an index -- which it
          must, or the tag carries a bare manifest and index-resolving
          consumers get nothing (live 2026-09-18: the Hands bootstrap gate
          could not be satisfied) -- leaves the root naming that wrapper. The
          registry reports the wrapper, so the comparison below must read the
          wrapper's children, not the root's.
          """
          manifests = doc.get("manifests")
          if not isinstance(manifests, list) or len(manifests) != 1:
              return doc
          entry = manifests[0]
          if entry.get("mediaType") not in (
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          ):
              return doc
          blob = (
              directory
              / "blobs"
              / "sha256"
              / str(entry.get("digest", "")).removeprefix("sha256:")
          )
          if not blob.is_file():
              return doc
          return json.loads(blob.read_bytes())

      local_index = resolved_entry(local_index, root_dir)
      def child_digests(doc):
          manifests = doc.get("manifests")
          if not isinstance(manifests, list):
              return None
          out = []
          for m in manifests:
              if not isinstance(m, dict) or not isinstance(m.get("digest"), str):
                  raise SystemExit("FATAL: manifest entry without a digest; refusing to promote")
              out.append(m["digest"])
          return sorted(out)
      local_children = child_digests(local_index)
      if local_children is None:
          raise SystemExit("FATAL: locally built index.json has no manifests list; refusing to promote")
      remote_children = child_digests(remote)
      if remote_children is not None:
          if remote_children != local_children:
              print(f"registry manifest digests: {remote_children}", file=sys.stderr)
              print(f"local manifest digests: {local_children}", file=sys.stderr)
              raise SystemExit(f"FATAL: registry references {len(remote_children)} manifests, locally built {len(local_children)}; refusing to promote")
          print(f"readback_ok manifests={len(remote_children)}", file=sys.stderr)
      else:
          if len(local_children) != 1:
              print(f"registry mediaType: {remote.get('mediaType')}", file=sys.stderr)
              print(f"local manifest digests: {local_children}", file=sys.stderr)
              raise SystemExit("FATAL: registry returned a single manifest for a multi-manifest local index; refusing to promote")
          blob = (Path(sys.argv[2]) / "blobs" / "sha256" / local_children[0].removeprefix("sha256:")).read_bytes()
          local_manifest = json.loads(blob)
          if "config" not in local_manifest or "layers" not in local_manifest or "config" not in remote or "layers" not in remote:
              print(f"registry keys: {sorted(remote.keys())}", file=sys.stderr)
              raise SystemExit("FATAL: single-manifest readback lacks config/layers; refusing to promote")
          if remote["config"].get("digest") != local_manifest["config"].get("digest") or [l.get("digest") for l in remote["layers"]] != [l.get("digest") for l in local_manifest["layers"]]:
              print(f"registry config/layers: {remote['config'].get('digest')} {[l.get('digest') for l in remote.get('layers', [])]}", file=sys.stderr)
              print(f"local config/layers: {local_manifest['config'].get('digest')} {[l.get('digest') for l in local_manifest.get('layers', [])]}", file=sys.stderr)
              raise SystemExit("FATAL: registry single-manifest content differs from the locally built image; refusing to promote")
          print("readback_ok single-manifest", file=sys.stderr)
      PY
      EVIDENCE_DIGEST=""
      if EVIDENCE_DIGEST="$(python3 .image-lane/scripts/read-registry-manifest.py \
          --image "${LANE_IMAGE}" --reference "${BUILD_EVIDENCE_TAG}" \
          --auth-file "${SKOPEO_AUTH_FILE}" --output "${READBACK_DIR}/evidence.json")"; then
        test -s "${READBACK_DIR}/evidence.json"
      else
        EVIDENCE_DIGEST=""
        rm -f -- "${READBACK_DIR}/evidence.json"
      fi
      {
        printf 'image_tag=%s\n' "${IMAGE_TAG}"
        printf 'digest=%s\n' "${DIGEST}"
        printf 'evidence_tag=%s\n' "${BUILD_EVIDENCE_TAG}"
        printf 'evidence_digest=%s\n' "${EVIDENCE_DIGEST}"
      } >> "$GITHUB_OUTPUT"
      {
        printf 'REGISTRY_DIGEST=%s\n' "${DIGEST}"
        printf 'BUILD_EVIDENCE_DIGEST=%s\n' "${EVIDENCE_DIGEST}"
        printf 'IMAGE_REGISTRY_MANIFEST=%s\n' "${READBACK_DIR}/image.json"
        # Exported only when the evidence readback actually produced bytes;
        # a caller verifier must treat a missing path as "no readback".
        if [ -s "${READBACK_DIR}/evidence.json" ]; then
          printf 'EVIDENCE_REGISTRY_MANIFEST=%s\n' "${READBACK_DIR}/evidence.json"
        fi
      } >> "$GITHUB_ENV"
      echo "promotion_boundary_ok digest=${DIGEST} evidence_digest=${EVIDENCE_DIGEST:-none}"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Drop registry credentials before the caller verifier
    shell: bash
    env:
      LANE_AUTH_DIR: ${{ runner.temp }}/image-lane/registry-v2-docker
    run: |
      set -euo pipefail
      if [[ -n "${LANE_AUTH_DIR}" && "${LANE_AUTH_DIR}" == "${RUNNER_TEMP}/"* ]]; then
        rm -rf -- "${LANE_AUTH_DIR}"
      fi
      test ! -e "${LANE_AUTH_DIR}"
      echo "registry_credential_dropped dir=${LANE_AUTH_DIR}"
    if: ${{ inputs.phase != 'preflight' }}
  - name: Verify promotion evidence
    id: verify
    if: ${{ inputs.phase != 'preflight' && (inputs['verify-command'] != '') }}
    shell: bash
    env:
      VERIFY_COMMAND: ${{ inputs['verify-command'] }}
      GH_TOKEN: ${{ github.token }}
    run: |
      set -euo pipefail
      mkdir -p "${LANE_ROOT}/verify"
      echo "lane_verify=custom"
      bash -lc "${VERIFY_COMMAND}"
      test -n "$(ls -A "${LANE_ROOT}/verify")"
      # The receipt travels to the caller's pin job as a job output (a
      # gzip tar, base64), not as an artifact. Job outputs are capped at
      # 1 MB per job; a receipt is a few KB, and a large one fails here.
      receipt="$(tar -C "${LANE_ROOT}/verify" -czf - . | base64 -w0)"
      if [ "${#receipt}" -gt 524288 ]; then
        echo "FATAL: verification receipt is ${#receipt} bytes encoded (limit 524288)" >&2
        exit 1
      fi
      printf 'verify_receipt=%s\n' "${receipt}" >> "$GITHUB_OUTPUT"
      echo "verify_dir_ok files=$(find "${LANE_ROOT}/verify" -type f | wc -l) receipt_bytes=${#receipt}"
  - name: Remove registry credentials
    if: ${{ inputs.phase != 'preflight' && (always()) }}
    shell: bash
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/image-lane/registry-v2-docker
      SKOPEO_AUTH_FILE: ${{ runner.temp }}/image-lane/registry-v2-docker/skopeo-auth.json
    run: |
      set -euo pipefail
      # The minted JWT is never an artifact or a cache input. Remove the
      # complete tool-auth directory on every terminal path, including
      # push/readback failures, without printing credential contents.
      if [[ -n "${DOCKER_CONFIG:-}" && "${DOCKER_CONFIG}" == "${RUNNER_TEMP}/"* ]]; then
        rm -rf -- "${DOCKER_CONFIG}"
      elif [[ -n "${SKOPEO_AUTH_FILE:-}" ]]; then
        rm -f -- "${SKOPEO_AUTH_FILE}"
      fi
