name: Rust CI

# The standard Rust gate for any repository: format, clippy and tests on one
# Sylphx runner, with every rustc call served from the organization's shared
# compile cache (the rust-sccache action). docs/rust-ci.md is the guide and
# docs/adr/0004-fleet-rust-compile-cache.md the decision.
#
# Cache contract:
# - One namespace per organization (`key-prefix: rustc`). sccache keys are
#   content hashes of each rustc invocation, so a pull request reads every
#   entry main, the merge queue or a sibling repository already wrote for the
#   same inputs, and nothing else.
# - Callers run this on `push` to main as well as on pull_request and
#   merge_group: the main run keeps the cache warm for the next pull request.
# - The checkout and CARGO_HOME paths are the same on every event, because
#   rustc's arguments (and so the keys) carry absolute paths.
#
# Compile cache: the job asks BuildCache for a run token with its OIDC
# identity (`id-token: write`, granted to the job below and by the caller's
# `rust` job in the starter); the organization secrets are the fallback.
#
# Spend: Sylphx runners only. `runner-class` picks a Sylphx label, and a merge
# group runs on that class's -merge lane; no GitHub-hosted label is reachable.
#
# Trust boundary: caller inputs never reach a shell body. They travel through
# `env:` and are validated against a strict pattern before use.

on:
  workflow_call:
    inputs:
      workspace:
        description: Directory of the Cargo workspace, relative to the repository root.
        required: false
        type: string
        default: '.'
      toolchain:
        description: >
          Rust toolchain to install (stable, beta, nightly, 1.85.0, nightly-2026-09-01).
          Empty uses the repository's rust-toolchain(.toml) when it has one,
          else stable. Prefer the pin file: it is part of every cache key.
        required: false
        type: string
        default: ''
      features:
        description: >
          Cargo features for clippy and test: `all` for --all-features, or a
          comma-separated list for --features. Empty uses the crates' defaults.
        required: false
        type: string
        default: ''
      key-prefix:
        description: >
          Compile-cache namespace. One per organization, so leave the default;
          change it only to roll the whole namespace after a poisoned entry
          (docs/adr/0004-fleet-rust-compile-cache.md).
        required: false
        type: string
        default: rustc
      runner-class:
        description: standard or xlarge (xlarge only after a measured need).
        required: false
        type: string
        default: standard
      fmt:
        description: Run `cargo fmt --all -- --check`.
        required: false
        type: boolean
        default: true
      clippy-args:
        description: >
          Arguments after `cargo clippy --locked`. Empty skips clippy.
        required: false
        type: string
        default: '--workspace --all-targets -- -D warnings'
      test-args:
        description: >
          Arguments after `cargo test --locked`. Empty skips tests.
        required: false
        type: string
        default: '--workspace'
      locked:
        description: Pass `--locked` (needs a committed Cargo.lock).
        required: false
        type: boolean
        default: true
      apt-packages:
        description: Space-separated Debian packages the build needs (for example libasound2-dev).
        required: false
        type: string
        default: ''
      git-deps:
        description: >
          Private git dependencies Cargo fetches, one OWNER/REPO per line,
          read through the caller's own GitHub App (GIT_DEPS_APP_ID /
          GIT_DEPS_APP_KEY), as in rust-check.yml.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 45
    secrets:
      SYLPHX_CI_CACHE_ACCESS_KEY:
        description: The organization's own compile-cache user (organization secret).
        required: false
      SYLPHX_CI_CACHE_SECRET_KEY:
        description: Its secret key.
        required: false
      GIT_DEPS_APP_ID:
        description: Id of the caller's own reader App, installed on the owners in git-deps.
        required: false
      GIT_DEPS_APP_KEY:
        description: That App's private key.
        required: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    # id-token: the compile cache (BuildCache) knows the job by its GitHub OIDC
    # identity. Without it the cache action falls back to the static secrets,
    # then the Actions cache. The caller's job must grant it too.
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ format('sylphx-linux-{0}{1}', inputs.runner-class == 'xlarge' && 'xlarge' || 'standard', github.event_name == 'merge_group' && '-merge' || '') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
      SCCACHE_IDLE_TIMEOUT: '0'
      IN_WORKSPACE: ${{ inputs.workspace }}
      IN_CLASS: ${{ inputs.runner-class }}
      IN_TOOLCHAIN: ${{ inputs.toolchain }}
      IN_FEATURES: ${{ inputs.features }}
      IN_PREFIX: ${{ inputs.key-prefix }}
      IN_CLIPPY: ${{ inputs.clippy-args }}
      IN_TEST: ${{ inputs.test-args }}
      IN_LOCKED: ${{ inputs.locked }}
      IN_APT: ${{ inputs.apt-packages }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$IN_WORKSPACE" =~ ^[A-Za-z0-9_./-]{1,200}$ && "$IN_WORKSPACE" != /* && "$IN_WORKSPACE" != *..* ]] || { echo "bad workspace"; exit 2; }
          [[ "$IN_CLASS" == standard || "$IN_CLASS" == xlarge ]] || { echo "bad runner-class"; exit 2; }
          [[ "$IN_TOOLCHAIN" =~ ^[A-Za-z0-9._-]{0,64}$ ]] || { echo "bad toolchain"; exit 2; }
          [[ "$IN_FEATURES" =~ ^[A-Za-z0-9_,/-]{0,200}$ ]] || { echo "bad features"; exit 2; }
          [[ "$IN_PREFIX" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "bad key-prefix"; exit 2; }
          [[ "$IN_CLIPPY" =~ ^[A-Za-z0-9_.,:=/\ -]*$ ]] || { echo "bad clippy-args"; exit 2; }
          [[ "$IN_TEST" =~ ^[A-Za-z0-9_.,:=/\ -]*$ ]] || { echo "bad test-args"; exit 2; }
          [[ "$IN_APT" =~ ^[a-z0-9.+\ -]*$ ]] || { echo "bad apt-packages"; exit 2; }
          if [ ! -w "${HOME:-/}" ] || [ "${HOME:-/root}" = /root ]; then
            mkdir -p "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 10
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-home" RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          mkdir -p "$CARGO_HOME/bin" "$RUSTUP_HOME"
          { echo "CARGO_HOME=$CARGO_HOME"; echo "RUSTUP_HOME=$RUSTUP_HOME"; } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -sSfL https://sh.rustup.rs \
            | sh -s -- --default-toolchain none --profile minimal -y --no-modify-path
          cd "$IN_WORKSPACE"
          # The toolchain input when given, else the repository's pinned
          # toolchain (the workspace or any parent up to the checkout), else stable.
          pinned=""
          dir="$PWD"
          while :; do
            for f in rust-toolchain.toml rust-toolchain; do
              [ -f "$dir/$f" ] && { pinned="$dir/$f"; break 2; }
            done
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir="$(dirname "$dir")"
          done
          if [ -n "$IN_TOOLCHAIN" ]; then
            echo "toolchain from input: $IN_TOOLCHAIN"
            rustup toolchain install "$IN_TOOLCHAIN" --profile minimal
            rustup default "$IN_TOOLCHAIN"
          elif [ -n "$pinned" ]; then
            echo "toolchain from $pinned"
            rustup toolchain install
            rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          else
            echo "no rust-toolchain file: stable"
            rustup default stable
          fi
          rustup component add clippy rustfmt
          cargo --version
      - name: System packages
        if: inputs.apt-packages != ''
        run: |
          set -euo pipefail
          read -ra pkgs <<<"$IN_APT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"
      - name: Private git dependencies
        if: inputs.git-deps != ''
        env:
          GIT_DEPS: ${{ inputs.git-deps }}
          APP_ID: ${{ secrets.GIT_DEPS_APP_ID }}
          APP_KEY: ${{ secrets.GIT_DEPS_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::git-deps is set but GIT_DEPS_APP_ID / GIT_DEPS_APP_KEY are not passed"; exit 2
          fi
          declare -A repos=()
          while IFS= read -r line; do
            line="${line//[[:space:]]/}"; [ -n "$line" ] || continue
            [[ "$line" =~ ^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::bad git-deps line: $line"; exit 2; }
            repos[${line%%/*}]+="${line#*/} "
          done <<<"$GIT_DEPS"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          head=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          body=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64)
          sig=$(printf '%s.%s' "$head" "$body" | openssl dgst -sha256 -sign <(printf '%s\n' "$APP_KEY") | b64)
          jwt="$head.$body.$sig"
          api() { curl -sSf --retry 3 -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" "${@:2}"; }
          for owner in "${!repos[@]}"; do
            inst=$(api "$jwt" "$GITHUB_API_URL/orgs/$owner/installation" | jq -r .id) \
              || { echo "::error::the git-deps App has no installation on $owner"; exit 1; }
            read -ra list <<<"${repos[$owner]}"
            names=$(printf '%s\n' "${list[@]}" | jq -R . | jq -sc .)
            token=$(api "$jwt" -X POST "$GITHUB_API_URL/app/installations/$inst/access_tokens" \
              -d "{\"repositories\":$names,\"permissions\":{\"contents\":\"read\"}}" | jq -r .token)
            echo "::add-mask::$token"
            for r in "${list[@]}"; do
              git config --global url."https://x-access-token:${token}@github.com/$owner/$r".insteadOf "https://github.com/$owner/$r"
            done
            echo "read-only token for $owner: ${repos[$owner]}"
          done
          # Cargo's own git client does not read insteadOf; the git CLI does.
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - name: Compile cache (sccache)
        # One namespace per organization; the backend is the action's choice
        # (docs/adr/0004-fleet-rust-compile-cache.md).
        id: sccache
        uses: SylphxAI/.github/.github/actions/rust-sccache@d4305368ad744cdb047d8cdfd7588d99618cb5b5 # main after #171
        with:
          s3-access-key: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}
          key-prefix: ${{ inputs.key-prefix }}
      - name: Format
        if: inputs.fmt
        working-directory: ${{ inputs.workspace }}
        run: cargo fmt --all -- --check
      - name: Clippy
        if: inputs.clippy-args != ''
        working-directory: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          locked=(); [ "$IN_LOCKED" = true ] && locked=(--locked)
          feat=()
          case "$IN_FEATURES" in
            "") ;;
            all) feat=(--all-features) ;;
            *) feat=(--features "$IN_FEATURES") ;;
          esac
          read -ra args <<<"$IN_CLIPPY"
          cargo clippy "${locked[@]}" "${feat[@]}" "${args[@]}"
      - name: Test
        if: inputs.test-args != ''
        working-directory: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          locked=(); [ "$IN_LOCKED" = true ] && locked=(--locked)
          feat=()
          case "$IN_FEATURES" in
            "") ;;
            all) feat=(--all-features) ;;
            *) feat=(--features "$IN_FEATURES") ;;
          esac
          read -ra args <<<"$IN_TEST"
          cargo test "${locked[@]}" "${feat[@]}" "${args[@]}"
      - name: Cache report
        # Hit rate per run, for the before/after numbers (docs/rust-ci.md).
        if: always() && steps.sccache.outputs.backend != 'none' && steps.sccache.outputs.backend != ''
        env:
          BACKEND: ${{ steps.sccache.outputs.backend }}
        run: |
          stats="$(sccache --show-stats 2>&1)" || stats="sccache stats unavailable"
          printf '%s\n' "$stats"
          {
            echo "### Rust compile cache ($BACKEND, $GITHUB_EVENT_NAME)"
            echo '```'
            printf '%s\n' "$stats" | grep -E '^(Compile requests|Cache hits|Cache misses|Cache hits rate|Non-cacheable calls|Cache location)' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
