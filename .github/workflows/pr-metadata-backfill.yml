# optimistic-merge: gate-external
name: PR metadata origin comparison

on:
  workflow_dispatch:
    inputs:
      pull-request:
        type: string
        required: true
      expected-head:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  metadata-origin-comparison:
    if: github.ref == 'refs/heads/test/pr-metadata-status-evidence'
    runs-on: sylphx-linux-control
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 2b59c28e9be1fa59f8b2415998dcfabd65682631
          persist-credentials: false
      - name: Compare the unchanged publisher on its workflow head
        env:
          PR_METADATA_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.pull-request }}
          TARGET_HEAD: ${{ inputs.expected-head }}
        run: |
          python3 - <<'PYCODE'
          import importlib.util
          import json
          import os
          from pathlib import Path
          assert os.environ['TARGET_HEAD'] == os.environ['GITHUB_SHA']
          path = Path('.github/actions/pr-metadata-backfill/pr_metadata_backfill.py')
          spec = importlib.util.spec_from_file_location('publisher', path)
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          api = publisher.GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['PR_METADATA_TOKEN'])
          result = publisher.publish(api, int(os.environ['TARGET_PR']), os.environ['TARGET_HEAD'],
              os.environ['GITHUB_RUN_ID'], json.loads(publisher.policy.POLICY.read_text()))
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(result['status'] != 'success')
          PYCODE
