name: Project control

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      junit-producer-run:
        description: 'Completed Project control producer run to read from a different run.'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Only a superseded pull_request run is cancelled; merge_group and main pushes finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stack:
    # The shared check participates in this repository's real required verdict.
    runs-on: ${{ github.event.repository.private && 'sylphx-linux-standard' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/stack-conformance
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  project-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Enforce managed runner defaults
        run: |
          # Larger and GPU hosted runners are banned everywhere (owner#750).
          if grep -REn '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github templates --include='*.yml' --include='*.yaml' | grep -Ev '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo '::error::larger or GPU GitHub-hosted runners are banned (owner#750)'
            exit 1
          fi
      - name: Check Changesets publisher syntax
        run: node --check .github/actions/setup-changesets-publisher/changesets-publish.mjs

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the starter-template test reads the commit the template pins.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Prepare Keel tools cache consumer
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, runpy, subprocess
          suite = runpy.run_path('tests/test_setup_keel_tools.py')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keel-tools-consumer'
          source = root / 'source'
          (source / 'crates/keel-cli').mkdir(parents=True)
          (source / 'crates/keel-cli/Cargo.toml').write_text('[package]\nname="keel-cli"\n')
          git = lambda *args: subprocess.check_output(['git', '-C', str(source), *args],
              env={**os.environ, **suite['GIT_ENV']}, text=True).strip()
          git('init', '-q', '-b', 'main')
          git('add', '.')
          git('commit', '-qm', 'Consumer fixture ' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          fake = root / 'fakebin'
          fake.mkdir()
          (fake / 'cargo').write_text(suite['FAKE_CARGO'])
          (fake / 'cargo').chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(fake) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'KEEL_CONSUMER_SOURCE={source}\nKEEL_CONSUMER_PIN={git("rev-parse", "HEAD")}\n')
              stream.write(f'CARGO_LOG={root / "cargo.log"}\n')
              # A synthetic version cannot collide with a real tool artifact.
              stream.write(f'KEEL_CONSUMER_BINDGEN=0.0.{os.environ["GITHUB_RUN_ID"]}\n')
          PYTHON
      - name: Install consumer tools
        uses: ./.github/actions/setup-keel-tools
        with:
          pin: ${{ env.KEEL_CONSUMER_PIN }}
          keel-src: ${{ env.KEEL_CONSUMER_SOURCE }}
          wasm-bindgen: ${{ env.KEEL_CONSUMER_BINDGEN }}
      - name: Move only the consumer Keel pin
        run: |
          git -C "$KEEL_CONSUMER_SOURCE" -c user.name=t -c user.email=t@example.com commit -q --allow-empty -m 'Move consumer pin'
          echo "KEEL_CONSUMER_PIN=$(git -C "$KEEL_CONSUMER_SOURCE" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BINDGEN_INSTALLS=$(grep -c wasm-bindgen-cli "$CARGO_LOG" || true)" >> "$GITHUB_ENV"
          # Force the next invocation to restore from the cache service.
          rm -rf "${RUNNER_TEMP:?}/keel-tools"
      - name: Restore unchanged wasm-bindgen for the new Keel pin
        uses: ./.github/actions/setup-keel-tools
        with:
          pin: ${{ env.KEEL_CONSUMER_PIN }}
          keel-src: ${{ env.KEEL_CONSUMER_SOURCE }}
          wasm-bindgen: ${{ env.KEEL_CONSUMER_BINDGEN }}
      - name: Verify independent tool cache reuse
        run: |
          test "$(grep -c wasm-bindgen-cli "$CARGO_LOG" || true)" = "$BINDGEN_INSTALLS"
          test "$(grep -c 'install --path' "$CARGO_LOG")" = 2
          test "$(wasm-bindgen --version)" = "wasm-bindgen $KEEL_CONSUMER_BINDGEN"
          wasm-bindgen-test-runner --version
          keel --version
      - name: Lint authenticated JUnit consumer workflows
        uses: ./.github/actions/workflow-lint
        with:
          # `job.workflow_sha` is a real reusable-workflow context the bundled
          # actionlint schema does not know; `.github/actionlint.yaml` documents
          # the accepted warning, so the consumer's checkout ref is ignored here
          # the same way the image lane's is.
          ignore: |
            property "workflow_sha" is not defined
          args: |
            .github/workflows/project-control.yml
            .github/workflows/junit-consumer.yml
            .github/workflows/junit-consumer-control.yml
      - name: Prepare metadata sync consumer fixture
        env:
          SYNC_FIXTURE: ${{ runner.temp }}/metadata-consumer
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import runpy
          root = pathlib.Path(os.environ['SYNC_FIXTURE'])
          root.mkdir()
          runpy.run_path('tests/test_metadata_sync.py')['fixture'](root)
          PYTHON
      - name: Invoke metadata sync write as a consumer
        uses: ./.github/actions/metadata-sync
        with:
          plan: ${{ runner.temp }}/metadata-consumer/plan.json
          root-directory: ${{ runner.temp }}/metadata-consumer
          mode: write
      - name: Invoke metadata sync check as a consumer
        uses: ./.github/actions/metadata-sync
        with:
          plan: ${{ runner.temp }}/metadata-consumer/plan.json
          root-directory: ${{ runner.temp }}/metadata-consumer
      - name: Prepare shared brand consumer fixture
        env:
          BRAND_FIXTURE: ${{ runner.temp }}/brand-consumer
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import runpy
          root = pathlib.Path(os.environ['BRAND_FIXTURE'])
          root.mkdir()
          runpy.run_path('tests/test_brand.py')['fixture'](root)
          PYTHON
      - name: Invoke shared brand check as a consumer
        uses: ./.github/actions/brand
        with:
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data
      - name: Invoke shared brand write as a consumer
        uses: ./.github/actions/brand
        with:
          mode: write
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data
      - name: Check generated consumer provenance
        uses: ./.github/actions/brand
        with:
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data

  junit-producer:
    if: github.event_name != 'workflow_dispatch'
    name: JUnit fixture (${{ matrix.shard }})
    # Standard hosted runners are free only while this repository is public.
    runs-on: ${{ github.event.repository.private && 'sylphx-linux-standard' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        shard: [1, 701]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Prepare nested passing and failing JUnit cases
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/junit/nested"
          printf '<testsuite><testcase classname="suite" name="broken-%s"><failure/></testcase><testcase classname="suite" name="passing-%s"/></testsuite>\n' "$SHARD" "$SHARD" > "$RUNNER_TEMP/junit/nested/junit.xml"
      - name: run-store put junit-consumer-${{ matrix.shard }}
        uses: ./.github/actions/run-store
        with:
          mode: put
          name: junit-consumer-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit

  junit-consumer:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/junit-consumer.yml
    with:
      producer-run: ${{ inputs.junit-producer-run }}

  # The optimistic-merge actions, run as a consumer runs them: a manifest the
  # runner cannot load (an expression in a description, a bad input) fails
  # here, before any repository pins it (#111). The starters are linted as
  # workflows, placed where a repository keeps them.
  template-plan:
    # A push would walk the trunk's history for a `verified` check this
    # repository never publishes; pull requests and merge groups diff their
    # own base.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.range.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          filter: blob:none
      - id: range
        uses: ./.github/actions/ci-range
        with:
          lanes: |
            always:
            actions: .github/actions/*
      - name: The range selected lanes
        env:
          RUN: ${{ steps.range.outputs.run }}
        run: jq -e '.always == true' <<<"$RUN"
      - name: The starters lint as workflows
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/starter"
          mkdir -p "$work/.github/workflows"
          cp workflow-templates/optimistic-gate.yml "$work/.github/workflows/ci.yml"
          cp workflow-templates/optimistic-verify.yml "$work/.github/workflows/verify.yml"
          cp workflow-templates/red-main.yml "$work/.github/workflows/red-main.yml"
          cp workflow-templates/rust-check.yml "$work/.github/workflows/sylphx-check.yml"
          cp workflow-templates/rust-ci.yml "$work/.github/workflows/rust-ci.yml"
          cp workflow-templates/keel-repin.yml "$work/.github/workflows/keel-repin.yml"
          cp workflow-templates/keel-pin-check.yml "$work/.github/workflows/keel-pin-check.yml"
          cp workflow-templates/pages-publish.yml "$work/.github/workflows/pages-publish.yml"
          cp .github/actionlint.yaml "$work/.github/actionlint.yaml"
          git -C "$work" init -q
      - name: actionlint on the starters
        uses: ./.github/actions/workflow-lint
        with:
          # One argument per line, and a pattern with spaces and quotes, as a
          # consumer writes them.
          ignore: |
            property "never-matches-anything" is not defined
          args: |
            -config-file
            .github/actionlint.yaml
            ${{ runner.temp }}/starter/.github/workflows/ci.yml
            ${{ runner.temp }}/starter/.github/workflows/verify.yml
            ${{ runner.temp }}/starter/.github/workflows/red-main.yml
            ${{ runner.temp }}/starter/.github/workflows/sylphx-check.yml
            ${{ runner.temp }}/starter/.github/workflows/rust-ci.yml
            ${{ runner.temp }}/starter/.github/workflows/keel-repin.yml
            ${{ runner.temp }}/starter/.github/workflows/keel-pin-check.yml
            ${{ runner.temp }}/starter/.github/workflows/pages-publish.yml

  template-verdict:
    needs: template-plan
    if: always() && !cancelled() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs-pass
        with:
          needs: ${{ toJSON(needs) }}
          required: template-plan

  # Aggregate verdict required by the main merge queue ruleset. Skipped jobs
  # pass; failed or cancelled jobs fail.
  ci-ok:
    needs: [stack, project-control, tests, template-plan, template-verdict, junit-producer, junit-consumer]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs-pass
        with:
          needs: ${{ toJSON(needs) }}
          required: stack,project-control,tests
