name: Project control

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Only a superseded pull_request run is cancelled; merge_group and main pushes finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  project-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Enforce managed runner defaults
        run: |
          set -euo pipefail
          reusable=.github/workflows/adr29-admission.yml
          template=templates/workflows/adr29-admission.yml
          project_control=.github/workflows/project-control.yml
          test "$(grep -Ec '^[[:space:]]*runs-on:' "$reusable")" -eq 1
          test "$(grep -Ec '^[[:space:]]*runs-on:[[:space:]]*sylphx-linux-standard$' "$reusable")" -eq 1
          test "$(grep -Ec '^[[:space:]]*runs-on:' "$template")" -eq 4
          test "$(grep -Ec '^[[:space:]]*runs-on:[[:space:]]*sylphx-linux-standard$' "$template")" -eq 4
          test "$(grep -Ec '^[[:space:]]*runs-on:' "$project_control")" -eq 6
          test "$(grep -Ec '^[[:space:]]*runs-on:[[:space:]]*ubuntu-latest$' "$project_control")" -eq 5
          test "$(grep -Ec '^[[:space:]]*runs-on:[[:space:]]*sylphx-linux-standard$' "$project_control")" -eq 1
          # owner#750 (zero metered GitHub spend): the admission template and
          # reusable workflow serve private repositories, so they run on our
          # runners only (asserted above). This public repository's own jobs
          # run on GitHub's free standard hosted runners (asserted above);
          # larger and GPU hosted runners are banned everywhere.
          if grep -REn '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github templates --include='*.yml' --include='*.yaml' | grep -Ev '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo '::error::larger or GPU GitHub-hosted runners are banned (owner#750)'
            exit 1
          fi
          if grep -REn '^[[:space:]]*runs-on:[[:space:]]*.*[$][{][{]' "$reusable" "$template" "$project_control"; then
            echo '::error::dynamic runner declarations are not allowed in ADR-29 policy surfaces'
            exit 1
          fi
      - name: Check Changesets publisher syntax
        run: node --check .github/actions/setup-changesets-publisher/changesets-publish.mjs

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Prepare metadata sync consumer fixture
        env:
          SYNC_FIXTURE: ${{ runner.temp }}/metadata-consumer
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import runpy
          root = pathlib.Path(os.environ['SYNC_FIXTURE'])
          root.mkdir()
          runpy.run_path('tests/test_metadata_sync.py')['fixture'](root)
          PYTHON
      - name: Invoke metadata sync write as a consumer
        uses: ./.github/actions/metadata-sync
        with:
          plan: ${{ runner.temp }}/metadata-consumer/plan.json
          root-directory: ${{ runner.temp }}/metadata-consumer
          mode: write
      - name: Invoke metadata sync check as a consumer
        uses: ./.github/actions/metadata-sync
        with:
          plan: ${{ runner.temp }}/metadata-consumer/plan.json
          root-directory: ${{ runner.temp }}/metadata-consumer
      - name: Prepare shared brand consumer fixture
        env:
          BRAND_FIXTURE: ${{ runner.temp }}/brand-consumer
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import runpy
          root = pathlib.Path(os.environ['BRAND_FIXTURE'])
          root.mkdir()
          runpy.run_path('tests/test_brand.py')['fixture'](root)
          PYTHON
      - name: Invoke shared brand check as a consumer
        uses: ./.github/actions/brand
        with:
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data
      - name: Invoke shared brand write as a consumer
        uses: ./.github/actions/brand
        with:
          mode: write
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data
      - name: Check generated consumer provenance
        uses: ./.github/actions/brand
        with:
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data

  # The optimistic-merge actions, run as a consumer runs them: a manifest the
  # runner cannot load (an expression in a description, a bad input) fails
  # here, before any repository pins it (#111). The starters are linted as
  # workflows, placed where a repository keeps them.
  template-plan:
    # A push would walk the trunk's history for a `verified` check this
    # repository never publishes; pull requests and merge groups diff their
    # own base.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.range.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          filter: blob:none
      - id: range
        uses: ./.github/actions/ci-range
        with:
          lanes: |
            always:
            actions: .github/actions/*
      - name: The range selected lanes
        env:
          RUN: ${{ steps.range.outputs.run }}
        run: jq -e '.always == true' <<<"$RUN"
      - name: The starters lint as workflows
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/starter"
          mkdir -p "$work/.github/workflows"
          cp workflow-templates/optimistic-gate.yml "$work/.github/workflows/ci.yml"
          cp workflow-templates/optimistic-verify.yml "$work/.github/workflows/verify.yml"
          cp workflow-templates/red-main.yml "$work/.github/workflows/red-main.yml"
          cp workflow-templates/rust-check.yml "$work/.github/workflows/sylphx-check.yml"
          cp workflow-templates/keel-repin.yml "$work/.github/workflows/keel-repin.yml"
          cp workflow-templates/keel-pin-check.yml "$work/.github/workflows/keel-pin-check.yml"
          cp .github/actionlint.yaml "$work/.github/actionlint.yaml"
          git -C "$work" init -q
      - name: actionlint on the starters
        uses: ./.github/actions/workflow-lint
        with:
          # One argument per line, and a pattern with spaces and quotes, as a
          # consumer writes them.
          ignore: |
            property "never-matches-anything" is not defined
          args: |
            -config-file
            .github/actionlint.yaml
            ${{ runner.temp }}/starter/.github/workflows/ci.yml
            ${{ runner.temp }}/starter/.github/workflows/verify.yml
            ${{ runner.temp }}/starter/.github/workflows/red-main.yml
            ${{ runner.temp }}/starter/.github/workflows/sylphx-check.yml
            ${{ runner.temp }}/starter/.github/workflows/keel-repin.yml
            ${{ runner.temp }}/starter/.github/workflows/keel-pin-check.yml

  template-verdict:
    needs: template-plan
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs-pass
        with:
          needs: ${{ toJSON(needs) }}
          required: template-plan

  review-stamp:
    if: github.event_name == 'merge_group'
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # This repository ships the gate: run its code and policy from the merge
      # group's BASE commit, never the queued head, so a PR cannot rewrite the
      # trust list that grades it. The head copy runs only for first adoption,
      # while the base has no gate yet.
      - name: Check out the gate from the base commit
        id: gate-base
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:.github/actions/review-stamp-gate/review_stamp_gate.py" 2>/dev/null; then
            mkdir -p .review-gate-base
            git archive "$BASE_SHA" .github/actions/review-stamp-gate | tar -x -C .review-gate-base
            echo "from=base" >> "$GITHUB_OUTPUT"
          else
            echo "base $BASE_SHA has no review-stamp-gate; first adoption runs the queued copy"
            echo "from=head" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate-base.outputs.from == 'base'
        uses: ./.review-gate-base/.github/actions/review-stamp-gate
        with:
          config-path: .github/review-stamp.json
          trusted-creator-ids: '8020099'
      - if: steps.gate-base.outputs.from == 'head'
        uses: ./.github/actions/review-stamp-gate
        with:
          config-path: .github/review-stamp.json
          trusted-creator-ids: '8020099'

  # Aggregate verdict required by the main merge queue ruleset. Skipped jobs
  # pass; failed or cancelled jobs fail.
  ci-ok:
    needs: [project-control, tests, template-plan, template-verdict, review-stamp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<<"$NEEDS"
