# pr-concurrency: exception code-pr-association — Explicit base-retarget validation associates code-pr dispatch with native PR evidence; preserve its qualification and retarget routing.
name: Project control

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      code-merge:
        description: Immutable merge commit for PR base validation.
        type: string
      code-head:
        description: Exact PR head represented by code-merge.
        type: string
      code-base:
        description: Exact PR base represented by code-merge.
        type: string
      code-pr:
        type: string
      code-base-ref:
        type: string
      junit-producer-run:
        description: 'Completed Project control producer run to read from a different run.'
        required: false
        type: string

concurrency:
  # A consumer qualification must not replace pending native PR validation.
  group: ${{ github.workflow }}-${{ github.event.inputs.junit-producer-run && format('consumer-run-{0}', github.run_id) || (github.event.pull_request.number || github.event.inputs.code-pr) && format('pr-{0}', github.event.pull_request.number || github.event.inputs.code-pr) || format('run-{0}', github.run_id) }}
  # Only a superseded pull_request run is cancelled; merge_group and main pushes finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  stack:
    # The shared check participates in this repository's real required verdict.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/stack-conformance
        with:
          auth-surface: full
          base: ${{ github.event.inputs.code-base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || (github.event_name == 'workflow_dispatch' && format('{0}^1', github.sha)) }}

  project-control:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Enforce managed runner defaults
        run: |
          # Larger and GPU hosted runners are banned everywhere (owner#750).
          if grep -REn '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github templates --include='*.yml' --include='*.yaml' | grep -Ev '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo '::error::larger or GPU GitHub-hosted runners are banned (owner#750)'
            exit 1
          fi
      - name: Check mechanism boundaries
        run: python3 scripts/check_mechanism_boundary.py --policy .architecture-policy.json
      - name: Check Changesets publisher syntax
        run: node --check .github/actions/setup-changesets-publisher/changesets-publish.mjs

  tests:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-standard' }}
    # A green full suite took over nine minutes in the merge queue. Leave room
    # for setup and consumer checks within the queue's 20-minute check deadline.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          # Full history: the starter-template test reads the commit the template pins.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Check CI policy as a consumer
        uses: ./.github/actions/ci-policy
        with:
          contribution-scope: commits
      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml pytest
      - name: Set up Rust for native consumer fixtures
        run: rustup default stable
      - name: Set up native report consumer
        id: ci-test
        uses: ./.github/actions/setup-ci-test
      - name: Set up Node for the Vitest consumer
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Install native Vitest reporter
        run: |
          npm install --prefix "$RUNNER_TEMP/ci-test-runners" --include=optional --ignore-scripts --no-audit --no-fund vitest@4.0.18
          # npm can silently omit Rollup's optional native dependency.
          rollup_version=$(node -p 'require(process.env.RUNNER_TEMP + "/ci-test-runners/node_modules/rollup/package.json").version')
          rollup_arch=$(node -p 'process.arch')
          npm install --prefix "$RUNNER_TEMP/ci-test-runners" --ignore-scripts --no-audit --no-fund "@rollup/rollup-linux-${rollup_arch}-gnu@${rollup_version}"
      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TEST_SCRIPT: ${{ steps.ci-test.outputs.script }}
          CI_TEST_VITEST_BIN: ${{ runner.temp }}/ci-test-runners/node_modules/.bin/vitest
          CI_TEST_REQUIRE_RUNNERS: '1'
          CARGO_TARGET_DIR: ${{ runner.temp }}/consumer-target
        run: python -m unittest discover -s tests
      - name: Artifact publishing and PR reuse contracts
        run: python -m pytest -q tests/test_artifact_image_publish.py tests/test_ci_range_pr_reuse.py
      - name: Prepare Keel tools cache consumer
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, runpy, subprocess
          suite = runpy.run_path('tests/test_setup_keel_tools.py')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keel-tools-consumer'
          source = root / 'source'
          (source / 'crates/keel-cli').mkdir(parents=True)
          (source / 'crates/keel-cli/Cargo.toml').write_text('[package]\nname="keel-cli"\n')
          git = lambda *args: subprocess.check_output(['git', '-C', str(source), *args],
              env={**os.environ, **suite['GIT_ENV']}, text=True).strip()
          git('init', '-q', '-b', 'main')
          git('add', '.')
          git('commit', '-qm', 'Consumer fixture ' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          fake = root / 'fakebin'
          fake.mkdir()
          (fake / 'cargo').write_text(suite['FAKE_CARGO'])
          (fake / 'cargo').chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(fake) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'KEEL_CONSUMER_SOURCE={source}\nKEEL_CONSUMER_PIN={git("rev-parse", "HEAD")}\n')
              stream.write(f'CARGO_LOG={root / "cargo.log"}\n')
              # A synthetic version cannot collide with a real tool artifact.
              stream.write(f'KEEL_CONSUMER_BINDGEN=0.0.{os.environ["GITHUB_RUN_ID"]}\n')
          PYTHON
      - name: Install consumer tools
        uses: ./.github/actions/setup-keel-tools
        with:
          pin: ${{ env.KEEL_CONSUMER_PIN }}
          keel-src: ${{ env.KEEL_CONSUMER_SOURCE }}
          wasm-bindgen: ${{ env.KEEL_CONSUMER_BINDGEN }}
      - name: Move only the consumer Keel pin
        run: |
          git -C "$KEEL_CONSUMER_SOURCE" -c user.name=t -c user.email=t@example.com commit -q --allow-empty -m 'Move consumer pin'
          echo "KEEL_CONSUMER_PIN=$(git -C "$KEEL_CONSUMER_SOURCE" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BINDGEN_INSTALLS=$(grep -c wasm-bindgen-cli "$CARGO_LOG" || true)" >> "$GITHUB_ENV"
          # The functional proof needs a known restored payload, not an
          # immediate hit from the external cache service. Queue run 41618406546
          # saved the key and then missed it in the same job. Cache misses must
          # remain a supported cold-build path, never a flaky gate or a retry.
          snapshot="$(mktemp -d "${RUNNER_TEMP:?}/keel-tools-cache.XXXXXX")"
          cp -a "$RUNNER_TEMP/keel-tools/wasm-bindgen" "$snapshot/wasm-bindgen"
          rm -rf "$RUNNER_TEMP/keel-tools"
          mkdir -p "$RUNNER_TEMP/keel-tools"
          mv "$snapshot/wasm-bindgen" "$RUNNER_TEMP/keel-tools/wasm-bindgen"
          rmdir "$snapshot"
      - name: Restore unchanged wasm-bindgen for the new Keel pin
        uses: ./.github/actions/setup-keel-tools
        with:
          pin: ${{ env.KEEL_CONSUMER_PIN }}
          keel-src: ${{ env.KEEL_CONSUMER_SOURCE }}
          wasm-bindgen: ${{ env.KEEL_CONSUMER_BINDGEN }}
      - name: Verify independent tool cache reuse
        run: |
          test "$(grep -c wasm-bindgen-cli "$CARGO_LOG" || true)" = "$BINDGEN_INSTALLS"
          test "$(grep -c 'install --path' "$CARGO_LOG")" = 2
          test "$(wasm-bindgen --version)" = "wasm-bindgen $KEEL_CONSUMER_BINDGEN"
          wasm-bindgen-test-runner --version
          keel --version
      - name: Lint authenticated JUnit consumer workflows
        uses: ./.github/actions/workflow-lint
        with:
          # `job.workflow_sha` is a real reusable-workflow context the bundled
          # actionlint schema does not know; `.github/actionlint.yaml` documents
          # the accepted warning, so the consumer's checkout ref is ignored here
          # the same way the image lane's is.
          ignore: |
            property "workflow_sha" is not defined
          args: |
            .github/workflows/project-control.yml
            .github/workflows/junit-consumer.yml
            .github/workflows/junit-consumer-control.yml
      - name: Prepare metadata sync consumer fixture
        env:
          SYNC_FIXTURE: ${{ runner.temp }}/metadata-consumer
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import runpy
          root = pathlib.Path(os.environ['SYNC_FIXTURE'])
          root.mkdir()
          runpy.run_path('tests/test_metadata_sync.py')['fixture'](root)
          PYTHON
      - name: Invoke metadata sync write as a consumer
        uses: ./.github/actions/metadata-sync
        with:
          plan: ${{ runner.temp }}/metadata-consumer/plan.json
          root-directory: ${{ runner.temp }}/metadata-consumer
          mode: write
      - name: Invoke metadata sync check as a consumer
        uses: ./.github/actions/metadata-sync
        with:
          plan: ${{ runner.temp }}/metadata-consumer/plan.json
          root-directory: ${{ runner.temp }}/metadata-consumer
      - name: Prepare shared brand consumer fixture
        env:
          BRAND_FIXTURE: ${{ runner.temp }}/brand-consumer
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import runpy
          root = pathlib.Path(os.environ['BRAND_FIXTURE'])
          root.mkdir()
          runpy.run_path('tests/test_brand.py')['fixture'](root)
          PYTHON
      - name: Invoke shared brand check as a consumer
        uses: ./.github/actions/brand
        with:
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data
      - name: Invoke shared brand write as a consumer
        uses: ./.github/actions/brand
        with:
          mode: write
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data
      - name: Check generated consumer provenance
        uses: ./.github/actions/brand
        with:
          brand-directory: ${{ runner.temp }}/brand-consumer/brand data

  junit-producer:
    if: github.event_name != 'workflow_dispatch' || !inputs.junit-producer-run
    name: JUnit fixture (${{ matrix.shard }})
    # Standard hosted runners are free only while this repository is public.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        shard: [1, 701]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          persist-credentials: false
      - name: Prepare nested passing and failing JUnit cases
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/junit/nested"
          printf '<testsuite><testcase classname="suite" name="broken-%s"><failure/></testcase><testcase classname="suite" name="passing-%s"/></testsuite>\n' "$SHARD" "$SHARD" > "$RUNNER_TEMP/junit/nested/junit.xml"
      - name: run-store put junit-consumer-${{ matrix.shard }}
        uses: ./.github/actions/run-store
        with:
          mode: put
          name: junit-consumer-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit

  junit-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.junit-producer-run != ''
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/junit-consumer.yml
    with:
      producer-run: ${{ inputs.junit-producer-run }}

  # The optimistic-merge actions, run as a consumer runs them: a manifest the
  # runner cannot load (an expression in a description, a bad input) fails
  # here, before any repository pins it (#111). The starters are linted as
  # workflows, placed where a repository keeps them.
  template-plan:
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    # A push would walk the trunk's history for a `verified` check this
    # repository never publishes; pull requests and merge groups diff their
    # own base.
    if: github.event_name != 'push'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 10
    outputs:
      run: ${{ steps.range.outputs.run }}
      pr-reused: ${{ steps.pr-reuse.outcome == 'success' && steps.pr-reuse.outputs.pr-reused == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          persist-credentials: false
          filter: blob:none
      - id: range
        uses: ./.github/actions/ci-range
        with:
          lanes: |
            always:
            actions: .github/actions/*
      - name: The range selected lanes
        env:
          RUN: ${{ steps.range.outputs.run }}
        run: jq -e '.always == true' <<<"$RUN"
      - name: The starters lint as workflows
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/starter"
          mkdir -p "$work/.github/workflows"
          cp workflow-templates/optimistic-gate.yml "$work/.github/workflows/ci.yml"
          cp workflow-templates/optimistic-verify.yml "$work/.github/workflows/verify.yml"
          cp workflow-templates/red-main.yml "$work/.github/workflows/red-main.yml"
          cp workflow-templates/rust-check.yml "$work/.github/workflows/sylphx-check.yml"
          cp workflow-templates/rust-ci.yml "$work/.github/workflows/rust-ci.yml"
          cp workflow-templates/pr-metadata.yml "$work/.github/workflows/pr-metadata.yml"
          cp workflow-templates/keel-repin.yml "$work/.github/workflows/keel-repin.yml"
          cp workflow-templates/keel-pin-check.yml "$work/.github/workflows/keel-pin-check.yml"
          cp workflow-templates/pages-publish.yml "$work/.github/workflows/pages-publish.yml"
          cp .github/actionlint.yaml "$work/.github/actionlint.yaml"
          git -C "$work" init -q
      - name: actionlint on the starters
        uses: ./.github/actions/workflow-lint
        with:
          # One argument per line, and a pattern with spaces and quotes, as a
          # consumer writes them.
          ignore: |
            property "never-matches-anything" is not defined
          args: |
            -config-file
            .github/actionlint.yaml
            ${{ runner.temp }}/starter/.github/workflows/ci.yml
            ${{ runner.temp }}/starter/.github/workflows/verify.yml
            ${{ runner.temp }}/starter/.github/workflows/red-main.yml
            ${{ runner.temp }}/starter/.github/workflows/sylphx-check.yml
            ${{ runner.temp }}/starter/.github/workflows/rust-ci.yml
            ${{ runner.temp }}/starter/.github/workflows/pr-metadata.yml
            ${{ runner.temp }}/starter/.github/workflows/keel-repin.yml
            ${{ runner.temp }}/starter/.github/workflows/keel-pin-check.yml
            ${{ runner.temp }}/starter/.github/workflows/pages-publish.yml

      - name: Check for prior Rust verification of the same tree
        id: pr-reuse
        if: github.event_name == 'merge_group'
        continue-on-error: true
        uses: ./.github/actions/ci-range
        with:
          mode: merge-group
          pr-reuse-local-workflow: rust-ci.yml
          pr-reuse-job: rust-node-consumer / Rust (fmt, clippy, test)
          pr-reuse-aggregate: ci-ok

  template-verdict:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    needs: template-plan
    if: always() && !cancelled() && github.event_name != 'push'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/needs-pass
        with:
          separate-pr-metadata: 'true'
          needs: ${{ toJSON(needs) }}
          required: template-plan

  rust-node-consumer:
    needs: template-plan
    if: ${{ !cancelled() && !(github.event_name == 'merge_group' && needs.template-plan.result == 'success' && needs.template-plan.outputs.pr-reused == 'true') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-ci.yml
    with:
      runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-standard' }}
      workspace: tests/fixtures/rust-node-consumer
      # Tree reuse requires the same toolchain on PR and queue, not floating stable.
      toolchain: '1.100.0'
      node-version: '26.13.1'
      npm-ci: true

  ci-range-consumer:
    runs-on: ${{ github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    # Both independent selections may exhaust the bounded proof ancestor walk.
    # Budget for both walks plus the required final contract assertions.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select with optional authenticated queue reuse
        id: range
        uses: ./.github/actions/ci-range
        with:
          lanes: 'proof: *'
          reuse-workflow: project-control.yml
          reuse-aggregate: ci-ok
          reuse-jobs: '{"proof":["tests"]}'
      - name: Explicit requests always execute
        id: explicit
        uses: ./.github/actions/ci-range
        with:
          lanes: 'proof: *'
          only: proof
          reuse-workflow: project-control.yml
          reuse-aggregate: ci-ok
          reuse-jobs: '{"proof":["tests"]}'
      - name: Check the composite action contract
        env:
          SELECTED: ${{ steps.range.outputs.run }}
          EXECUTE: ${{ steps.range.outputs.execute }}
          REUSED: ${{ steps.range.outputs.reused }}
          PROOF: ${{ steps.range.outputs.reuse-proof }}
          EXPLICIT_EXECUTE: ${{ steps.explicit.outputs.execute }}
          EXPLICIT_REUSED: ${{ steps.explicit.outputs.reused }}
          EXPLICIT_PROOF: ${{ steps.explicit.outputs.reuse-proof }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          selected, execute, reused, proof = (json.loads(os.environ[key]) for key in
                                               ('SELECTED', 'EXECUTE', 'REUSED', 'PROOF'))
          assert selected == {'proof': True}, selected
          assert execute == {'proof': not reused['proof']}, (execute, reused)
          if reused['proof']:
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              assert proof['sha'] == os.environ['GITHUB_SHA']
              assert proof['repository'] == os.environ['GITHUB_REPOSITORY']
              assert proof['lanes'] == {'proof': ['tests']}
              assert set(proof['jobs']) == {'ci-ok', 'tests'}
          else:
              assert proof == {}, proof
          assert json.loads(os.environ['EXPLICIT_EXECUTE']) == {'proof': True}
          assert json.loads(os.environ['EXPLICIT_REUSED']) == {'proof': False}
          assert json.loads(os.environ['EXPLICIT_PROOF']) == {}
          print(json.dumps({'execute': execute, 'reused': reused, 'proof': proof}, sort_keys=True))
          PYTHON

  # Every required job must succeed. Only a proven identical queue tree can reuse Rust.
  ci-ok:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    needs: [stack, project-control, tests, template-plan, template-verdict, junit-producer, junit-consumer, rust-node-consumer, ci-range-consumer]
    if: always()
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.code-merge || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-ok
        with:
          separate-pr-metadata: 'true'
          needs: ${{ toJSON(needs) }}
          required: stack,project-control,tests,ci-range-consumer,${{ !(github.event_name == 'merge_group' && needs.template-plan.result == 'success' && needs.template-plan.outputs.pr-reused == 'true') && 'rust-node-consumer' || '' }},${{ github.event_name != 'push' && 'template-plan,template-verdict' || '' }},${{ (github.event_name != 'workflow_dispatch' || !inputs.junit-producer-run) && 'junit-producer' || 'junit-consumer' }}
