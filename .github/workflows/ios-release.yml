name: iOS release

# Sign, archive, export and upload an iOS app to TestFlight on the internal
# macOS runner class ([self-hosted, macos, sylphx, standard]; docs/ios-release.md).
#
# Why a reusable workflow and not a composite action: the temporary keychain,
# the installed profiles and the API key must be removed by an `if: always()`
# step of the same job, and a composite action has no post step, so every
# caller would have to remember its own cleanup. One workflow keeps setup,
# build, upload and cleanup in one job, and it needs no action pin of its own.
#
# Trust boundary: every secret travels through the `env:` of the one step that
# needs it and is never echoed. Caller inputs never reach a shell body; they
# travel through `env:` and are validated against a strict pattern first.
# Callers pass each secret by name (docs/ios-release.md).

on:
  workflow_call:
    inputs:
      scheme:
        description: Xcode scheme to archive.
        required: true
        type: string
      bundle-id:
        description: Bundle identifier of the app; selects its provisioning profile for the archive.
        required: true
        type: string
      workspace:
        description: Path of the .xcworkspace, relative to the repository root. Set this or project.
        required: false
        type: string
        default: ''
      project:
        description: Path of the .xcodeproj, relative to the repository root. Used when workspace is empty.
        required: false
        type: string
        default: ''
      configuration:
        description: Build configuration.
        required: false
        type: string
        default: Release
      xcconfig:
        description: >
          Optional .xcconfig path in the repository, passed to xcodebuild archive
          (for per-target settings when the app has extensions).
        required: false
        type: string
        default: ''
      build-number:
        description: Optional CURRENT_PROJECT_VERSION override (for example the run number).
        required: false
        type: string
        default: ''
      ref:
        description: Branch, tag, or commit to check out; empty is the caller's own ref.
        required: false
        type: string
        default: ''
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        description: App Store Connect API key id.
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        description: App Store Connect API issuer id.
        required: true
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64:
        description: The API key .p8 file, base64.
        required: true
      IOS_DIST_CERTIFICATE_BASE64:
        description: Apple Distribution certificate with its private key (.p12), base64.
        required: true
      IOS_DIST_CERTIFICATE_PASSWORD:
        description: Password of the .p12.
        required: true
      APPLE_TEAM_ID:
        description: Apple Developer team id.
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        description: >
          App Store provisioning profile(s), base64. One profile per line when
          the app has extensions.
        required: true

permissions:
  contents: read

jobs:
  release:
    name: sign, archive, upload
    runs-on: [self-hosted, macos, sylphx, standard]
    timeout-minutes: 90
    env:
      IN_SCHEME: ${{ inputs.scheme }}
      IN_BUNDLE_ID: ${{ inputs.bundle-id }}
      IN_WORKSPACE: ${{ inputs.workspace }}
      IN_PROJECT: ${{ inputs.project }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_XCCONFIG: ${{ inputs.xcconfig }}
      IN_BUILD_NUMBER: ${{ inputs.build-number }}
      IN_REF: ${{ inputs.ref }}
    steps:
      - name: Validate inputs
        timeout-minutes: 2
        run: |
          set -euo pipefail
          path_ok() {
            [[ "$1" =~ ^[A-Za-z0-9_./\ +-]{1,200}$ ]] || return 1
            case "$1" in /* | *..*) return 1 ;; esac
          }
          echo "IOS_SIGN_DIR=$RUNNER_TEMP/ios-signing" >> "$GITHUB_ENV"
          [[ "$IN_SCHEME" =~ ^[A-Za-z0-9_.\ +-]{1,100}$ ]] || { echo "::error::bad scheme"; exit 2; }
          [[ "$IN_BUNDLE_ID" =~ ^[A-Za-z0-9.-]{1,155}$ ]] || { echo "::error::bad bundle-id"; exit 2; }
          [[ "$IN_CONFIGURATION" =~ ^[A-Za-z0-9_\ -]{1,50}$ ]] || { echo "::error::bad configuration"; exit 2; }
          [[ "$IN_BUILD_NUMBER" =~ ^[0-9]{0,9}$ ]] || { echo "::error::bad build-number"; exit 2; }
          [[ "$IN_REF" =~ ^[A-Za-z0-9._/@+-]{0,200}$ && "$IN_REF" != -* ]] || { echo "::error::bad ref"; exit 2; }
          if [ -z "$IN_WORKSPACE" ] && [ -z "$IN_PROJECT" ]; then
            echo "::error::set workspace or project"; exit 2
          fi
          for p in "$IN_WORKSPACE" "$IN_PROJECT" "$IN_XCCONFIG"; do
            [ -z "$p" ] || path_ok "$p" || { echo "::error::bad path input"; exit 2; }
          done

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 10
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Signing setup (temporary keychain, certificate, profiles)
        timeout-minutes: 10
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$IOS_SIGN_DIR"
          keychain="$IOS_SIGN_DIR/build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db"
          # Recorded before anything is created, so the cleanup step finds it
          # even when this step fails half way.
          {
            echo "IOS_SIGN_KEYCHAIN=$keychain"
            echo "IOS_SIGN_DIR=$IOS_SIGN_DIR"
          } >> "$GITHUB_ENV"

          kc_password="$(openssl rand -hex 24)"
          echo "::add-mask::$kc_password"

          # Keep the existing user search list; cleanup restores it.
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$IOS_SIGN_DIR/keychains.list"

          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          mapfile -t existing < "$IOS_SIGN_DIR/keychains.list"
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          printf '%s' "$CERT_BASE64" | base64 --decode > "$IOS_SIGN_DIR/dist.p12"
          chmod 600 "$IOS_SIGN_DIR/dist.p12"
          security import "$IOS_SIGN_DIR/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution" \
            || { echo "::error::no Apple Distribution identity in the imported certificate"; exit 1; }
          rm -f "$IOS_SIGN_DIR/dist.p12"

          # Provisioning profiles: one base64 blob per line.
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          : > "$IOS_SIGN_DIR/installed.list"
          : > "$IOS_SIGN_DIR/profiles.tsv"
          n=0
          while IFS= read -r line; do
            line="${line//[[:space:]]/}"
            [ -n "$line" ] || continue
            n=$((n + 1))
            raw="$IOS_SIGN_DIR/profile-$n.mobileprovision"
            plist="$IOS_SIGN_DIR/profile-$n.plist"
            printf '%s' "$line" | base64 --decode > "$raw"
            security cms -D -i "$raw" > "$plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            [[ "$uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo "::error::profile $n has no valid UUID"; exit 1; }
            [[ "$name" =~ ^[^\"\\]{1,200}$ ]] || { echo "::error::profile $n has an unsupported name"; exit 1; }
            bundle="${appid#*.}"
            cp "$raw" "$profiles_dir/$uuid.mobileprovision"
            chmod 600 "$profiles_dir/$uuid.mobileprovision"
            echo "$profiles_dir/$uuid.mobileprovision" >> "$IOS_SIGN_DIR/installed.list"
            printf '%s\t%s\n' "$bundle" "$name" >> "$IOS_SIGN_DIR/profiles.tsv"
            rm -f "$raw" "$plist"
          done <<< "$PROFILES_BASE64"
          [ "$n" -gt 0 ] || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 holds no profile"; exit 1; }
          echo "installed $n provisioning profile(s)"

      - name: Archive
        timeout-minutes: 60
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID is not a 10-character team id"; exit 2; }
          specifier="$(awk -F'\t' -v b="$IN_BUNDLE_ID" '$1 == b { print $2; exit }' "$IOS_SIGN_DIR/profiles.tsv")"
          [ -n "$specifier" ] || { echo "::error::no installed profile matches bundle-id $IN_BUNDLE_ID"; exit 1; }
          if [ -n "$IN_WORKSPACE" ]; then target=(-workspace "$IN_WORKSPACE"); else target=(-project "$IN_PROJECT"); fi
          args=("${target[@]}" -scheme "$IN_SCHEME" -configuration "$IN_CONFIGURATION"
            -destination 'generic/platform=iOS' -archivePath "$IOS_SIGN_DIR/App.xcarchive"
            CODE_SIGN_STYLE=Manual "DEVELOPMENT_TEAM=$TEAM_ID" "CODE_SIGN_IDENTITY=Apple Distribution"
            "PROVISIONING_PROFILE_SPECIFIER=$specifier"
            "OTHER_CODE_SIGN_FLAGS=--keychain $IOS_SIGN_KEYCHAIN")
          [ -z "$IN_XCCONFIG" ] || args+=(-xcconfig "$IN_XCCONFIG")
          [ -z "$IN_BUILD_NUMBER" ] || args+=("CURRENT_PROJECT_VERSION=$IN_BUILD_NUMBER")
          xcodebuild archive "${args[@]}"

      - name: Export
        timeout-minutes: 20
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          opts="$IOS_SIGN_DIR/ExportOptions.plist"
          rm -f "$opts"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$opts"; }
          pb "Add :method string app-store-connect"
          pb "Add :signingStyle string manual"
          pb "Add :teamID string $TEAM_ID"
          pb "Add :destination string export"
          pb "Add :uploadSymbols bool true"
          pb "Add :provisioningProfiles dict"
          while IFS=$'\t' read -r bundle name; do
            pb "Add :provisioningProfiles:$bundle string \"$name\""
          done < "$IOS_SIGN_DIR/profiles.tsv"
          xcodebuild -exportArchive -archivePath "$IOS_SIGN_DIR/App.xcarchive" \
            -exportPath "$IOS_SIGN_DIR/export" -exportOptionsPlist "$opts"
          find "$IOS_SIGN_DIR/export" -maxdepth 1 -name '*.ipa' | grep -q .

      - name: Upload to TestFlight
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::bad App Store Connect key id"; exit 2; }
          [[ "$ASC_ISSUER_ID" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo "::error::bad App Store Connect issuer id"; exit 2; }
          # altool reads AuthKey_<KEYID>.p8 from this directory.
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$key_dir/AuthKey_$ASC_KEY_ID.p8"
          ipa="$(find "$IOS_SIGN_DIR/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          log="$IOS_SIGN_DIR/altool.log"
          # Xcode 26's altool has been reported to exit 0 on some failed uploads,
          # so the exit status AND the output are both checked.
          set +e
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          [ "$status" -eq 0 ] || { echo "::error::altool exited $status"; exit 1; }
          if grep -Eiq '(^|[^a-z])error[: ]|upload failed|UPLOAD FAILED' "$log"; then
            echo "::error::altool reported an error"; exit 1
          fi
          grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading' "$log" \
            || { echo "::error::altool printed no success marker"; exit 1; }

      - name: Cleanup (keychain, profiles, API key, temporary files)
        if: always()
        timeout-minutes: 5
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          dir="${IOS_SIGN_DIR:-}"
          keychain="${IOS_SIGN_KEYCHAIN:-}"
          if [ -n "$keychain" ] && [ -e "$keychain" ]; then
            if [ -s "$dir/keychains.list" ]; then
              mapfile -t saved < "$dir/keychains.list"
              security list-keychains -d user -s "${saved[@]}"
            fi
            security delete-keychain "$keychain"
          fi
          if [ -f "$dir/installed.list" ]; then
            while IFS= read -r f; do rm -f "$f"; done < "$dir/installed.list"
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] && rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          [ -z "$dir" ] || rm -rf "$dir"
