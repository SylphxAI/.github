name: iOS release

# Two modes, one upload. Build mode signs, archives and exports an iOS app; prebuilt
# mode (`ipa-artifact`) validates an .ipa an engine already built and signed.
# Either way it uploads to TestFlight on the internal
# macOS runner class ([self-hosted, macos, sylphx, standard]; docs/ios-release.md).
#
# Why a reusable workflow and not a composite action: the temporary keychain,
# the installed profiles and the API key must be removed by an `if: always()`
# step of the same job, and a composite action has no post step, so every
# caller would have to remember its own cleanup. One workflow keeps setup,
# build, upload and cleanup in one job, and it needs no action pin of its own.
#
# Trust boundary: every secret travels through the `env:` of the one step that
# needs it and is never echoed. Caller inputs never reach a shell body; they
# travel through `env:` and are validated against a strict pattern first.
# There are no `secrets:` on this workflow: the signing job names a GitHub
# environment (input `environment`, default ios-release) and reads the
# documented secret names from that environment of the caller's repository
# (docs/ios-release.md). The first job, `prepare`, has no environment and
# never sees a secret; it runs the caller's pre-build code.

on:
  workflow_call:
    inputs:
      ipa-artifact:
        description: >
          Prebuilt mode. Name of an artifact holding exactly one signed .ipa,
          uploaded by an earlier job of the caller's same run (which this job
          `needs:`). When set, checkout, keychain, archive and export are skipped.
        required: false
        type: string
        default: ''
      xcode-artifact:
        description: >
          Build mode only. Name of an artifact holding an exported Xcode
          project (for example Unity's export from Linux), uploaded by an
          earlier job of the caller's same run. Downloaded into the checkout
          at artifact-path before the build.
        required: false
        type: string
        default: ''
      artifact-path:
        description: Repo-relative directory the xcode-artifact is downloaded into.
        required: false
        type: string
        default: '.'
      pre-build-script:
        description: >
          Build mode only. Script path, relative to the artifact directory when
          xcode-artifact is set, else to the repository root. Run with bash
          before any signing secret is materialised, in a step with no signing
          secrets.
        required: false
        type: string
        default: ''
      post-archive-script:
        description: >
          Build mode only. Script path (same rules as pre-build-script) run
          with bash after archive and before export, in a step with no signing
          secrets. The temporary keychain exists at that point.
        required: false
        type: string
        default: ''
      xcode-version:
        description: >
          Build mode only. Xcode version to select (for example 26.3): the
          installed /Applications/Xcode*.app whose version equals it or starts
          with it followed by a dot. Empty keeps the runner default.
        required: false
        type: string
        default: ''
      override-team:
        description: >
          Build mode only. Also pass DEVELOPMENT_TEAM=APPLE_TEAM_ID to the
          archive (it applies to every target, which is safe when all targets
          share one team). Off: the project's own team setting stands.
        required: false
        type: boolean
        default: false
      scheme:
        description: Build mode only. Xcode scheme to archive.
        required: false
        type: string
        default: ''
      bundle-id:
        description: Bundle identifier of the app; selects the archive profile (build mode) or must equal the .ipa's CFBundleIdentifier (prebuilt mode).
        required: true
        type: string
      workspace:
        description: Path of the .xcworkspace, relative to the repository root. Set this or project.
        required: false
        type: string
        default: ''
      project:
        description: Path of the .xcodeproj, relative to the repository root. Used when workspace is empty.
        required: false
        type: string
        default: ''
      configuration:
        description: Build configuration.
        required: false
        type: string
        default: Release
      xcconfig:
        description: >
          Optional .xcconfig path in the repository, passed to xcodebuild archive
          (for per-target settings when the app has extensions).
        required: false
        type: string
        default: ''
      build-number:
        description: Optional CURRENT_PROJECT_VERSION override (for example the run number).
        required: false
        type: string
        default: ''
      environment:
        description: >
          GitHub environment of the signing job. The signing and App Store
          Connect secrets are read from it, in the caller's repository; restrict
          its deployment branches. Must not be empty.
        required: false
        type: string
        default: ios-release

permissions:
  contents: read

jobs:
  prepare:
    # No environment and no secret: this job runs the caller's own pre-build
    # code and hands the prepared workspace to the signing job.
    name: prepare
    runs-on: [self-hosted, macos, sylphx, standard]
    timeout-minutes: 90
    env:
      IN_ENVIRONMENT: ${{ inputs.environment }}
      IN_IPA_ARTIFACT: ${{ inputs.ipa-artifact }}
      IN_XCODE_ARTIFACT: ${{ inputs.xcode-artifact }}
      IN_ARTIFACT_PATH: ${{ inputs.artifact-path }}
      IN_PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
      IN_POST_ARCHIVE_SCRIPT: ${{ inputs.post-archive-script }}
      IN_XCODE_VERSION: ${{ inputs.xcode-version }}
      IN_OVERRIDE_TEAM: ${{ inputs.override-team }}
      IN_SCHEME: ${{ inputs.scheme }}
      IN_BUNDLE_ID: ${{ inputs.bundle-id }}
      IN_WORKSPACE: ${{ inputs.workspace }}
      IN_PROJECT: ${{ inputs.project }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_XCCONFIG: ${{ inputs.xcconfig }}
      IN_BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - name: Validate inputs
        timeout-minutes: 2
        run: |
          set -euo pipefail
          path_ok() {
            [[ "$1" =~ ^[A-Za-z0-9_./\ +-]{1,200}$ ]] || return 1
            case "$1" in /* | *..*) return 1 ;; esac
          }
          [[ "$IN_ENVIRONMENT" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::environment must be set (signing is environment-gated) and match [A-Za-z0-9._-]{1,64}"; exit 2; }
          [[ "$IN_IPA_ARTIFACT" =~ ^[A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad ipa-artifact"; exit 2; }
          if [ -z "$IN_IPA_ARTIFACT" ]; then
            [[ "$IN_SCHEME" =~ ^[A-Za-z0-9_.\ +-]{1,100}$ ]] || { echo "::error::build mode needs a valid scheme"; exit 2; }
          fi
          [[ "$IN_BUNDLE_ID" =~ ^[A-Za-z0-9.-]{1,155}$ ]] || { echo "::error::bad bundle-id"; exit 2; }
          [[ "$IN_CONFIGURATION" =~ ^[A-Za-z0-9_\ -]{1,50}$ ]] || { echo "::error::bad configuration"; exit 2; }
          [[ "$IN_BUILD_NUMBER" =~ ^[0-9]{0,9}$ ]] || { echo "::error::bad build-number"; exit 2; }
          [[ "$IN_XCODE_ARTIFACT" =~ ^[A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad xcode-artifact"; exit 2; }
          path_ok "$IN_ARTIFACT_PATH" || { echo "::error::bad artifact-path"; exit 2; }
          [[ "$IN_XCODE_VERSION" =~ ^([0-9]+(\.[0-9]+){0,2})?$ ]] || { echo "::error::bad xcode-version"; exit 2; }
          [ -z "$IN_POST_ARCHIVE_SCRIPT" ] || path_ok "$IN_POST_ARCHIVE_SCRIPT" || { echo "::error::bad post-archive-script"; exit 2; }
          [ -z "$IN_PRE_BUILD_SCRIPT" ] || path_ok "$IN_PRE_BUILD_SCRIPT" || { echo "::error::bad pre-build-script"; exit 2; }
          if [ -n "$IN_IPA_ARTIFACT" ] && { [ -n "$IN_XCODE_ARTIFACT" ] || [ -n "$IN_PRE_BUILD_SCRIPT" ] || [ -n "$IN_POST_ARCHIVE_SCRIPT" ] || [ -n "$IN_XCODE_VERSION" ]; }; then
            echo "::error::xcode-artifact, pre-build-script, post-archive-script and xcode-version are build-mode inputs; ipa-artifact is prebuilt mode"; exit 2
          fi
          if [ -z "$IN_IPA_ARTIFACT" ] && [ -z "$IN_WORKSPACE" ] && [ -z "$IN_PROJECT" ]; then
            echo "::error::set workspace or project"; exit 2
          fi
          for p in "$IN_WORKSPACE" "$IN_PROJECT" "$IN_XCCONFIG"; do
            [ -z "$p" ] || path_ok "$p" || { echo "::error::bad path input"; exit 2; }
          done

      - name: Checkout
        if: inputs.ipa-artifact == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Select Xcode version
        if: inputs.ipa-artifact == '' && inputs.xcode-version != ''
        timeout-minutes: 2
        run: |
          set -euo pipefail
          installed=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v="$(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
            installed="$installed $v"
            if [ "$v" = "$IN_XCODE_VERSION" ] || [[ "$v" == "$IN_XCODE_VERSION".* ]]; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              echo "selected Xcode $v ($app)"
              exit 0
            fi
          done
          echo "::error::Xcode $IN_XCODE_VERSION is not installed; installed:${installed:- none}"
          exit 1

      - name: Download Xcode project artifact
        if: inputs.ipa-artifact == '' && inputs.xcode-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 10
        with:
          name: ${{ inputs.xcode-artifact }}
          path: ${{ inputs.artifact-path }}

      - name: Pre-build script (no signing secrets)
        if: inputs.ipa-artifact == '' && inputs.pre-build-script != ''
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ -n "$IN_XCODE_ARTIFACT" ]; then workdir="$GITHUB_WORKSPACE/$IN_ARTIFACT_PATH"; else workdir="$GITHUB_WORKSPACE"; fi
          root="$(cd "$workdir" && pwd -P)"
          [ -f "$root/$IN_PRE_BUILD_SCRIPT" ] || { echo "::error::pre-build-script not found"; exit 1; }
          script_dir="$(cd "$(dirname "$root/$IN_PRE_BUILD_SCRIPT")" && pwd -P)"
          case "$script_dir/" in "$root"/*) ;; *) echo "::error::pre-build-script resolves outside its directory"; exit 1 ;; esac
          cd "$root"
          # The script cannot append to the runner's command files through the
          # environment of this step.
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_STEP_SUMMARY \
            bash -- "$IN_PRE_BUILD_SCRIPT"

      - name: Pack prepared workspace
        if: inputs.ipa-artifact == ''
        timeout-minutes: 15
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" --exclude=./.git -cf "$RUNNER_TEMP/ios-workspace.tar" .

      - name: Upload prepared workspace
        if: inputs.ipa-artifact == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 15
        with:
          name: ios-workspace-${{ inputs.bundle-id }}
          path: ${{ runner.temp }}/ios-workspace.tar
          retention-days: 1
          if-no-files-found: error


  sign:
    # Holds only the signing secrets. Caller code (Run Script phases, package
    # plugins, the post-archive script) runs here, so this job never sees an
    # App Store Connect secret; the exported .ipa goes to the `upload` job.
    name: sign and export
    if: inputs.ipa-artifact == ''
    needs: prepare
    runs-on: [self-hosted, macos, sylphx, standard]
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      IN_ENVIRONMENT: ${{ inputs.environment }}
      IN_IPA_ARTIFACT: ${{ inputs.ipa-artifact }}
      IN_XCODE_ARTIFACT: ${{ inputs.xcode-artifact }}
      IN_ARTIFACT_PATH: ${{ inputs.artifact-path }}
      IN_PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
      IN_POST_ARCHIVE_SCRIPT: ${{ inputs.post-archive-script }}
      IN_XCODE_VERSION: ${{ inputs.xcode-version }}
      IN_OVERRIDE_TEAM: ${{ inputs.override-team }}
      IN_SCHEME: ${{ inputs.scheme }}
      IN_BUNDLE_ID: ${{ inputs.bundle-id }}
      IN_WORKSPACE: ${{ inputs.workspace }}
      IN_PROJECT: ${{ inputs.project }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_XCCONFIG: ${{ inputs.xcconfig }}
      IN_BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - name: Validate inputs
        timeout-minutes: 2
        run: |
          set -euo pipefail
          path_ok() {
            [[ "$1" =~ ^[A-Za-z0-9_./\ +-]{1,200}$ ]] || return 1
            case "$1" in /* | *..*) return 1 ;; esac
          }
          [[ "$IN_ENVIRONMENT" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::environment must be set (signing is environment-gated) and match [A-Za-z0-9._-]{1,64}"; exit 2; }
          [[ "$IN_IPA_ARTIFACT" =~ ^[A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad ipa-artifact"; exit 2; }
          if [ -z "$IN_IPA_ARTIFACT" ]; then
            [[ "$IN_SCHEME" =~ ^[A-Za-z0-9_.\ +-]{1,100}$ ]] || { echo "::error::build mode needs a valid scheme"; exit 2; }
          fi
          [[ "$IN_BUNDLE_ID" =~ ^[A-Za-z0-9.-]{1,155}$ ]] || { echo "::error::bad bundle-id"; exit 2; }
          [[ "$IN_CONFIGURATION" =~ ^[A-Za-z0-9_\ -]{1,50}$ ]] || { echo "::error::bad configuration"; exit 2; }
          [[ "$IN_BUILD_NUMBER" =~ ^[0-9]{0,9}$ ]] || { echo "::error::bad build-number"; exit 2; }
          [[ "$IN_XCODE_ARTIFACT" =~ ^[A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad xcode-artifact"; exit 2; }
          path_ok "$IN_ARTIFACT_PATH" || { echo "::error::bad artifact-path"; exit 2; }
          [[ "$IN_XCODE_VERSION" =~ ^([0-9]+(\.[0-9]+){0,2})?$ ]] || { echo "::error::bad xcode-version"; exit 2; }
          [ -z "$IN_POST_ARCHIVE_SCRIPT" ] || path_ok "$IN_POST_ARCHIVE_SCRIPT" || { echo "::error::bad post-archive-script"; exit 2; }
          [ -z "$IN_PRE_BUILD_SCRIPT" ] || path_ok "$IN_PRE_BUILD_SCRIPT" || { echo "::error::bad pre-build-script"; exit 2; }
          if [ -n "$IN_IPA_ARTIFACT" ] && { [ -n "$IN_XCODE_ARTIFACT" ] || [ -n "$IN_PRE_BUILD_SCRIPT" ] || [ -n "$IN_POST_ARCHIVE_SCRIPT" ] || [ -n "$IN_XCODE_VERSION" ]; }; then
            echo "::error::xcode-artifact, pre-build-script, post-archive-script and xcode-version are build-mode inputs; ipa-artifact is prebuilt mode"; exit 2
          fi
          if [ -z "$IN_IPA_ARTIFACT" ] && [ -z "$IN_WORKSPACE" ] && [ -z "$IN_PROJECT" ]; then
            echo "::error::set workspace or project"; exit 2
          fi
          for p in "$IN_WORKSPACE" "$IN_PROJECT" "$IN_XCCONFIG"; do
            [ -z "$p" ] || path_ok "$p" || { echo "::error::bad path input"; exit 2; }
          done
          echo "IOS_SIGN_DIR=$RUNNER_TEMP/ios-signing" >> "$GITHUB_ENV"
          # Process guard (see docs/ios-release.md, Trust model). Written here,
          # before any caller code runs; its hash is checked before every use.
          sign_dir="$RUNNER_TEMP/ios-signing"
          mkdir -p "$sign_dir"
          cat > "$sign_dir/guard.sh" <<'GUARD'
          #!/bin/bash
          # guard.sh baseline | kill | check
          set -uo pipefail
          # Refuse to touch any process unless this is a single-use CI runner.
          # Runs before anything else; sends no signal and lists nothing.
          preflight() {
            local host
            host="$(hostname 2> /dev/null)"
            if [ "${GITHUB_ACTIONS:-}" != true ] \
              || [ -z "${RUNNER_ENVIRONMENT:-}" ] \
              || ! [[ "${RUNNER_NAME:-}" =~ ^runner-[0-9a-f]{12}$ ]] \
              || [[ "$host" =~ ^(desk-0|kyle-desk) ]] \
              || [ "${HOME:-}" = /home/kyle ] || [ "${USER:-}" = kyle ]; then
              echo "refusing: not a single-use CI runner"
              return 1
            fi
          }
          # Owned by this user, not an ancestor of, or descended from, this
          # shell: "pid<TAB>start time<TAB>command".
          snap() {
            ps -axo pid=,ppid=,uid=,lstart=,comm= | awk -v me="$me" -v self="$$" '
              { pid=$1; P[pid]=$2; U[pid]=$3; L[pid]=$4" "$5" "$6" "$7" "$8
                c=""; for (i=9; i<=NF; i++) c = c (i>9 ? " " : "") $i; C[pid]=c }
              END {
                q=self; n=0; while (q>1 && n<64) { A[q]=1; q=P[q]; n++ }
                for (p in P) {
                  if (U[p]!=me || (p in A)) continue
                  q=p; n=0; kid=0
                  while (q>1 && n<64) { if (q==self) { kid=1; break } q=P[q]; n++ }
                  if (!kid) print p "\t" L[p] "\t" C[p]
                }
              }' | sort
          }
          # Explicit, conservative exclusions: the runner's own processes and
          # Apple system and Xcode helper daemons that a build starts and keeps.
          allowed() {
            local base="${1##*/}"
            case "$1" in /System/* | /usr/libexec/* | /usr/sbin/* | /Library/Apple/*) return 0 ;; esac
            case "$base" in
              Runner.* | XCBBuildService | xcodebuild | xcrun | com.apple.dt.* | ibtoold | IBAgent* | mdworker* | distnoted | cfprefsd) return 0 ;;
            esac
            return 1
          }
          leftovers() {
            snap | while IFS=$'\t' read -r pid started comm; do
              grep -qxF "$pid"$'\t'"$started"$'\t'"$comm" "$dir/procs.base" && continue
              allowed "$comm" && continue
              printf '%s\t%s\t%s\n' "$pid" "$started" "$comm"
            done
          }
          main() {
          mode="$1"
          dir="$IOS_SIGN_DIR"
          me="$(id -u)"
          case "$mode" in
            baseline) snap > "$dir/procs.base" ;;
            check)
              left="$(leftovers)"
              if [ -n "$left" ]; then
                echo "::error::unexpected processes are running from an earlier step:"; echo "$left"; exit 1
              fi
              echo "process check: no unexpected processes" ;;
            kill)
              left="$(leftovers)"
              [ -z "$left" ] && { echo "process guard: no leftovers"; exit 0; }
              echo "process guard: leftovers from an earlier step, sending TERM:"; echo "$left"
              echo "$left" | cut -f1 | xargs kill -TERM 2> /dev/null
              sleep 5
              left="$(leftovers)"
              [ -z "$left" ] && exit 0
              echo "still running after TERM, sending KILL:"; echo "$left"
              echo "$left" | cut -f1 | xargs kill -KILL 2> /dev/null
              sleep 1
              left="$(leftovers)"
              if [ -n "$left" ]; then
                echo "::error::processes survived KILL:"; echo "$left"; exit 1
              fi ;;
            *) echo "bad mode"; exit 2 ;;
          esac
          }
          if [ "${BASH_SOURCE[0]}" = "$0" ]; then
            preflight || exit 1
            main "$1"
          fi
          GUARD
          chmod 500 "$sign_dir/guard.sh"
          echo "IOS_GUARD_SHA=$(shasum -a 256 "$sign_dir/guard.sh" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          IOS_SIGN_DIR="$sign_dir" bash "$sign_dir/guard.sh" baseline

      - name: Require secrets
        timeout-minutes: 2
        env:
          HAVE_IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 != '' }}
          HAVE_IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD != '' }}
          HAVE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAVE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          required=(IOS_DIST_CERTIFICATE_BASE64 IOS_DIST_CERTIFICATE_PASSWORD APPLE_TEAM_ID IOS_PROVISIONING_PROFILE_BASE64)
          for name in "${required[@]}"; do
            var="HAVE_$name"
            [ "${!var}" = true ] || { echo "::error::secret $name is empty or missing in the '$IN_ENVIRONMENT' environment of this repository"; exit 1; }
          done

      - name: Select Xcode version
        if: inputs.ipa-artifact == '' && inputs.xcode-version != ''
        timeout-minutes: 2
        run: |
          set -euo pipefail
          installed=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v="$(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
            installed="$installed $v"
            if [ "$v" = "$IN_XCODE_VERSION" ] || [[ "$v" == "$IN_XCODE_VERSION".* ]]; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              echo "selected Xcode $v ($app)"
              exit 0
            fi
          done
          echo "::error::Xcode $IN_XCODE_VERSION is not installed; installed:${installed:- none}"
          exit 1

      - name: Download prepared workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 15
        with:
          name: ios-workspace-${{ inputs.bundle-id }}
          path: ${{ runner.temp }}/ios-signing/workspace-dl

      - name: Unpack prepared workspace
        timeout-minutes: 10
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -xf "$IOS_SIGN_DIR/workspace-dl/ios-workspace.tar"
          rm -rf "$IOS_SIGN_DIR/workspace-dl"

      - name: Signing setup (temporary keychain, certificate, profiles)
        timeout-minutes: 10
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$IOS_SIGN_DIR"
          keychain="$IOS_SIGN_DIR/build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db"
          # Recorded before anything is created, so the cleanup step finds it
          # even when this step fails half way.
          {
            echo "IOS_SIGN_KEYCHAIN=$keychain"
            echo "IOS_SIGN_DIR=$IOS_SIGN_DIR"
          } >> "$GITHUB_ENV"

          kc_password="$(openssl rand -hex 24)"
          echo "::add-mask::$kc_password"

          # Keep the existing user search list; cleanup restores it.
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$IOS_SIGN_DIR/keychains.list"

          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          mapfile -t existing < "$IOS_SIGN_DIR/keychains.list"
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          printf '%s' "$CERT_BASE64" | base64 --decode > "$IOS_SIGN_DIR/dist.p12"
          chmod 600 "$IOS_SIGN_DIR/dist.p12"
          security import "$IOS_SIGN_DIR/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S codesign: -s -k "$kc_password" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution" \
            || { echo "::error::no Apple Distribution identity in the imported certificate"; exit 1; }
          rm -f "$IOS_SIGN_DIR/dist.p12"

          # Provisioning profiles: one base64 blob per line.
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          : > "$IOS_SIGN_DIR/installed.list"
          : > "$IOS_SIGN_DIR/profiles.tsv"
          n=0
          while IFS= read -r line; do
            line="${line//[[:space:]]/}"
            [ -n "$line" ] || continue
            n=$((n + 1))
            raw="$IOS_SIGN_DIR/profile-$n.mobileprovision"
            plist="$IOS_SIGN_DIR/profile-$n.plist"
            printf '%s' "$line" | base64 --decode > "$raw"
            security cms -D -i "$raw" > "$plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            [[ "$uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo "::error::profile $n has no valid UUID"; exit 1; }
            [[ "$name" =~ ^[^\"\\]{1,200}$ ]] || { echo "::error::profile $n has an unsupported name"; exit 1; }
            bundle="${appid#*.}"
            cp "$raw" "$profiles_dir/$uuid.mobileprovision"
            chmod 600 "$profiles_dir/$uuid.mobileprovision"
            echo "$profiles_dir/$uuid.mobileprovision" >> "$IOS_SIGN_DIR/installed.list"
            printf '%s\t%s\n' "$bundle" "$name" >> "$IOS_SIGN_DIR/profiles.tsv"
            rm -f "$raw" "$plist"
          done <<< "$PROFILES_BASE64"
          [ "$n" -gt 0 ] || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 holds no profile"; exit 1; }
          echo "installed $n provisioning profile(s)"

      - name: Archive
        timeout-minutes: 60
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID is not a 10-character team id"; exit 2; }
          awk -F'\t' -v b="$IN_BUNDLE_ID" '$1 == b { found = 1 } END { exit !found }' "$IOS_SIGN_DIR/profiles.tsv" \
            || { echo "::error::no installed profile matches bundle-id $IN_BUNDLE_ID"; exit 1; }
          if [ -n "$IN_WORKSPACE" ]; then target=(-workspace "$IN_WORKSPACE"); else target=(-project "$IN_PROJECT"); fi
          # No command-line CODE_SIGN_IDENTITY or PROVISIONING_PROFILE_SPECIFIER:
          # those apply to every target (Pods, frameworks, extensions). The
          # project's own settings sign the archive; export re-signs for
          # distribution (docs/ios-release.md, Signing).
          args=("${target[@]}" -scheme "$IN_SCHEME" -configuration "$IN_CONFIGURATION"
            -destination 'generic/platform=iOS' -archivePath "$IOS_SIGN_DIR/App.xcarchive"
            "OTHER_CODE_SIGN_FLAGS=--keychain $IOS_SIGN_KEYCHAIN")
          [ "$IN_OVERRIDE_TEAM" != true ] || args+=("DEVELOPMENT_TEAM=$TEAM_ID")
          [ -z "$IN_XCCONFIG" ] || args+=(-xcconfig "$IN_XCCONFIG")
          [ -z "$IN_BUILD_NUMBER" ] || args+=("CURRENT_PROJECT_VERSION=$IN_BUILD_NUMBER")
          xcodebuild archive "${args[@]}"

      - name: Process guard after archive
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "$IOS_GUARD_SHA  $IOS_SIGN_DIR/guard.sh" | shasum -a 256 -c - > /dev/null
          bash "$IOS_SIGN_DIR/guard.sh" kill

      - name: Post-archive script (no signing secrets)
        if: inputs.ipa-artifact == '' && inputs.post-archive-script != ''
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ -n "$IN_XCODE_ARTIFACT" ]; then workdir="$GITHUB_WORKSPACE/$IN_ARTIFACT_PATH"; else workdir="$GITHUB_WORKSPACE"; fi
          root="$(cd "$workdir" && pwd -P)"
          [ -f "$root/$IN_POST_ARCHIVE_SCRIPT" ] || { echo "::error::post-archive-script not found"; exit 1; }
          script_dir="$(cd "$(dirname "$root/$IN_POST_ARCHIVE_SCRIPT")" && pwd -P)"
          case "$script_dir/" in "$root"/*) ;; *) echo "::error::post-archive-script resolves outside its directory"; exit 1 ;; esac
          cd "$root"
          # The script cannot append to the runner's command files through the
          # environment of this step.
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_STEP_SUMMARY \
            bash -- "$IN_POST_ARCHIVE_SCRIPT"

      - name: Process guard after post-archive script
        if: inputs.ipa-artifact == '' && inputs.post-archive-script != ''
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "$IOS_GUARD_SHA  $IOS_SIGN_DIR/guard.sh" | shasum -a 256 -c - > /dev/null
          bash "$IOS_SIGN_DIR/guard.sh" kill

      - name: Export
        timeout-minutes: 20
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          opts="$IOS_SIGN_DIR/ExportOptions.plist"
          rm -f "$opts"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$opts"; }
          pb "Add :method string app-store-connect"
          pb "Add :signingStyle string manual"
          pb "Add :signingCertificate string Apple Distribution"
          pb "Add :teamID string $TEAM_ID"
          pb "Add :destination string export"
          pb "Add :uploadSymbols bool true"
          pb "Add :provisioningProfiles dict"
          while IFS=$'\t' read -r bundle name; do
            pb "Add :provisioningProfiles:$bundle string \"$name\""
          done < "$IOS_SIGN_DIR/profiles.tsv"
          xcodebuild -exportArchive -archivePath "$IOS_SIGN_DIR/App.xcarchive" \
            -exportPath "$IOS_SIGN_DIR/export" -exportOptionsPlist "$opts"
          find "$IOS_SIGN_DIR/export" -maxdepth 1 -name '*.ipa' | grep -q .

      - name: Process guard after export
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "$IOS_GUARD_SHA  $IOS_SIGN_DIR/guard.sh" | shasum -a 256 -c - > /dev/null
          bash "$IOS_SIGN_DIR/guard.sh" kill

      - name: Upload exported .ipa
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa-${{ inputs.bundle-id }}
          path: ${{ runner.temp }}/ios-signing/export/*.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup (keychain, profiles, API key, temporary files)
        if: always()
        timeout-minutes: 5
        run: |
          # Best effort per item: every removal runs even when another fails;
          # failures are collected and fail the step at the end.
          dir="${IOS_SIGN_DIR:-}"
          keychain="${IOS_SIGN_KEYCHAIN:-}"
          failed=0
          fail() { echo "::warning::cleanup failed: $1"; failed=1; }
          if [ -n "$keychain" ] && [ -e "$keychain" ]; then
            if [ -s "$dir/keychains.list" ]; then
              mapfile -t saved < "$dir/keychains.list"
              security list-keychains -d user -s "${saved[@]}" || fail "restore keychain search list"
            fi
            security delete-keychain "$keychain" || fail "delete keychain"
          fi
          if [ -f "$dir/installed.list" ]; then
            while IFS= read -r f; do rm -f "$f" || fail "remove profile"; done < "$dir/installed.list"
          fi
          [ -z "$dir" ] || rm -rf "$dir/private_keys" || fail "remove API key"
          [ -z "$dir" ] || rm -rf "$dir" || fail "remove temporary files"
          exit "$failed"

  upload:
    # The only job with the App Store Connect secrets. A fresh machine: no
    # command-file state and no process from the signing job. It validates the
    # .ipa again before the key is written.
    name: validate and upload
    needs: [prepare, sign]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.sign.result == 'success' || (inputs.ipa-artifact != '' && needs.sign.result == 'skipped')) }}
    runs-on: [self-hosted, macos, sylphx, standard]
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      IN_ENVIRONMENT: ${{ inputs.environment }}
      IN_IPA_ARTIFACT: ${{ inputs.ipa-artifact }}
      IN_XCODE_ARTIFACT: ${{ inputs.xcode-artifact }}
      IN_ARTIFACT_PATH: ${{ inputs.artifact-path }}
      IN_PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
      IN_POST_ARCHIVE_SCRIPT: ${{ inputs.post-archive-script }}
      IN_XCODE_VERSION: ${{ inputs.xcode-version }}
      IN_OVERRIDE_TEAM: ${{ inputs.override-team }}
      IN_SCHEME: ${{ inputs.scheme }}
      IN_BUNDLE_ID: ${{ inputs.bundle-id }}
      IN_WORKSPACE: ${{ inputs.workspace }}
      IN_PROJECT: ${{ inputs.project }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_XCCONFIG: ${{ inputs.xcconfig }}
      IN_BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - name: Validate inputs
        timeout-minutes: 2
        run: |
          set -euo pipefail
          path_ok() {
            [[ "$1" =~ ^[A-Za-z0-9_./\ +-]{1,200}$ ]] || return 1
            case "$1" in /* | *..*) return 1 ;; esac
          }
          [[ "$IN_ENVIRONMENT" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::environment must be set (signing is environment-gated) and match [A-Za-z0-9._-]{1,64}"; exit 2; }
          [[ "$IN_IPA_ARTIFACT" =~ ^[A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad ipa-artifact"; exit 2; }
          if [ -z "$IN_IPA_ARTIFACT" ]; then
            [[ "$IN_SCHEME" =~ ^[A-Za-z0-9_.\ +-]{1,100}$ ]] || { echo "::error::build mode needs a valid scheme"; exit 2; }
          fi
          [[ "$IN_BUNDLE_ID" =~ ^[A-Za-z0-9.-]{1,155}$ ]] || { echo "::error::bad bundle-id"; exit 2; }
          [[ "$IN_CONFIGURATION" =~ ^[A-Za-z0-9_\ -]{1,50}$ ]] || { echo "::error::bad configuration"; exit 2; }
          [[ "$IN_BUILD_NUMBER" =~ ^[0-9]{0,9}$ ]] || { echo "::error::bad build-number"; exit 2; }
          [[ "$IN_XCODE_ARTIFACT" =~ ^[A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad xcode-artifact"; exit 2; }
          path_ok "$IN_ARTIFACT_PATH" || { echo "::error::bad artifact-path"; exit 2; }
          [[ "$IN_XCODE_VERSION" =~ ^([0-9]+(\.[0-9]+){0,2})?$ ]] || { echo "::error::bad xcode-version"; exit 2; }
          [ -z "$IN_POST_ARCHIVE_SCRIPT" ] || path_ok "$IN_POST_ARCHIVE_SCRIPT" || { echo "::error::bad post-archive-script"; exit 2; }
          [ -z "$IN_PRE_BUILD_SCRIPT" ] || path_ok "$IN_PRE_BUILD_SCRIPT" || { echo "::error::bad pre-build-script"; exit 2; }
          if [ -n "$IN_IPA_ARTIFACT" ] && { [ -n "$IN_XCODE_ARTIFACT" ] || [ -n "$IN_PRE_BUILD_SCRIPT" ] || [ -n "$IN_POST_ARCHIVE_SCRIPT" ] || [ -n "$IN_XCODE_VERSION" ]; }; then
            echo "::error::xcode-artifact, pre-build-script, post-archive-script and xcode-version are build-mode inputs; ipa-artifact is prebuilt mode"; exit 2
          fi
          if [ -z "$IN_IPA_ARTIFACT" ] && [ -z "$IN_WORKSPACE" ] && [ -z "$IN_PROJECT" ]; then
            echo "::error::set workspace or project"; exit 2
          fi
          for p in "$IN_WORKSPACE" "$IN_PROJECT" "$IN_XCCONFIG"; do
            [ -z "$p" ] || path_ok "$p" || { echo "::error::bad path input"; exit 2; }
          done
          echo "IOS_SIGN_DIR=$RUNNER_TEMP/ios-signing" >> "$GITHUB_ENV"
          # Process guard (see docs/ios-release.md, Trust model). Written here,
          # before any caller code runs; its hash is checked before every use.
          sign_dir="$RUNNER_TEMP/ios-signing"
          mkdir -p "$sign_dir"
          cat > "$sign_dir/guard.sh" <<'GUARD'
          #!/bin/bash
          # guard.sh baseline | kill | check
          set -uo pipefail
          # Refuse to touch any process unless this is a single-use CI runner.
          # Runs before anything else; sends no signal and lists nothing.
          preflight() {
            local host
            host="$(hostname 2> /dev/null)"
            if [ "${GITHUB_ACTIONS:-}" != true ] \
              || [ -z "${RUNNER_ENVIRONMENT:-}" ] \
              || ! [[ "${RUNNER_NAME:-}" =~ ^runner-[0-9a-f]{12}$ ]] \
              || [[ "$host" =~ ^(desk-0|kyle-desk) ]] \
              || [ "${HOME:-}" = /home/kyle ] || [ "${USER:-}" = kyle ]; then
              echo "refusing: not a single-use CI runner"
              return 1
            fi
          }
          # Owned by this user, not an ancestor of, or descended from, this
          # shell: "pid<TAB>start time<TAB>command".
          snap() {
            ps -axo pid=,ppid=,uid=,lstart=,comm= | awk -v me="$me" -v self="$$" '
              { pid=$1; P[pid]=$2; U[pid]=$3; L[pid]=$4" "$5" "$6" "$7" "$8
                c=""; for (i=9; i<=NF; i++) c = c (i>9 ? " " : "") $i; C[pid]=c }
              END {
                q=self; n=0; while (q>1 && n<64) { A[q]=1; q=P[q]; n++ }
                for (p in P) {
                  if (U[p]!=me || (p in A)) continue
                  q=p; n=0; kid=0
                  while (q>1 && n<64) { if (q==self) { kid=1; break } q=P[q]; n++ }
                  if (!kid) print p "\t" L[p] "\t" C[p]
                }
              }' | sort
          }
          # Explicit, conservative exclusions: the runner's own processes and
          # Apple system and Xcode helper daemons that a build starts and keeps.
          allowed() {
            local base="${1##*/}"
            case "$1" in /System/* | /usr/libexec/* | /usr/sbin/* | /Library/Apple/*) return 0 ;; esac
            case "$base" in
              Runner.* | XCBBuildService | xcodebuild | xcrun | com.apple.dt.* | ibtoold | IBAgent* | mdworker* | distnoted | cfprefsd) return 0 ;;
            esac
            return 1
          }
          leftovers() {
            snap | while IFS=$'\t' read -r pid started comm; do
              grep -qxF "$pid"$'\t'"$started"$'\t'"$comm" "$dir/procs.base" && continue
              allowed "$comm" && continue
              printf '%s\t%s\t%s\n' "$pid" "$started" "$comm"
            done
          }
          main() {
          mode="$1"
          dir="$IOS_SIGN_DIR"
          me="$(id -u)"
          case "$mode" in
            baseline) snap > "$dir/procs.base" ;;
            check)
              left="$(leftovers)"
              if [ -n "$left" ]; then
                echo "::error::unexpected processes are running from an earlier step:"; echo "$left"; exit 1
              fi
              echo "process check: no unexpected processes" ;;
            kill)
              left="$(leftovers)"
              [ -z "$left" ] && { echo "process guard: no leftovers"; exit 0; }
              echo "process guard: leftovers from an earlier step, sending TERM:"; echo "$left"
              echo "$left" | cut -f1 | xargs kill -TERM 2> /dev/null
              sleep 5
              left="$(leftovers)"
              [ -z "$left" ] && exit 0
              echo "still running after TERM, sending KILL:"; echo "$left"
              echo "$left" | cut -f1 | xargs kill -KILL 2> /dev/null
              sleep 1
              left="$(leftovers)"
              if [ -n "$left" ]; then
                echo "::error::processes survived KILL:"; echo "$left"; exit 1
              fi ;;
            *) echo "bad mode"; exit 2 ;;
          esac
          }
          if [ "${BASH_SOURCE[0]}" = "$0" ]; then
            preflight || exit 1
            main "$1"
          fi
          GUARD
          chmod 500 "$sign_dir/guard.sh"
          echo "IOS_GUARD_SHA=$(shasum -a 256 "$sign_dir/guard.sh" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          IOS_SIGN_DIR="$sign_dir" bash "$sign_dir/guard.sh" baseline

      - name: Require secrets
        timeout-minutes: 2
        env:
          HAVE_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAVE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAVE_APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 != '' }}
        run: |
          set -euo pipefail
          required=(APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64)
          for name in "${required[@]}"; do
            var="HAVE_$name"
            [ "${!var}" = true ] || { echo "::error::secret $name is empty or missing in the '$IN_ENVIRONMENT' environment of this repository"; exit 1; }
          done

      - name: Download .ipa
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 10
        with:
          name: ${{ inputs.ipa-artifact != '' && inputs.ipa-artifact || format('ios-ipa-{0}', inputs.bundle-id) }}
          path: ${{ runner.temp }}/ios-signing/export

      - name: Validate .ipa before upload
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          # Fail closed: every check must pass before anything is uploaded.
          export_dir="$IOS_SIGN_DIR/export"
          [ "$(find "$export_dir" -name '*.ipa' | wc -l | tr -d ' ')" = 1 ] \
            || { echo "::error::the artifact must hold exactly one .ipa"; exit 1; }
          ipa="$(find "$export_dir" -name '*.ipa')"
          unpack="$IOS_SIGN_DIR/unpack"
          rm -rf "$unpack"; mkdir -p "$unpack"
          unzip -q "$ipa" -d "$unpack"
          [ "$(find "$unpack/Payload" -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')" = 1 ] \
            || { echo "::error::Payload must hold exactly one .app"; exit 1; }
          app="$(find "$unpack/Payload" -maxdepth 1 -name '*.app')"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$2"; }
          # (a) bundle id
          bundle="$(pb 'Print :CFBundleIdentifier' "$app/Info.plist")"
          [ "$bundle" = "$IN_BUNDLE_ID" ] \
            || { echo "::error::CFBundleIdentifier is $bundle, expected $IN_BUNDLE_ID"; exit 1; }
          # (b) signature
          codesign -dv --verbose=4 "$app" 2> "$unpack/codesign.txt"
          grep -q '^Authority=Apple Distribution:' "$unpack/codesign.txt" \
            || { echo "::error::not signed by an Apple Distribution identity"; exit 1; }
          codesign --verify --deep --strict "$app"
          # (c) App Store profile with beta reports
          profile="$unpack/embedded.plist"
          security cms -D -i "$app/embedded.mobileprovision" > "$profile"
          [ "$(pb 'Print :Entitlements:beta-reports-active' "$profile")" = true ] \
            || { echo "::error::profile lacks beta-reports-active"; exit 1; }
          if pb 'Print :ProvisionedDevices' "$profile" > /dev/null 2>&1; then
            echo "::error::profile lists devices, so it is not an App Store profile"; exit 1
          fi
          appid="$(pb 'Print :Entitlements:application-identifier' "$profile")"
          case "$appid" in *".$IN_BUNDLE_ID") ;; *) echo "::error::profile application-identifier does not end in the bundle id"; exit 1 ;; esac
          # (d) version
          version="$(pb 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(pb 'Print :CFBundleVersion' "$app/Info.plist")"
          echo "prebuilt .ipa: $bundle version $version build $build"
          {
            echo "### Prebuilt .ipa validated"
            echo "- bundle id: \`$bundle\`"
            echo "- version: $version, build: $build"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$unpack"

      - name: Process check before upload
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "$IOS_GUARD_SHA  $IOS_SIGN_DIR/guard.sh" | shasum -a 256 -c - > /dev/null
          bash "$IOS_SIGN_DIR/guard.sh" check

      - name: Upload to TestFlight
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          # Before the key exists: fail if anything from an earlier step is alive.
          echo "$IOS_GUARD_SHA  $IOS_SIGN_DIR/guard.sh" | shasum -a 256 -c - > /dev/null
          bash "$IOS_SIGN_DIR/guard.sh" check
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::bad App Store Connect key id"; exit 2; }
          [[ "$ASC_ISSUER_ID" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo "::error::bad App Store Connect issuer id"; exit 2; }
          # altool reads AuthKey_<KEYID>.p8 from API_PRIVATE_KEYS_DIR.
          key_dir="$IOS_SIGN_DIR/private_keys"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$key_dir/AuthKey_$ASC_KEY_ID.p8"
          [ "$(find "$IOS_SIGN_DIR/export" -name '*.ipa' | wc -l | tr -d ' ')" = 1 ] \
            || { echo "::error::expected exactly one .ipa to upload"; exit 1; }
          ipa="$(find "$IOS_SIGN_DIR/export" -name '*.ipa')"
          log="$IOS_SIGN_DIR/altool.log"
          # Xcode 26's altool has been reported to exit 0 on some failed uploads,
          # so the exit status AND the output are both checked.
          set +e
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          [ "$status" -eq 0 ] || { echo "::error::altool exited $status"; exit 1; }
          if grep -Eiq '(^|[^a-z])error[: ]|upload failed|UPLOAD FAILED' "$log"; then
            echo "::error::altool reported an error"; exit 1
          fi
          grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading' "$log" \
            || { echo "::error::altool printed no success marker"; exit 1; }

      - name: Cleanup (keychain, profiles, API key, temporary files)
        if: always()
        timeout-minutes: 5
        run: |
          # Best effort per item: every removal runs even when another fails;
          # failures are collected and fail the step at the end.
          dir="${IOS_SIGN_DIR:-}"
          keychain="${IOS_SIGN_KEYCHAIN:-}"
          failed=0
          fail() { echo "::warning::cleanup failed: $1"; failed=1; }
          if [ -n "$keychain" ] && [ -e "$keychain" ]; then
            if [ -s "$dir/keychains.list" ]; then
              mapfile -t saved < "$dir/keychains.list"
              security list-keychains -d user -s "${saved[@]}" || fail "restore keychain search list"
            fi
            security delete-keychain "$keychain" || fail "delete keychain"
          fi
          if [ -f "$dir/installed.list" ]; then
            while IFS= read -r f; do rm -f "$f" || fail "remove profile"; done < "$dir/installed.list"
          fi
          [ -z "$dir" ] || rm -rf "$dir/private_keys" || fail "remove API key"
          [ -z "$dir" ] || rm -rf "$dir" || fail "remove temporary files"
          exit "$failed"
