name: Red main

# The red-main handler for optimistic merge (owner#809). A caller runs it when
# its verify workflow failed on the trunk after the change had already landed.
#
# What it does, in order:
#
#   1. classifies the failure from the run's job and step data: a lost runner,
#      a cancel by the system or another infrastructure failure is reported
#      and never reverted;
#   2. a real failure: it traces the culprit among the commits the verify run
#      had not covered yet - every candidate is verified at once, on its own
#      temporary branch, under one shared deadline - then opens one revert pull
#      request for it, and in
#      revert mode takes the merge-queue jump that the runbook sanctions when
#      `main` is red and blocks the queue - one jump in 30 minutes per
#      repository, recorded on the pull request it jumps.
#
# Self-heal rules: only COMPLETED verify runs count (cancelled and skipped are
# ignored); a real failure reverts only after the SAME failing unit (job and
# test) failed on two consecutive completed runs, at the first-bad commit; and
# a run whose every failing step's TERMINAL ERROR is an infrastructure
# signature (installation token mint, artifact upload, cache 403, runner set-up
# or checkout, a lost runner) is never reverted. Classification is per failing
# step, never per job: a real assertion is a code fault even when the same job
# also logged infrastructure-shaped noise (ENOSPC, a cache warning), which is
# how a genuine failure once hid behind it for three days. An infrastructure
# verdict escalates visibly: it opens one issue labelled `red-main-infra` and
# the owner label and comments on the ops issue, so it is never a silent
# `exit 0`. Nothing is ever rerun: a flaky test is quarantined through the
# repository's quarantine list, not retried. When the handler itself fails, it
# opens (or comments on) one issue labelled `red-main-broken` and `owner:ops`.
# A scheduled watchdog in the caller's `red-main.yml` files one issue labelled
# `red-main-red-watchdog` when the trunk stays red past 30 minutes whatever the
# verdict was (watch the watcher).
#
# Revert rules (every repository, by default):
#   1. a culprit that adds or changes a migration (`[ci] migration_paths`,
#      default `atlas/migrations/**,atlas.sum,**/atlas.sum`), or whose changed
#      files cannot be listed completely, is never reverted: an issue labelled
#      `red-main-migration-hold` and the owner label, and a comment on the ops
#      issue and the pull request, hand it to a person for a forward-fix;
#   2. only real failures revert: infrastructure failures are reported and
#      never reverted;
#   4. every auto-revert comments on the ops issue and the original pull
#      request and files a follow-up issue (sha, pull request, failing job,
#      run link) that re-lands the change.
# `[ci] revert_hold_utc = "HH:MM-HH:MM"` is an optional deploy freeze: inside
# it a revert is opened but not armed. `on_red = "notify"` never pushes a
# branch or opens a pull request; it comments and files issues only.
#
# The candidates are the commits since a per-unit baseline: when the confirm step
# names failing units (a junit test, else a lane) that failed on two consecutive
# runs, the baseline is the head of the newest earlier completed push run where
# one of them did not fail (.github/red_main/window.py), so a unit that breaks inside an already
# red trunk is traced over the commits since it last passed. The candidate runs
# then cover only those units' lanes and count as failed only when one of those
# units failed. No such run in the last 100 keeps the last fully verified
# commit as the baseline.
#
# The culprit is the OLDEST candidate whose run concluded `failure`, provided
# every older candidate concluded `success`. A cancelled, startup_failure,
# timed_out, or not-finished-by-the-deadline run is inconclusive and never
# blamed; when one sits at or before the first failure, the oldest failing
# commit cannot be named with certainty, so the whole window is reverted in
# one pull request (the same path a window wider than max-candidates takes).
# The rule is .github/red_main/culprit.py. A caller that sets `revert-window: false`
# reverts only a traced culprit: a window is reported on its pull requests and
# a person decides. `candidate-timeout-minutes` (default 20, at most 60) is the
# trace's shared deadline; set it above the slowest lane a trace re-runs.
#
# A candidate whose pull request carries `queue-jump:outage` or a P0 label, or
# whose number is in `protected-prs`, is never reverted by the handler: it
# comments on that pull request (and on `ops-issue`) for a person to decide.
#
# Every write goes to the forge as a comment, an issue, a branch, or a pull
# request, so the whole action is auditable in the repository's own timeline.
# Nothing is pushed to the trunk, no ruleset is touched, and the revert lands
# through the repository's normal merge queue.
#
# ---------------------------------------------------------------------------
# When the handler may act at all (the opt-in contract)
# ---------------------------------------------------------------------------
#
# A repository that declares nothing is never acted on; a missing declaration
# is never consent.
#
# The declaration is the repository's own committed `sylphx.toml`, read from
# the repository's default branch through the API. Every workflow in this
# family reads it the same way, from the same file, so there is exactly one
# answer per repository:
#
#   * `[ci] merge = "optimistic"` means act, and `[ci] on_red` picks
#     `revert`, `revert_pr_unarmed` or `notify`. `on_red` absent means
#     `revert`; `notify` is an explicit opt-out. `revert_pr_unarmed` opens the revert pull request and an alert
#     issue but never arms auto-merge, never enqueues and never jumps: a
#     person decides whether and when it merges (for a repository whose
#     deploys have their own gates).
#   * `merge` absent, or anything else, means do nothing, silently.
#   * No `sylphx.toml` at all means do nothing, and say so: a repository that
#     wants verified commits adopts a minimal manifest (version = "1" and
#     `[ci] merge = "optimistic"`, `on_red = "notify"` or `"revert"`).
#
# The gate step prints one line naming which source decided.
#
# ---------------------------------------------------------------------------
# Secrets and the App token
# ---------------------------------------------------------------------------
#
# None beyond the inherited App id and private key. A repository that holds no
# key (a tenant organization never receives the cross-org builder key) runs in
# token mode: see "Token mode" below. The App token it mints is
# narrowed to the calling repository, is never printed, never uploaded, and
# never written to a file - it lives in step outputs and in `$GH_TOKEN` for
# the length of one step. Git network commands take it from the environment
# through a credential helper defined in the step's own shell, so it never
# reaches a remote URL or the git config. An installation token lives 60
# minutes and the trace may run 70, so the handler mints a second, fresh
# token after the trace for the revert, the report and the record; a write
# the forge answers with HTTP 401 fails the step instead of passing as done.
#
# ---------------------------------------------------------------------------
# Token mode (no builder App key)
# ---------------------------------------------------------------------------
#
# When the key is empty the handler skips the App mint and works on the
# caller's own `github.token`, in notify mode whatever `[ci] on_red` says:
# a pull request opened with GITHUB_TOKEN triggers no CI and could never pass
# the merge queue, so the revert pull request is not opened. The classification,
# the culprit trace and the comment on the affected pull request(s) run on
# the token; every write its grant refuses is named. The summary lists what a
# person must do.

on:
  workflow_call:
    inputs:
      mode:
        description: 'repair (existing behavior) or lifecycle (owned alerts only; no CI/source mutations).'
        type: string
        default: repair
      repository:
        description: 'Qualified caller repository for lifecycle mode; must match the workflow_run event.'
        type: string
        default: ''
      head-sha:
        description: 'workflow_run.head_sha for lifecycle mode.'
        type: string
        default: ''
      run-id:
        description: 'workflow_run.id for lifecycle mode.'
        type: string
        default: ''
      run-attempt:
        description: 'workflow_run.run_attempt for lifecycle mode; required even for attempt 1.'
        type: string
        default: ''
      result:
        description: 'workflow_run conclusion: success, failure, cancelled or unknown. Lifecycle callers trigger on completed, with no failure-only filter.'
        type: string
        default: unknown
      trunk:
        description: >-
          Branch the handler guards (the one the verify workflow runs on after
          a merge). Empty reads the repository's default branch from the
          event payload, so a repository whose default branch is `master` or
          anything else is classified like one on `main`.
        type: string
        default: ''
      verify-workflow:
        description: >-
          File name of the caller's verify workflow, e.g. verify.yml. Its runs
          are the ones this handler reads, and the ones it dispatches on a
          candidate commit.
        type: string
        required: true
      verify-check-name:
        description: >-
          Name of the aggregate check run that marks a commit as verified,
          e.g. verified. It is what the handler looks for when it walks the
          ancestors of a red commit to find the last verified one.
        type: string
        default: verified
      max-candidates:
        description: >-
          Most unverified commits to trace (all at once). A wider window is
          reverted in one pull request without tracing.
        type: number
        default: 8
      revert-window:
        description: >-
          Whether a window may be reverted when no single culprit is named (a
          window wider than max-candidates, or an inconclusive candidate before
          the first failure). false reverts only a traced culprit; a window is
          reported on its pull requests and a person decides.
        type: boolean
        default: true
      candidate-timeout-minutes:
        description: >-
          Shared deadline, in minutes (1-60), for the candidate verify runs of
          one trace. A candidate still running at the deadline is inconclusive.
          Set it above the slowest lane the trace re-runs.
        type: number
        default: 20
      lane-input:
        description: >-
          Input on the verify workflow that selects lanes, e.g. `lanes`. Set
          empty when the workflow takes no inputs.
        type: string
        default: lanes
      protected-labels:
        description: >-
          Comma-separated pull request labels whose change is never reverted
          by a machine (a live-outage or P0 fix). A label ending in `:p0`
          counts as P0. The handler comments instead.
        type: string
        default: 'queue-jump:outage,P0'
      protected-prs:
        description: >-
          Comma-separated pull request numbers that are never reverted by a
          machine, whatever their labels.
        type: string
        default: ''
      ops-issue:
        description: >-
          Issue in the calling repository that receives the comment when a
          protected pull request is the culprit, for its owner to decide. Empty
          comments on the pull request only.
        type: string
        default: ''
      simulate-mint-failure:
        description: >-
          Test hook: fail the grant probe on purpose so the failure notice on
          `ops-issue` can be checked. Honoured only when the caller was
          started by workflow_dispatch, whatever the caller passes.
        type: boolean
        default: false
      app-id:
        description: >-
          GitHub App id holding the caller's installation. Defaults to the
          repository variable SYLPHX_BUILDER_APP_ID, which is also the name
          the other shared workflows use.
        type: string
        default: ''
      environment:
        description: >-
          Name of a GitHub environment the handler job runs in, e.g.
          `builder-write`. A `uses:` caller job cannot declare `environment:`,
          so a repository that keeps the builder App key in an environment
          (limited to the trunk and release tags) names it here; the job then
          reads SYLPHX_BUILDER_PRIVATE_KEY from that environment itself and
          the caller passes no secret. Empty means no environment: the key
          comes from the passed or inherited secret, as before.
        type: string
        default: ''
      broker-trust-policy:
        description: >-
          Kernel Broker TrustPolicy to mint the write token from, e.g.
          `orgs/sylphx/trust_policies/red-main`. When set, the handler needs no
          App private key: it trades this job's GitHub Actions OIDC token for a
          short-lived Access key (`POST /v1/access/github/token`, the workflow
          must be declared under `[[ci]]` in the platform manifest) and calls
          `:exchangeToken` for a one-repository installation token. The PEM path
          stays for a caller that still holds the key; an empty value and no key
          keeps token mode. The `.github` org and the tenant orgs hold no PEM, so
          this is the path a tenant uses once its builder App installation and
          its `[[ci]]` declaration exist.
        type: string
        default: ''
      broker-ci-name:
        description: >-
          The `[[ci]]` declaration name this workflow exchanges its OIDC token
          under (`POST /v1/access/github/token`). Defaults to the TrustPolicy id
          in `broker-trust-policy` (its last path segment), which is also the
          name to declare.
        type: string
        default: ''
    secrets:
      app-private-key:
        description: >-
          Private key of that App. Defaults to the inherited
          SYLPHX_BUILDER_PRIVATE_KEY.
        required: false
      SYLPHX_BUILDER_PRIVATE_KEY:
        description: >-
          The org's builder App private key, as declared so a caller may pass
          it by name as well as through `secrets: inherit`.
        required: false

# One handler per repository at a time: two of them must not race a
# revert or a trace branch. Queue up to 100 pending calls instead of
# replacing the single pending slot; GitHub cancels additional calls at capacity.
# Arrival order is not run order, so lifecycle recovery also reconciles live runs.
concurrency:
  group: red-main-${{ github.repository }}
  queue: max
  cancel-in-progress: false

# No `permissions:` block here on purpose: the caller decides what the job's
# GITHUB_TOKEN carries, and a called workflow can only narrow that grant (an
# explicit request above it fails the call), so this handler requests nothing.
# Every caller grants `actions: write` (dispatch of the verify workflow,
# runs and jobs, all through `github.token`) and `issues: write`
# (the notice when a mint or probe fails), plus `contents: read`,
# `id-token: write` (run-store reads) and `checks: read`. The github.token is never handed to anything that runs
# pull-request-controlled code. A caller with the builder App also has the
# handler push and open pull requests through the App installation token,
# which needs contents, issues, pull-requests and workflows write and no
# `actions` permission. A tenant caller without the App also grants `pull-requests:
# write` and the handler notifies on its own token.

jobs:
  # Explicit lifecycle opt-in bypasses the repair manifest gate. This job has
  # only run/job reads and owned issue writes; it cannot reach repair steps.
  lifecycle:
    if: inputs.mode == 'lifecycle'
    name: Owned CI alert lifecycle
    runs-on: sylphx-linux-standard
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    env:
      TRUNK: ${{ inputs.trunk || github.event.repository.default_branch || 'main' }}
      REPO: ${{ inputs.repository }}
      VERIFY_WORKFLOW: ${{ inputs.verify-workflow }}
      VERIFY_CHECK_NAME: ${{ inputs.verify-check-name }}
      HEAD_SHA: ${{ inputs.head-sha }}
      RUN_ID: ${{ inputs.run-id }}
      RUN_ATTEMPT: ${{ inputs.run-attempt }}
      RESULT: ${{ inputs.result }}
      LIFECYCLE_PY: |
        """Owned alert lifecycle only. No actions or source mutations."""
        import hashlib
        import json
        import logging
        import os
        import re
        import subprocess
        from dataclasses import dataclass
        from urllib.parse import quote
        from post_main import paged, producer_origin


        @dataclass
        class Event:
            repo: str
            workflow: str
            check: str
            sha: str
            run: int
            attempt: int
            result: str

            @property
            def order(self):
                return [self.run, self.attempt]

            @property
            def identity(self):
                return [self.repo, self.workflow, self.check]

            @property
            def fingerprint(self):
                return hashlib.sha256(json.dumps(self.identity).encode()).hexdigest()

            @property
            def url(self):
                return f'https://github.com/{self.repo}/actions/runs/{self.run}/attempts/{self.attempt}'


        MARKER = re.compile(r'<!-- red-main-lifecycle:v1 (\{[^\n]+\}) -->')


        def api(path, method='GET', data=None):
            args = ['gh', 'api', path, '--method', method]
            if data is not None:
                args += ['--input', '-']
            env = dict(os.environ)
            if '/actions/' in path:
                env['GH_TOKEN'] = os.environ['ACTIONS_TOKEN']
            proc = subprocess.run(args, input=json.dumps(data) if data is not None else None,
                                  text=True, capture_output=True, env=env)
            if proc.returncode:
                # Do not print API response bodies or credentials.
                raise RuntimeError(f'{method} {path} unavailable (exit {proc.returncode})')
            return json.loads(proc.stdout)


        def marker(issue, event, owner):
            if issue.get('pull_request') or issue.get('user', {}).get('id') != owner:
                return None
            matches = MARKER.findall(issue.get('body') or '')
            if len(matches) != 1:
                return None
            state = json.loads(matches[0])
            if state.get('identity') != event.identity or state.get('fingerprint') != event.fingerprint:
                return None
            for key in ('last_event', 'last_failure'):
                value = state.get(key)
                if not isinstance(value, list) or len(value) != 2 or not all(
                        type(n) is int and n > 0 for n in value):
                    raise RuntimeError('Owned lifecycle marker has invalid ordering proof')
            if state['last_failure'] > state['last_event']:
                raise RuntimeError('Owned lifecycle marker has inconsistent ordering proof')
            return state


        def find_issue(api, event, owner):
            # REST issue lists have no total_count. Adapt GraphQL's counted
            # issues-only connection to the same canonical coverage validator.
            cursor = None
            covered = 0
            def issue_page(_path):
                nonlocal cursor, covered
                owner_name, repo_name = event.repo.split('/')
                query = """query($owner:String!, $name:String!, $after:String) {
                  repository(owner:$owner, name:$name) {
                    issues(first:100, after:$after, orderBy:{field:CREATED_AT,direction:ASC}) {
                      totalCount pageInfo { endCursor hasNextPage }
                      nodes { databaseId number body state
                        author { ... on Bot { databaseId } ... on User { databaseId } } }
                    }
                  }
                }"""
                response = api('graphql', 'POST', {'query': query, 'variables': {
                    'owner': owner_name, 'name': repo_name, 'after': cursor}})
                if response.get('errors'):
                    raise RuntimeError('Issue enumeration unavailable')
                connection = response['data']['repository']['issues']
                info = connection['pageInfo']
                if type(info.get('hasNextPage')) is not bool:
                    raise RuntimeError('Issue pagination unavailable')
                count, nodes = connection.get('totalCount'), connection.get('nodes')
                if type(count) is not int or count < 0 or not isinstance(nodes, list):
                    raise RuntimeError('Issue count/nodes unavailable')
                covered += len(nodes)
                if covered > count or info['hasNextPage'] != (covered < count):
                    raise RuntimeError('Issue continuation contradicts counted coverage')
                next_cursor = info.get('endCursor')
                if info['hasNextPage'] and (not isinstance(next_cursor, str)
                                           or not next_cursor or next_cursor == cursor):
                    raise RuntimeError('Issue cursor unavailable or repeated')
                cursor = next_cursor
                rows = []
                for node in nodes:
                    if node.get('state') not in ('OPEN', 'CLOSED'):
                        raise RuntimeError('Issue state unavailable')
                    rows.append({'id': node['databaseId'], 'number': node['number'],
                                 'body': node['body'], 'state': node['state'].lower(),
                                 'user': {'id': (node.get('author') or {}).get('databaseId')}})
                return {'total_count': connection['totalCount'], 'issues': rows}
            found = [row for row in paged('issues', 'issues', reader=issue_page)
                     if marker(row, event, owner) is not None]
            if len(found) > 1:
                raise RuntimeError('Multiple owned identity issues; refusing ambiguous mutation')
            return found[0] if found else None


        def trusted_main(run, repo):
            # A fork PR can also name its branch main. Only same-repository main
            # pushes are authoritative; dispatch/PR/merge-group runs are excluded.
            return (run.get('event') == 'push' and run.get('head_branch') == os.environ['TRUNK']
                    and run.get('head_repository', {}).get('full_name') == repo)


        def prove(api, event):
            base = f'repos/{event.repo}/actions/runs/{event.run}'
            latest = api(base)
            attempt = api(f'{base}/attempts/{event.attempt}')
            for run in (latest, attempt):
                workflow = run.get('path', '').split('@', 1)[0].removeprefix('.github/workflows/')
                conclusion = run.get('conclusion')
                result = conclusion if conclusion in ('success', 'failure', 'cancelled') else 'unknown'
                if (not trusted_main(run, event.repo)
                        or run.get('id') != event.run or run.get('run_attempt') != event.attempt
                        or run.get('repository', {}).get('full_name') != event.repo
                        or run.get('head_sha') != event.sha or workflow != event.workflow
                        or run.get('status') != 'completed' or result != event.result):
                    raise RuntimeError('Run/attempt no longer matches completed caller event')
            # Authenticate the aggregate job on this exact attempt, not a check from a
            # different workflow/attempt sharing the SHA. Cancelled/unknown never close.
            if event.result in ('success', 'failure'):
                jobs = paged(f'{base}/attempts/{event.attempt}/jobs', 'jobs', reader=api)
                jobs = [job for job in jobs if job.get('name') == event.check]
                if len(jobs) != 1 or jobs[0].get('conclusion') != event.result:
                    raise RuntimeError('Named check does not prove caller result on this attempt')


        def prove_recovery(api, event):
            # Never trust handler delivery/queue order as the latest Verify state.
            # A newer failed run may have completed without its handler running.
            trunk = os.environ['TRUNK']
            rows = paged(f'repos/{event.repo}/actions/workflows/{event.workflow}/runs'
                         f'?branch={quote(trunk, safe="")}&event=push&status=completed', 'workflow_runs', reader=api)
            runs = []
            for run in rows:
                origin = producer_origin(run, event.repo, trunk, event.workflow)
                if origin == 'ineligible':
                    continue
                if (origin != 'eligible' or run.get('status') != 'completed'
                        or run.get('conclusion') not in (
                            'success', 'failure', 'cancelled', 'skipped', 'neutral',
                            'timed_out', 'action_required', 'startup_failure', 'stale')):
                    raise RuntimeError('Relevant trunk Verify history row is invalid')
                if run['conclusion'] in ('success', 'failure'):
                    runs.append(run)
            if not runs:
                raise RuntimeError('No eligible completed trunk Verify run proves recovery')
            latest = max(runs, key=lambda run: [run['id'], run['run_attempt']])
            candidate = Event(event.repo, event.workflow, event.check, latest['head_sha'],
                              latest['id'], latest['run_attempt'], latest['conclusion'])
            # Re-authenticate the listing's candidate through the run/attempt APIs.
            prove(api, candidate)
            if candidate.order != event.order or candidate.result != 'success':
                raise RuntimeError('Latest eligible trunk Verify run does not prove this recovery')


        def body(event, state):
            return (f'Alert for `{event.repo}` / `{event.workflow}` / `{event.check}`.\n\n'
                    f'Latest event: [{event.result}]({event.url}) at `{event.sha}`.\n\n'
                    '<!-- red-main-lifecycle:v1 ' + json.dumps(state, sort_keys=True) + ' -->')


        def handle(api, event, owner):
            try:
                prove(api, event)
                issue = find_issue(api, event, owner)
                state = marker(issue, event, owner) if issue else None
                if state and event.order <= state['last_event']:
                    logging.info('Ignoring older/replayed lifecycle event %s', event.order)
                    return
                if issue is None:
                    if event.result != 'failure':
                        logging.info('No owned failure to recover for %s', event.identity)
                        return
                    # Repeat the scan before creating, so a failed/partial read cannot
                    # create a duplicate. The workflow serializes all handler calls.
                    if find_issue(api, event, owner) is not None:
                        raise RuntimeError('Identity issue appeared; refusing duplicate creation')
                    prove(api, event)
                    state = {'identity': event.identity, 'fingerprint': event.fingerprint,
                             'last_event': event.order, 'last_failure': event.order}
                    api(f'repos/{event.repo}/issues', 'POST', {
                        'title': f'CI alert: {event.workflow} / {event.check}',
                        'body': body(event, state), 'labels': ['owner:ops']})
                    return
                path = f'repos/{event.repo}/issues/{issue["number"]}'
                snapshot = state

                def fresh():
                    # Every write gets a new issue read AND run/attempt proof. Any
                    # concurrent update or API failure leaves the alert open.
                    current = api(path)
                    if marker(current, event, owner) != snapshot or current['state'] != issue['state']:
                        raise RuntimeError('Issue changed since lifecycle decision')
                    prove(api, event)
                    if event.result == 'success':
                        prove_recovery(api, event)

                new_state = {**state, 'last_event': event.order}
                if event.result == 'failure':
                    new_state['last_failure'] = event.order
                    fresh()
                    api(path, 'PATCH', {'body': body(event, new_state), 'state': 'open'})
                elif event.result == 'success':
                    if event.order <= state['last_failure']:
                        return
                    if issue['state'] == 'open':
                        fresh()
                        api(path + '/comments', 'POST', {
                            'body': f'Recovered: [{event.check} passed]({event.url}) on `{event.sha}`.'})
                    fresh()
                    api(path, 'PATCH', {'body': body(event, new_state), 'state': 'closed'})
                else:
                    # Record inconclusive events for FIFO, but NEVER change open/closed.
                    fresh()
                    api(path, 'PATCH', {'body': body(event, new_state)})
                    logging.warning('Inconclusive lifecycle result %s; alert state unchanged', event.result)
            except (RuntimeError, ValueError, KeyError, TypeError) as exc:
                logging.warning('Lifecycle proof/read unavailable; no further mutations: %s', exc)


        def main():
            logging.basicConfig(level=logging.INFO)
            event = Event(os.environ['REPO'], os.environ['VERIFY_WORKFLOW'],
                          os.environ['VERIFY_CHECK_NAME'], os.environ['HEAD_SHA'],
                          int(os.environ['RUN_ID']), int(os.environ['RUN_ATTEMPT']),
                          os.environ['RESULT'])
            # Inputs are transport, not authority: bind them to the actual caller event.
            with open(os.environ['GITHUB_EVENT_PATH']) as stream:
                payload = json.load(stream)
            run = payload.get('workflow_run', {})
            if (os.environ.get('GITHUB_EVENT_NAME') != 'workflow_run'
                    or payload.get('action') != 'completed'
                    or event.repo != os.environ['GITHUB_REPOSITORY']
                    or payload.get('repository', {}).get('full_name') != event.repo
                    or not trusted_main(run, event.repo)
                    or run.get('id') != event.run or run.get('run_attempt') != event.attempt
                    or run.get('head_sha') != event.sha or run.get('status') != 'completed'
                    or event.result not in ('success', 'failure', 'cancelled', 'unknown')):
                raise RuntimeError('Lifecycle inputs must match the completed workflow_run event')
            slug = os.environ['APP_SLUG']
            owner = api(f'users/{slug}[bot]')['id']
            handle(api, event, owner)


        if __name__ == '__main__':
            main()
    steps:
      - name: Require explicit App credentials
        env:
          APP_ID: ${{ inputs.app-id || vars.SYLPHX_BUILDER_APP_ID }}
          APP_KEY: ${{ secrets.app-private-key || secrets.SYLPHX_BUILDER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Lifecycle mode requires the handler App credentials; no token fallback'
            exit 1
          fi
      - name: Mint repository-scoped lifecycle token
        id: lifecycle-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id || vars.SYLPHX_BUILDER_APP_ID }}
          private-key: ${{ secrets.app-private-key || secrets.SYLPHX_BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Read canonical counted proof helper
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SylphxAI/.github
          ref: ${{ job.workflow_sha }}
          path: lifecycle-shared
          persist-credentials: false
          sparse-checkout: .github/actions/ci-range
      - name: Reconcile owned identity alert
        env:
          GH_TOKEN: ${{ steps.lifecycle-app.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.lifecycle-app.outputs.app-slug }}
          PYTHONPATH: lifecycle-shared/.github/actions/ci-range
        run: python3 -c "$LIFECYCLE_PY"

  red-main:
    if: inputs.mode == 'repair'
    name: Red main handler
    # Our own runners only; a hosted label is refused in pull requests that
    # add one (owner#750).
    runs-on: sylphx-linux-standard
    # Empty string = no environment (an empty `environment:` name is ignored by
    # Actions), so callers that omit the input behave as before.
    environment: ${{ inputs.environment }}
    # Mint, every candidate dispatched at once under one shared deadline
    # (candidate-timeout-minutes, at most 60), revert, summary, and slack.
    timeout-minutes: 120
    env:
      # The branch the handler guards: the `trunk` input, else the repository's
      # own default branch from the event payload, else `main`.
      TRUNK: ${{ inputs.trunk || github.event.repository.default_branch || 'main' }}
      REPO: ${{ github.repository }}
      RUN_STORE_JUNIT: ${{ github.workspace }}/.red-main-store/.github/actions/run-store/get-junit.py
      VERIFY_WORKFLOW: ${{ inputs.verify-workflow }}
      VERIFY_CHECK_NAME: ${{ inputs.verify-check-name || 'verified' }}
      MAX_CANDIDATES: ${{ inputs.max-candidates }}
      LANE_INPUT: ${{ inputs.lane-input }}
      CANDIDATE_TIMEOUT_MINUTES: ${{ inputs.candidate-timeout-minutes }}
      REVERT_WINDOW: ${{ inputs.revert-window }}
      # A window wider than this is never reverted by a machine; the handler
      # says so and stops.
      MAX_REVERT_COMMITS: '250'
      # The handler's programs and shell helpers are checked in under
      # .github/red_main/ and run from there, so the verdict engines are
      # unit-tested code rather than a heredoc written at runtime. The
      # helpers step copies them into $WORK_DIR; nothing here holds text.
      # proof.py's canonical source is .github/actions/ci-range/post_main.py
      # and must stay byte-identical to it (tests/test_post_main_proof.py).
    steps:
      # ---------------------------------------------------------------------
      # The handler's programs are checked in beside this workflow and run
      # from there, so the verdict engines are unit-tested code rather than a
      # heredoc written at runtime. The reusable workflow runs in the .github
      # repository, so its own tree is checked out here at the ref this run
      # was dispatched with (`job.workflow_sha`); no caller tree is read.
      # ---------------------------------------------------------------------
      - name: Check out the handler programs
        id: programs
        timeout-minutes: 5
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SylphxAI/.github
          ref: ${{ job.workflow_sha }}
          path: red-main-programs
          persist-credentials: false
          sparse-checkout: .github/red_main

      # ---------------------------------------------------------------------
      # Gate: the repository's own committed declaration decides whether the
      # handler exists at all, and in which mode.
      #
      #   sylphx.toml is the ONLY declaration. Read it from the repository's
      #   committed tree through the API, because this reusable workflow runs
      #   in the .github repository and the caller's tree is not checked out.
      #
      #     [ci] merge = "optimistic"  -> act; [ci] on_red picks revert or
      #                                   notify (absent: revert)
      #     merge absent or other     -> silent no-op
      #     no sylphx.toml            -> silent no-op, and say what to adopt
      #     on_red outside the two    -> error, and no action
      #
      # A missing declaration is never consent: the default answer is a
      # no-op, and the step prints one line naming which source decided.
      # ---------------------------------------------------------------------
      - name: Gate on the repository's optimistic-merge declaration
        id: gate
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ runner.temp }}/red-main/sylphx.toml
          PROGRAMS: ${{ github.workspace }}/red-main-programs
        run: |
          set -euo pipefail
          echo "proceed=false" >>"$GITHUB_OUTPUT"
          mkdir -p "$(dirname "$MANIFEST")"
          has_file=no
          if body=$(gh api "repos/$REPO/contents/sylphx.toml" --jq '.content' 2>/dev/null); then
            if printf '%s' "$body" | base64 --decode >"$MANIFEST" 2>/dev/null; then
              has_file=yes
            else
              echo "not opted in: sylphx.toml could not be decoded"
              exit 0
            fi
          fi
          if ! command -v python3 >/dev/null; then
            echo "::error::python3 is not on the runner, so the declaration cannot be read; no action (fail closed)"
            exit 0
          fi
          decision=$(python3 "$PROGRAMS/.github/red_main/gate.py" "$MANIFEST" "$has_file")
          IFS=$'\t' read -r verdict mode owner_label migration_paths hold_utc basis <<<"$decision" || true
          case "${verdict:-}" in
            act)
              echo "proceed=true" >>"$GITHUB_OUTPUT"
              echo "mode=$mode" >>"$GITHUB_OUTPUT"
              echo "owner-label=${owner_label:-owner:ops}" >>"$GITHUB_OUTPUT"
              echo "migration-paths=$migration_paths" >>"$GITHUB_OUTPUT"
              [ "$hold_utc" != - ] || hold_utc=""
              echo "hold-utc=$hold_utc" >>"$GITHUB_OUTPUT"
              echo "declaration: $basis" ;;
            off)
              echo "not opted in: $basis" ;;
            error)
              echo "::error::$basis" ;;
            *)
              echo "::error::the opt-in gate produced no decision; no action (fail closed)" ;;
          esac

      # ---------------------------------------------------------------------
      # The helpers, on disk for the steps that follow: copied verbatim from
      # the checked-in programs so every step runs the reviewed file.
      # ---------------------------------------------------------------------
      - name: Read canonical run-store consumer
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SylphxAI/.github
          ref: ${{ job.workflow_sha }}
          path: .red-main-store
          persist-credentials: false
          sparse-checkout: .github/actions/run-store

      - name: Prepare the handler helpers
        id: helpers
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 5
        env:
          PROGRAMS: ${{ github.workspace }}/red-main-programs/.github/red_main
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/red-main"
          for program in infra confirm migration hold prev window proof gate junit culprit; do
            install -m 600 "$PROGRAMS/$program.py" "$RUNNER_TEMP/red-main/$program.py"
          done
          install -m 600 "$PROGRAMS/revert_guard.py" "$RUNNER_TEMP/red-main/revert-guard.py"
          install -m 600 "$PROGRAMS/lib.sh" "$RUNNER_TEMP/red-main/lib.sh"
          chmod 700 "$RUNNER_TEMP/red-main"

      # ---------------------------------------------------------------------
      # Which write-token path does this caller have? `secrets` cannot appear
      # in an `if:`, so the step reads the key into a flag. Order, per
      # company/credentials.md: the Broker first (federation, no key anywhere),
      # then a passed or environment App key, then token mode. `path` names the
      # branch; `write=yes` means a token that can push and open pull requests
      # is available, so the declared `revert` stands. No path at all: token
      # mode (see the header), and the effective mode is notify whatever the
      # declaration says.
      # ---------------------------------------------------------------------
      - name: Detect the builder write-token path
        id: key
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 5
        env:
          APP_KEY: ${{ secrets.app-private-key || secrets.SYLPHX_BUILDER_PRIVATE_KEY }}
          BROKER_POLICY: ${{ inputs.broker-trust-policy }}
          DECLARED_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          if [ -n "$APP_KEY" ]; then
            echo "path=app" >>"$GITHUB_OUTPUT"
            echo "present=yes" >>"$GITHUB_OUTPUT"
            echo "write=yes" >>"$GITHUB_OUTPUT"
            echo "mode=$DECLARED_MODE" >>"$GITHUB_OUTPUT"
            echo "the builder App key is present: the App path"
          elif [ -n "$BROKER_POLICY" ]; then
            echo "path=broker" >>"$GITHUB_OUTPUT"
            echo "present=no" >>"$GITHUB_OUTPUT"
            echo "write=yes" >>"$GITHUB_OUTPUT"
            echo "mode=$DECLARED_MODE" >>"$GITHUB_OUTPUT"
            echo "no App key, a Broker TrustPolicy is set: the Broker path ($BROKER_POLICY)"
          else
            state_set token-mode yes
            echo "path=token" >>"$GITHUB_OUTPUT"
            echo "present=no" >>"$GITHUB_OUTPUT"
            echo "write=no" >>"$GITHUB_OUTPUT"
            echo "mode=notify" >>"$GITHUB_OUTPUT"
            echo "no builder App key and no Broker TrustPolicy: token mode, on the caller's own GITHUB_TOKEN"
            say "revert needs a CI-triggering token (the builder App or the Broker); notifying only."
          fi

      # ---------------------------------------------------------------------
      # App token, narrowed to the calling repository, carrying the four
      # permissions the handler writes through: contents, issues,
      # pull-requests and workflows. Workflows write is needed because a
      # `sylphx-verify/<sha>-<run>-<attempt>` or revert branch points at a commit whose
      # `.github/workflows` differ from the default branch's (an older pin),
      # and the forge refuses that ref write from an App without it. It asks
      # for no `actions` permission: the builder App
      # installation does not hold one, and a request above the installation's
      # grant fails the whole mint. Actions calls use the caller's
      # `github.token` (see `gha` in the helpers). The App token stays for what
      # must start CI or look like a person: pushing verify and revert
      # branches, opening pull requests, enqueue. A failed mint is reported by
      # name, never silently.
      # ---------------------------------------------------------------------
      - name: Mint the App token for the caller's repository
        id: app-token
        if: steps.gate.outputs.proceed == 'true' && steps.key.outputs.path == 'app'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id || vars.SYLPHX_BUILDER_APP_ID }}
          private-key: ${{ secrets.app-private-key || secrets.SYLPHX_BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      # ---------------------------------------------------------------------
      # The Broker path: no App private key anywhere. The two-hop exchange
      # (Actions OIDC token -> Access key -> one-repository installation token)
      # is the shared `broker-write-token` action, pinned here by commit.
      # ---------------------------------------------------------------------
      - name: Mint the write token from the Broker
        id: broker-token
        if: steps.gate.outputs.proceed == 'true' && steps.key.outputs.path == 'broker'
        continue-on-error: true
        timeout-minutes: 5
        uses: SylphxAI/.github/.github/actions/broker-write-token@083eff31aa012b3a24d5601abfc524ad461b2394 # main
        with:
          trust-policy: ${{ inputs.broker-trust-policy }}
          ci-name: ${{ inputs.broker-ci-name }}
          repository: ${{ github.repository }}
          soft-fail: 'true'

      - name: Record a Broker mint failure
        if: >-
          always() && steps.gate.outputs.proceed == 'true'
          && steps.key.outputs.path == 'broker'
          && steps.broker-token.outputs.failure != ''
        timeout-minutes: 2
        env:
          REASON: ${{ steps.broker-token.outputs.failure }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          state_set grant-failure "$REASON"

      # ---------------------------------------------------------------------
      # Probe the grant before anything acts. Actions is read through the
      # workflow token (a read proves `actions: read`; a dispatch the
      # caller did not grant is refused and named where it happens). The
      # App-token surfaces are proven by the mint itself. A failed mint or
      # probe writes its reason to `grant-failure` for the notice step.
      # ---------------------------------------------------------------------
      - name: Probe the grants on the caller's repository
        id: probe
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          KEY_PRESENT: ${{ steps.key.outputs.write }}
          KEY_PATH: ${{ steps.key.outputs.path }}
          APP_MINTED: ${{ (steps.app-token.outputs.token != '' || steps.broker-token.outputs.token != '') && 'yes' || 'no' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SIMULATE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate-mint-failure && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          : >"$STATE_DIR/grant.tsv"
          grant() { printf '%s\t%s\n' "$1" "$2" >>"$STATE_DIR/grant.tsv"; }
          fail() {
            state_set grant-failure "$1"
            echo "::error::$1"
            exit 1
          }
          if [ "$SIMULATE" = yes ]; then
            fail "simulated mint failure (test hook): the App token mint for $REPO was reported as refused"
          fi
          if [ "$KEY_PRESENT" = yes ] && [ "$APP_MINTED" != yes ]; then
            if [ "$KEY_PATH" = broker ]; then
              fail "the Broker did not mint a write token on $REPO (see the mint step's reason; the caller grants id-token: write, the workflow is declared under [[ci]], and the TrustPolicy grants contents, issues, pull-requests and workflows write on $REPO)"
            else
              fail "the App token was not minted on $REPO: the builder App installation does not grant contents, issues, pull-requests and workflows write, or the App id and key are empty, or the App has no installation on $REPO"
            fi
          fi
          run_path="repos/$REPO/actions/runs?per_page=1"
          if [ -n "$EVENT_RUN_ID" ]; then run_path="repos/$REPO/actions/runs/$EVENT_RUN_ID"; fi
          if ! err=$(gha api "$run_path" 2>&1 >/dev/null); then
            fail "the workflow token could not read $run_path on $REPO ($(head -c 200 <<<"$err" | tr '\n' ' ')): the caller must grant actions: write (dispatch of $VERIFY_WORKFLOW goes through it)"
          fi
          grant actions "granted (workflow token)"
          if [ "$KEY_PRESENT" != yes ]; then
            # Token mode: the token's grant is the caller's, and a permission
            # cannot be read back from it, so a write is attempted and, if
            # refused, named. Pushing is never attempted (contents is not
            # requested), so it is recorded as read-only.
            grant contents read-only
            grant issues granted
            grant pull-requests granted
            say "Token mode: the workflow token carries what the caller granted; a write it does not grant is refused and named."
          else
            # The mint returned a token, so the installation holds every
            # permission the handler writes with.
            grant contents "granted (App)"
            grant issues "granted (App)"
            grant pull-requests "granted (App)"
          fi
          {
            echo "### Grants on $REPO"
            echo
            echo "| surface | probe |"
            echo "| --- | --- |"
            while IFS=$'\t' read -r surface verdict; do echo "| $surface | $verdict |"; done <"$STATE_DIR/grant.tsv"
          } >>"$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # A failed mint or probe is never silent: name the missing grant on the
      # ops issue and in the step summary (github.token; the caller grants
      # `issues: write`), then fail the job.
      # ---------------------------------------------------------------------
      - name: Report a failed mint or probe
        id: grant-notice
        if: >-
          always() && steps.gate.outputs.proceed == 'true'
          && (steps.app-token.outcome == 'failure' || steps.probe.outcome == 'failure')
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_ISSUE: ${{ inputs.ops-issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason=""
          if [ -f "$RUNNER_TEMP/red-main/state/grant-failure" ]; then
            reason=$(cat "$RUNNER_TEMP/red-main/state/grant-failure")
          fi
          if [ -z "$reason" ]; then
            reason="the App token mint for $REPO failed: the builder App installation does not grant contents, issues, pull-requests and workflows write, or has no installation on this repository"
          fi
          body="Red main handler could not act on \`$REPO\`: $reason. No bisect or revert was performed. Run: $RUN_URL"
          {
            echo "### Red main handler blocked"
            echo
            echo "$body"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$OPS_ISSUE" ]; then
            gh api --method POST "repos/$REPO/issues/${OPS_ISSUE#\#}/comments" --field body="$body" >/dev/null \
              || echo "::warning::the notice could not be posted to issue $OPS_ISSUE (the workflow token needs issues: write)"
          fi
          echo "::error::$reason"
          exit 1

      # ---------------------------------------------------------------------
      # The verify run this event is about.
      # ---------------------------------------------------------------------
      - name: Resolve the verify run that failed
        id: run
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          quiet() {
            state_set quiet "$1"
            echo "no action: $1"
            exit 0
          }
          if [ -n "$EVENT_RUN_ID" ]; then
            if ! run_json=$(gha api "repos/$REPO/actions/runs/$EVENT_RUN_ID"); then
              say "**Unverified:** run $EVENT_RUN_ID could not be read; escalating the unavailable producer evidence, with no deploy or revert authorization."
              echo "::error::the verify run is unavailable; recovery requires investigation"
              exit 1
            fi
          else
            if ! run_json=$(gha api "repos/$REPO/actions/workflows/$VERIFY_WORKFLOW/runs?event=push&branch=$TRUNK&per_page=50" \
              | jq -c --arg trunk "$TRUNK" '[.workflow_runs[] | select(.event == "push" and .head_branch == $trunk and .status == "completed")] | .[0] // empty'); then
              say "**Unverified:** Verify history could not be read; escalating instead of treating the missing proof as no action."
              echo "::error::verify history is unavailable; recovery requires investigation"
              exit 1
            fi
          fi
          if [ -z "$run_json" ]; then
            quiet "no failed run of $VERIFY_WORKFLOW on $TRUNK was found to handle"
          fi
          run_id=$(jq -r '.id' <<<"$run_json")
          run_path=$(jq -r '.path' <<<"$run_json")
          head_sha=$(jq -r '.head_sha // ""' <<<"$run_json")
          head_branch=$(jq -r '.head_branch // ""' <<<"$run_json")
          conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
          run_url=$(jq -r '.html_url' <<<"$run_json")
          # Do not infer ineligibility from missing path/branch fields.
          # The strict producer helper distinguishes positive non-proof
          # origins from partial/null metadata, which remains unverified.
          # Only authenticated success or an authenticated ineligible
          # producer is terminal. Unknown/unavailable proof stays unverified
          # and keeps recovery active; it cannot authorize a revert.
          proof=$(read_proof run "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$run_id" "$VERIFY_CHECK_NAME")
          case "$proof" in
            success|ineligible) quiet "the authenticated post-main proof for $run_id is '$proof'" ;;
            failure|timed_out|action_required|startup_failure) ;;
            *) say "**Unverified:** run $run_id returned proof '$proof'; escalating, with no authenticated failure yet." ;;
          esac
          state_set proof-verdict "$proof"
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ || ! "$head_sha" =~ ^[a-f0-9]{40}$ ]]; then
            say "**Unverified:** the producer lacks a valid run identity or exact SHA; escalating incomplete metadata, not silencing recovery."
            echo "::error::producer metadata is unavailable"
            exit 1
          fi
          short_sha=$(cut -c1-9 <<<"$head_sha")
          if ! failed_lanes=$(gha api "repos/$REPO/actions/runs/$run_id/jobs?filter=latest&per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .name | gsub(","; ";")' \
            | paste -sd, -); then
            failed_lanes=""
            say "The failed lanes could not be listed; investigation or escalation must recover that evidence."
          fi
          state_set run-id "$run_id"
          state_set head-sha "$head_sha"
          state_set short-sha "$short_sha"
          state_set run-url "$run_url"
          state_set failed-lanes "$failed_lanes"
          {
            echo "run-id=$run_id"
            echo "head-sha=$head_sha"
            echo "short-sha=$short_sha"
            echo "failed-lanes=$failed_lanes"
            echo "proof-verdict=$proof"
            echo "run-url=$run_url"
          } >>"$GITHUB_OUTPUT"
          say "Verify run [$run_id]($run_url) on \`$head_sha\` has post-main proof \`$proof\`${failed_lanes:+ in lane(s) \`$failed_lanes\`}."

      # ---------------------------------------------------------------------
      # Idempotence, before anything else acts.
      # ---------------------------------------------------------------------
      - name: Stop when the work is already done or already in hand
        id: idem
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
          SHORT_SHA: ${{ steps.run.outputs.short-sha }}
          MODE: ${{ steps.key.outputs.mode || steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          quiet() { state_set quiet "$1"; echo "no action: $1"; exit 0; }
          branch="auto-revert/$SHORT_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          open=$(gh api "repos/$REPO/pulls?head=$REPO:$branch&state=open" --jq 'length' 2>/dev/null || echo 0)
          [ "$open" = "0" ] || quiet "an open pull request already stands for $branch"
          label_q=$(enc "repo:$REPO is:pr is:open label:auto-revert")
          hand_in=$(gh api "search/issues?q=$label_q" --jq '.total_count' 2>/dev/null || echo 0)
          # An unarmed revert stays open until a person decides, so its label
          # must not silence a DIFFERENT breakage: that mode is keyed on the
          # culprit-specific standing-revert check in the revert step.
          if [ "$MODE" != revert_pr_unarmed ]; then
            [ "$hand_in" = "0" ] || quiet "an open pull request already carries the auto-revert label"
          fi
          green=$(read_proof sha "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$HEAD_SHA" "$VERIFY_CHECK_NAME")
          [ "$green" != success ] || quiet "$HEAD_SHA already has an authenticated passing post-main proof"
          if [ "$green" = unknown ]; then
            say "**Unverified:** the same-SHA green guard has no available proof; recovery remains active."
          fi
          echo "nothing is already in hand for $SHORT_SHA"

      # ---------------------------------------------------------------------
      # The failing units of the run.
      # ---------------------------------------------------------------------
      - name: Read the failing tests from the run's junit artifacts
        id: junit
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run-id }}
          FAILED_LANES: ${{ steps.run.outputs.failed-lanes }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          mkdir -p "$WORK_DIR/junit"
          if python3 "$RUN_STORE_JUNIT" "$REPO" "$RUN_ID" "$WORK_DIR/junit" 2>"$WORK_DIR/junit.err"; then
            echo "read the run's junit entries from run-store"
          else
            say "The run published no readable \`junit-*\` run-store entry, so a failing lane is named by how it failed (its failed steps and error lines) rather than by a test."
          fi
          # How each failed job failed: a lane unit is its job, failed steps
          # and error lines, so one job failing two different ways is two
          # units. Unreadable is unverified, never a bare job-name match: the
          # confirmation below escalates instead of comparing.
          if ! python3 "$RUNNER_TEMP/red-main/proof.py" failed-units "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$RUN_ID" \
              >"$WORK_DIR/lane-signatures.tsv" 2>"$WORK_DIR/units.err"; then
            state_set units-unavailable "$(head -c 200 "$WORK_DIR/units.err" | tr '\n' ' ')"
            echo "::warning::the failed jobs' steps and error lines could not be read"
          fi
          python3 "$RUNNER_TEMP/red-main/junit.py" "$WORK_DIR/junit" "$WORK_DIR/failing-tests.tsv" "$FAILED_LANES" "$WORK_DIR/lane-signatures.tsv"
          count=$(wc -l <"$WORK_DIR/failing-tests.tsv" | tr -d ' ')
          say "Failing units: $count."

      # ---------------------------------------------------------------------
      # Infra signatures: an installation-token mint failure, an artifact
      # upload failure, a cache 403 or a lost runner in every failed job is
      # the platform failing, not the code. It is reported and never reverted,
      # and never rerun.
      # ---------------------------------------------------------------------
      - name: Classify infrastructure failures
        id: infra
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run-id }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          if ! verdict=$(classify_run "$RUN_ID"); then
            say "**Stopped:** the jobs of run $RUN_ID could not be read to classify the failure; nothing is reverted."
            echo "::error::the infra classifier could not read the run's jobs or annotations"
            exit 1
          fi
          echo "infra classification: $verdict"
          case "$verdict" in
            infra\ *)
              echo "infra=yes" >>"$GITHUB_OUTPUT"
              echo "signature=${verdict#infra }" >>"$GITHUB_OUTPUT"
              say "Every failed job shows an infrastructure signature (\`${verdict#infra }\`): it is reported, not reverted." ;;
            *) echo "infra=no" >>"$GITHUB_OUTPUT" ;;
          esac

      # ---------------------------------------------------------------------
      # Verdict: an infrastructure failure is ESCALATED, not merely recorded.
      # It is never reverted (a revert because the runner lost disk would be
      # worse than useless), but it opens one issue labelled
      # `red-main-infra` and the owner label so a person sees it: a silently
      # reported infra failure once left a trunk red for three days while
      # every reader took the passing handler run as healthy.
      # ---------------------------------------------------------------------
      - name: Decide the verdict of the failed run
        id: verdict
        if: steps.gate.outputs.proceed == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          INFRA: ${{ steps.infra.outputs.infra }}
          INFRA_SIGNATURE: ${{ steps.infra.outputs.signature }}
          INITIAL_PROOF: ${{ steps.run.outputs.proof-verdict }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
          RUN_URL: ${{ steps.run.outputs.run-url }}
          FAILED_LANES: ${{ steps.run.outputs.failed-lanes }}
          OWNER_LABEL: ${{ steps.gate.outputs.owner-label }}
          OPS_ISSUE: ${{ inputs.ops-issue }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          # Nothing is rerun: a failure on main is acted on as it stands, and
          # a flake is quarantined through the repository's quarantine list.
          case "$INITIAL_PROOF" in
            failure|timed_out|action_required|startup_failure) ;;
            *)
              echo "verdict=unknown" >>"$GITHUB_OUTPUT"
              say "**Unverified:** the post-main proof is '$INITIAL_PROOF', not an authenticated failure; escalating without authorizing a revert."
              echo "::error::post-main proof remains unverified; red-main recovery requires investigation"
              exit 1 ;;
          esac
          if [ "$INFRA" = yes ]; then
            echo "verdict=infra" >>"$GITHUB_OUTPUT"
            say "Infrastructure failure (\`$INFRA_SIGNATURE\`): reported to the infra owner, with no revert and no rerun."
            # One open issue per repository names the current infra failure,
            # commented on again for each further one: the report is visible
            # to a person, never only in this run's step summary.
            body="\`$TRUNK\` failed of INFRASTRUCTURE at \`$HEAD_SHA\` ($VERIFY_WORKFLOW, lane(s) \`${FAILED_LANES:-unknown}\`, [run]($RUN_URL)). Signature: \`$INFRA_SIGNATURE\`. Nothing was reverted: a runner or platform failure is not a code fault. The trunk stays red until the platform recovers or a person forward-fixes; if it is still red in 30 minutes the watchdog files a separate \`red-main-red-watchdog\` issue."
            for label in red-main-infra "$OWNER_LABEL"; do
              gh api --method POST "repos/$REPO/labels" -f name="$label" -f color=b60205 \
                -f description="red-main infrastructure escalation" >/dev/null 2>&1 || true
            done
            existing=$(gh api "repos/$REPO/issues?state=open&labels=red-main-infra&per_page=100" \
              --jq '[.[] | select(has("pull_request") | not)] | .[0].number // empty' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              gh api --method POST "repos/$REPO/issues/$existing/comments" --field body="$body" >/dev/null 2>&1 \
                && say "Escalated on the open infrastructure issue [#$existing](https://github.com/$REPO/issues/$existing)." \
                || say "**Blocked:** the infrastructure escalation comment was not posted (\`issues: write\`)."
            elif gh api --method POST "repos/$REPO/issues" -f title="$TRUNK failed of infrastructure (red-main)" -f body="$body" \
                -f 'labels[]=red-main-infra' -f "labels[]=$OWNER_LABEL" --jq '.number' >"$WORK_DIR/infra-issue" 2>"$WORK_DIR/infra-issue.err"; then
              say "Escalated to the infra owner: [issue #$(cat "$WORK_DIR/infra-issue")](https://github.com/$REPO/issues/$(cat "$WORK_DIR/infra-issue"))."
            else
              say "**Blocked:** the infrastructure escalation issue was not opened (\`issues: write\`): $(head -c 200 "$WORK_DIR/infra-issue.err" | tr '\n' ' ')."
              echo "::warning::the infrastructure escalation issue could not be opened"
            fi
            if [ -n "$OPS_ISSUE" ]; then
              gh api --method POST "repos/$REPO/issues/${OPS_ISSUE#\#}/comments" --field body="$body" >/dev/null 2>&1 || true
            fi
            exit 0
          fi
          echo "verdict=real" >>"$GITHUB_OUTPUT"
          say "The failure stands as red (proof \`$INITIAL_PROOF\`): acting on it as \`[ci] on_red\` says."

      # ---------------------------------------------------------------------
      # A revert needs two consecutive COMPLETED failures of the same unit:
      # the same test of a job, or the same job failing at the same step with
      # the same error lines (never the job name alone). Cancelled and
      # skipped runs are not runs: a superseded verify run neither confirms
      # nor breaks the count. The trace below then names the first-bad commit
      # across both runs' commits.
      # ---------------------------------------------------------------------
      - name: Confirm the same unit failed on two consecutive completed runs
        id: confirm
        if: steps.gate.outputs.proceed == 'true' && steps.verdict.outputs.verdict == 'real'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run-id }}
          FAILED_LANES: ${{ steps.run.outputs.failed-lanes }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          if [ -n "$(state_get units-unavailable)" ]; then
            say "**Unverified:** how the failed jobs of run $RUN_ID failed could not be read ($(state_get units-unavailable)); escalating without confirmation or revert authorization."
            echo "::error::failed-job steps and error lines unavailable"
            exit 1
          fi
          if ! created=$(gha api "repos/$REPO/actions/runs/$RUN_ID" --jq '.created_at'); then
            say "**Unverified:** current-run history metadata is unavailable; escalating without confirmation or revert authorization."
            echo "::error::confirmation metadata unavailable"
            exit 1
          fi
          if ! prev=$(python3 "$RUNNER_TEMP/red-main/proof.py" history "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$created" \
            | python3 "$RUNNER_TEMP/red-main/prev.py" "$created"); then
            say "**Unverified:** previous-run history is unavailable or invalid, not genuinely absent; escalating without confirmation."
            echo "::error::previous-run history unavailable"
            exit 1
          fi
          prev_id=""; prev_conclusion=""; prev_url=""
          if [ -n "$prev" ]; then IFS=$'\t' read -r prev_id prev_conclusion prev_url <<<"$prev"; fi
          if [ -n "$prev_id" ]; then
            prev_conclusion=$(read_proof run "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$prev_id" "$VERIFY_CHECK_NAME")
            case "$prev_conclusion" in
              success|failure|timed_out|action_required|startup_failure|ineligible) ;;
              *)
                say "**Unverified:** previous run $prev_id has unavailable proof '$prev_conclusion', not an absent prior failure; escalating without confirmation."
                echo "::error::previous-run proof unavailable"
                exit 1 ;;
            esac
          fi
          : >"$WORK_DIR/previous-failing-tests.tsv"
          if [ "$prev_conclusion" = failure ] || [ "$prev_conclusion" = timed_out ]; then
            mkdir -p "$WORK_DIR/junit-previous"
            python3 "$RUN_STORE_JUNIT" "$REPO" "$prev_id" "$WORK_DIR/junit-previous" 2>/dev/null || true
            if ! python3 "$RUNNER_TEMP/red-main/proof.py" failed-units "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$prev_id" \
                >"$WORK_DIR/previous-lane-signatures.tsv"; then
              say "**Unverified:** previous failing lanes are unavailable; escalating without confirmation."
              echo "::error::previous-run failed lanes unavailable"
              exit 1
            fi
            prev_lanes=$(cut -f1 "$WORK_DIR/previous-lane-signatures.tsv" | paste -sd, -)
            python3 "$RUNNER_TEMP/red-main/junit.py" "$WORK_DIR/junit-previous" "$WORK_DIR/previous-failing-tests.tsv" "$prev_lanes" \
              "$WORK_DIR/previous-lane-signatures.tsv" >/dev/null
          fi
          : >"$WORK_DIR/confirmed-units.tsv"
          answer=$(python3 "$RUNNER_TEMP/red-main/confirm.py" "$prev_conclusion" "$WORK_DIR/previous-failing-tests.tsv" "$WORK_DIR/failing-tests.tsv" "$WORK_DIR/confirmed-units.tsv")
          case "$answer" in
            yes\ *)
              echo "confirmed=yes" >>"$GITHUB_OUTPUT"
              say "Second consecutive completed failure${prev_url:+ (previous run $prev_url)}: ${answer#yes }. Tracing the first-bad commit." ;;
            *)
              echo "confirmed=no" >>"$GITHUB_OUTPUT"
              say "**No revert yet:** ${answer#no }. A revert waits for the same unit to fail on two consecutive completed runs; the next completed verify run on $TRUNK decides." ;;
          esac

      # ---------------------------------------------------------------------
      # Real failure: trace the culprit among the commits the verify workflow
      # never covered: one temporary branch and one verify run per candidate,
      # all dispatched at once and awaited under one shared deadline.
      # ---------------------------------------------------------------------
      - name: Trace the culprit among the unverified commits
        id: trace
        if: >-
          steps.gate.outputs.proceed == 'true' && steps.verdict.outputs.verdict == 'real'
          && steps.confirm.outputs.confirmed == 'yes'
        # The candidate deadline (at most 60 minutes) plus branch setup.
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
          RUN_ID: ${{ steps.run.outputs.run-id }}
          RUN_URL: ${{ steps.run.outputs.run-url }}
          FAILED_LANES: ${{ steps.run.outputs.failed-lanes }}
          TOKEN_MODE: ${{ steps.key.outputs.write == 'yes' && 'no' || 'yes' }}
          MODE: ${{ steps.key.outputs.mode || steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          : >"$WORK_DIR/temp-branches"
          case "$CANDIDATE_TIMEOUT_MINUTES" in
            ''|*[!0-9]*) say "**Stopped:** candidate-timeout-minutes '$CANDIDATE_TIMEOUT_MINUTES' is not a whole number of minutes."; exit 1 ;;
          esac
          if [ "$CANDIDATE_TIMEOUT_MINUTES" -lt 1 ] || [ "$CANDIDATE_TIMEOUT_MINUTES" -gt 60 ]; then
            say "**Stopped:** candidate-timeout-minutes $CANDIDATE_TIMEOUT_MINUTES is outside 1-60."
            exit 1
          fi
          # What a window (no single named culprit) becomes: one revert pull
          # request, or with revert-window false a report on its pull requests.
          if [ "$REVERT_WINDOW" = false ]; then
            window_fate="reported on their pull requests and nothing is reverted (revert-window is false)"
          else
            window_fate="reverted as one pull request"
          fi
          state_set culprit ""
          state_set window 0
          # A recording/merge_group/diagnostic success cannot be a revert
          # baseline. Optional publication failure cannot hide verified success.
          if ! base=$(python3 "$RUNNER_TEMP/red-main/proof.py" remote-base "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$HEAD_SHA" "$VERIFY_CHECK_NAME" 2>"$WORK_DIR/base.err"); then
            say "**Unverified:** the trusted revert baseline is unavailable ($(head -c 200 "$WORK_DIR/base.err" | tr '\n' ' ')); escalating with no revert authorization."
            echo "::error::trusted revert baseline unavailable"
            exit 1
          fi
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]]; then
            say "**Unverified:** no trusted baseline was found within 200 ancestors; escalating with no revert authorization."
            echo "::error::no trusted revert baseline"
            exit 1
          fi
          state_set base "$base"
          if [ "$base" = "$HEAD_SHA" ]; then
            say "**No action:** \`$HEAD_SHA\` is itself the newest passing commit, so no unverified commit is a candidate."
            exit 0
          fi
          # Per-unit baseline. A unit that newly fails inside a trunk that was
          # already red is traced from the newest earlier completed run it did
          # not fail in, not from the last fully verified commit (which can be
          # hundreds of commits back). Any doubt keeps the fully verified
          # baseline above; the lanes of the candidate runs then narrow to the
          # jobs of those units, and each candidate is judged on them alone.
          dispatch_lanes="$FAILED_LANES"
          unit_mode=no
          unit_why="no confirmed unit"
          if [ -s "$WORK_DIR/confirmed-units.tsv" ]; then
            unit_why="the run history could not be read"
            if created_at=$(gha api "repos/$REPO/actions/runs/$RUN_ID" --jq '.created_at' 2>/dev/null) \
              && unit=$(python3 "$RUNNER_TEMP/red-main/window.py" window "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$created_at" \
                "$VERIFY_CHECK_NAME" "$WORK_DIR/confirmed-units.tsv" "$WORK_DIR/target-units.tsv" 2>"$WORK_DIR/window.err"); then
              case "$unit" in
                base\ *)
                  read -r _ unit_base unit_run unit_count _ <<<"$unit"
                  unit_state=$(gh api "repos/$REPO/compare/$unit_base...$HEAD_SHA" --jq '.status' 2>/dev/null || true)
                  if [[ "$unit_base" =~ ^[a-f0-9]{40}$ && "$unit_run" =~ ^[1-9][0-9]*$ && "$unit_state" = ahead ]]; then
                    unit_mode=yes
                    dispatch_lanes=$(cut -f3 "$WORK_DIR/target-units.tsv" | sort -u | paste -sd, -)
                    state_set base-unit-run "$unit_run"
                    say "Per-unit baseline: $unit_count failing unit(s) (\`$(cut -f2 "$WORK_DIR/target-units.tsv" | head -3 | paste -sd, -)\`) last did not fail in verify run $unit_run at \`${unit_base:0:9}\`; the last fully verified commit is \`${base:0:9}\`."
                    base="$unit_base"
                    state_set base "$base"
                  else
                    unit_why="the per-unit baseline \`${unit_base:0:9}\` is not an ancestor of the failing commit"
                  fi ;;
                *) unit_why="${unit#none }" ;;
              esac
            fi
            if [ "$unit_mode" = no ]; then
              say "Per-unit baseline unavailable ($unit_why): using the last fully verified commit."
            fi
          fi
          compare=$(gh api "repos/$REPO/compare/$base...$HEAD_SHA" \
            --jq '.total_commits, (.commits[] | [.sha, (.commit.message | split("\n")[0])] | @tsv)' 2>"$WORK_DIR/compare.err") || {
            say "**No action:** the commits between \`$base\` and \`$HEAD_SHA\` could not be listed ($(head -c 200 "$WORK_DIR/compare.err" | tr '\n' ' ')); a person must decide."
            exit 0
          }
          total=$(head -1 <<<"$compare")
          rows=$(tail -n +2 <<<"$compare")
          case "$total" in
            ''|*[!0-9]*) total=$(wc -l <<<"$rows" | tr -d ' ') ;;
          esac
          state_set window "$total"
          say "Unverified commits since \`$base\`: $total."
          if [ "$total" -eq 0 ]; then
            say "**No action:** no unverified commit stands between the last passing run and this failure; the failure is not attributable to one."
            exit 0
          fi
          if [ "$total" -gt "$MAX_REVERT_COMMITS" ]; then
            say "**No action:** $total unverified commits is beyond the $MAX_REVERT_COMMITS this handler reverts; a person must decide."
            exit 0
          fi
          if [ "$MODE" = notify ]; then
            # Notify mode never pushes: no verify branch is created, so the
            # culprit is not traced and every unverified commit is listed.
            say "Mode is notify: no verify branch is pushed, so the culprit is not traced; all $total unverified commit(s) are listed."
            jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"$(cut -f1 <<<"$rows")" >"$STATE_DIR/revert-all.json"
            echo "revert-all=yes" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$total" -gt "$MAX_CANDIDATES" ]; then
            say "More than $MAX_CANDIDATES unverified commits: tracing is skipped and all of them are $window_fate."
            jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"$(cut -f1 <<<"$rows")" >"$STATE_DIR/revert-all.json"
            echo "revert-all=yes" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          dispatch() {
            local ref="$1" payload
            # return_run_details: without it the forge answers 204 with no
            # body, the run id is empty and every candidate reads as timed out.
            if [ -n "$dispatch_lanes" ] && [ -n "$LANE_INPUT" ]; then
              payload=$(jq -n --arg ref "$ref" --arg key "$LANE_INPUT" --arg value "$dispatch_lanes" \
                '{ref: $ref, inputs: {($key): $value}, return_run_details: true}')
            else
              payload=$(jq -n --arg ref "$ref" '{ref: $ref, return_run_details: true}')
            fi
            # The temporary ref was created a moment ago and the forge's ref
            # reads lag a write by seconds: it can answer 422 "No ref found"
            # for it. That one answer is retried, about 30 s in all; any
            # other failure stops at once.
            local id err attempt=1
            while :; do
              if id=$(gha api --method POST "repos/$REPO/actions/workflows/$VERIFY_WORKFLOW/dispatches" \
                   --input - <<<"$payload" --jq '.workflow_run_id // empty' 2>"$WORK_DIR/dispatch-try.err"); then
                break
              fi
              err=$(cat "$WORK_DIR/dispatch-try.err")
              if ! grep -q 'No ref found' <<<"$err" || [ "$attempt" -ge 6 ]; then
                printf '%s\n' "$err" >&2
                return 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
            case "$id" in
              ''|*[!0-9]*) echo "the dispatch returned no run id ('$id')" >&2; return 1 ;;
            esac
            printf '%s\n' "$id"
          }
          # Every candidate at once: a branch and a verify run each.
          : >"$WORK_DIR/candidates.tsv"
          declare -A run_of=() conclusion_of=() subject_of=()
          order=()
          refs_refused=no
          while IFS=$'\t' read -r sha subject; do
            [ -n "$sha" ] || continue
            candidate_branch="sylphx-verify/$sha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            # Each run attempt creates its own branch. A rejected create never
            # rewrites a branch left by an earlier trace.
            if ! gh api --method POST "repos/$REPO/git/refs" \
                 --field "ref=refs/heads/$candidate_branch" --field "sha=$sha" >/dev/null 2>"$WORK_DIR/ref.err"; then
              if [ "$TOKEN_MODE" = yes ]; then
                refs_refused=yes
              else
                say "**No action:** the temporary branch \`$candidate_branch\` could not be created ($(head -c 400 "$WORK_DIR/ref.err" | tr '\n' ' ')); a person must decide."
                exit 0
              fi
            fi
            if [ "$refs_refused" = yes ]; then break; fi
            printf '%s\n' "$candidate_branch" >>"$WORK_DIR/temp-branches"
            if ! candidate_run=$(dispatch "refs/heads/$candidate_branch" 2>"$WORK_DIR/dispatch.err"); then
              say "**No action:** $VERIFY_WORKFLOW could not be dispatched on \`${sha:0:9}\` ($(head -c 200 "$WORK_DIR/dispatch.err" | tr '\n' ' ')); a person must decide."
              exit 0
            fi
            run_of[$sha]="$candidate_run"
            subject_of[$sha]="$subject"
            order+=("$sha")
          done <<<"$rows"
          if [ "$refs_refused" = yes ]; then
            # Token mode: creating a ref needs contents: write, which a notify
            # caller does not grant. The trace is skipped and the notify
            # comment names every candidate commit instead.
            state_set blocked "contents: write"
            say "Trace skipped: creating the temporary \`sylphx-verify/<sha>-<run>-<attempt>\` branches needs contents: write, which the workflow token does not hold; the $total unverified commit(s) are reported as candidates."
            jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"$(cut -f1 <<<"$rows")" >"$STATE_DIR/revert-all.json"
            echo "revert-all=yes" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # One shared deadline; one poll per still-running run every 30 s.
          # A status read that fails is not "still running": a run that cannot
          # be read (a wrong id, a refused token) would otherwise wait out the
          # whole deadline and turn every candidate into a timeout. One failed
          # read is retried at the next poll; three in a row for the same run
          # stop the trace with the forge's answer.
          deadline=$((SECONDS + CANDIDATE_TIMEOUT_MINUTES * 60))
          pending=("${order[@]}")
          declare -A read_failures=()
          while [ "${#pending[@]}" -gt 0 ]; do
            still=()
            for sha in "${pending[@]}"; do
              status="" conclusion="" answer=""
              if answer=$(gha api "repos/$REPO/actions/runs/${run_of[$sha]}" \
                   --jq '[.status, (.conclusion // "")] | @tsv' 2>"$WORK_DIR/poll.err"); then
                IFS=$'\t' read -r status conclusion <<<"$answer" || true
              fi
              case "$status" in
                completed)
                  read_failures[$sha]=0
                  conclusion_of[$sha]="${conclusion:-unknown}" ;;
                queued|in_progress|waiting|requested|pending|action_required)
                  read_failures[$sha]=0
                  still+=("$sha") ;;
                *)
                  read_failures[$sha]=$(( ${read_failures[$sha]:-0} + 1 ))
                  if [ "${read_failures[$sha]}" -ge 3 ]; then
                    why=$(head -c 300 "$WORK_DIR/poll.err" | tr '\n' ' ')
                    say "**Stopped:** the status of candidate \`${sha:0:9}\` (verify run ${run_of[$sha]}) could not be read three times in a row (${why:-the answer had no run status: $status}); no culprit is named."
                    echo "::error::candidate run ${run_of[$sha]} status unreadable: ${why:-the answer had no run status: $status}"
                    exit 1
                  fi
                  still+=("$sha") ;;
              esac
            done
            pending=("${still[@]}")
            [ "${#pending[@]}" -gt 0 ] || break
            if [ "$SECONDS" -ge "$deadline" ]; then
              for sha in "${pending[@]}"; do conclusion_of[$sha]="timeout"; done
              break
            fi
            sleep 30
          done
          for sha in "${order[@]}"; do
            printf '%s\t%s\n' "$sha" "${conclusion_of[$sha]}" >>"$WORK_DIR/candidates.tsv"
            case "${conclusion_of[$sha]}" in
              success) say "Candidate \`${sha:0:9}\` passed." ;;
              timeout) say "Candidate \`${sha:0:9}\` had not concluded after $CANDIDATE_TIMEOUT_MINUTES minutes." ;;
              *) say "Candidate \`${sha:0:9}\` (${subject_of[$sha]}) concluded \`${conclusion_of[$sha]}\`." ;;
            esac
          done
          # A candidate that failed of infrastructure (a runner outage during
          # the trace fails every candidate) must never name a culprit.
          for sha in "${order[@]}"; do
            [ "${conclusion_of[$sha]}" = failure ] || continue
            if ! infra_verdict=$(classify_run "${run_of[$sha]}"); then
              say "**Stopped:** the jobs of candidate \`${sha:0:9}\` could not be read to classify its failure; no culprit is named."
              exit 1
            fi
            case "$infra_verdict" in
              infra\ *)
                say "**No action:** candidate \`${sha:0:9}\` failed with an infrastructure signature (\`${infra_verdict#infra }\`); a person must look, nothing is reverted."
                exit 0 ;;
            esac
          done
          # A candidate that failed is a failure of the units being traced
          # only if one of them failed in it the same way: the same test, or
          # the same job at the same step with the same error. A candidate
          # whose own failing units cannot be read, or that failed a traced
          # job some other way (which can hide the traced step), stays
          # inconclusive and never names a culprit on its own. Without a
          # per-unit baseline the traced units are the confirmed ones.
          if [ "$unit_mode" = no ]; then
            awk -F'\t' -v aggregate="$VERIFY_CHECK_NAME" 'NF == 3 && $3 != aggregate' \
              "$WORK_DIR/confirmed-units.tsv" >"$WORK_DIR/target-units.tsv" 2>/dev/null || : >"$WORK_DIR/target-units.tsv"
          fi
          if [ -s "$WORK_DIR/target-units.tsv" ]; then
            for sha in "${order[@]}"; do
              [ "${conclusion_of[$sha]}" = failure ] || continue
              candidate_dir="$WORK_DIR/junit-candidate-${run_of[$sha]}"
              mkdir -p "$candidate_dir"
              python3 "$RUN_STORE_JUNIT" "$REPO" "${run_of[$sha]}" "$candidate_dir" 2>/dev/null || true
              if ! python3 "$RUNNER_TEMP/red-main/proof.py" failed-units "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "${run_of[$sha]}" \
                  >"$WORK_DIR/candidate-signatures.tsv" 2>/dev/null; then
                conclusion_of[$sha]=inconclusive
                say "Candidate \`${sha:0:9}\` failed, but its failing jobs could not be read: inconclusive for the traced units."
                continue
              fi
              candidate_lanes=$(cut -f1 "$WORK_DIR/candidate-signatures.tsv" | paste -sd, -)
              python3 "$RUNNER_TEMP/red-main/junit.py" "$candidate_dir" "$WORK_DIR/candidate-failing.tsv" "$candidate_lanes" \
                "$WORK_DIR/candidate-signatures.tsv" >/dev/null
              judged=$(python3 "$RUNNER_TEMP/red-main/window.py" judge "$WORK_DIR/target-units.tsv" "$WORK_DIR/candidate-failing.tsv")
              case "${judged%% *}" in
                pass)
                  conclusion_of[$sha]=success
                  say "Candidate \`${sha:0:9}\` failed other units only: it counts as passed for the traced units." ;;
                inconclusive)
                  conclusion_of[$sha]=inconclusive
                  say "Candidate \`${sha:0:9}\`: ${judged#inconclusive }; inconclusive for the traced units." ;;
              esac
            done
            : >"$WORK_DIR/candidates.tsv"
            for sha in "${order[@]}"; do
              printf '%s\t%s\n' "$sha" "${conclusion_of[$sha]}" >>"$WORK_DIR/candidates.tsv"
            done
          fi
          decision=$(python3 "$RUNNER_TEMP/red-main/culprit.py" <"$WORK_DIR/candidates.tsv")
          verdict=$(head -1 <<<"$decision")
          case "$verdict" in
            culprit\ *)
              sha="${verdict#culprit }"
              state_set culprit "$sha"
              state_set culprit-subject "${subject_of[$sha]}"
              state_set culprit-run "${run_of[$sha]}"
              echo "culprit=$sha" >>"$GITHUB_OUTPUT"
              say "Candidate \`${sha:0:9}\` (${subject_of[$sha]}) failed and every older candidate passed: the culprit." ;;
            window)
              say "The oldest failing commit cannot be named with certainty ($(sed -n 's/^why //p' <<<"$decision")): all ${#order[@]} candidates are $window_fate."
              printf '%s\n' "${order[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))' >"$STATE_DIR/revert-all.json"
              echo "revert-all=yes" >>"$GITHUB_OUTPUT" ;;
            *)
              say "**No action:** every unverified candidate passed, so no single commit is the culprit." ;;
          esac

      # ---------------------------------------------------------------------
      # A fresh App token for everything after the trace. An installation
      # token lives 60 minutes and the trace alone may take 70, so the token
      # minted at the start can expire before the revert, the report or the
      # record: every step after this one uses this token. It runs even when
      # the trace failed or timed out, so the record still has live
      # credentials; a failed mint fails the job (and skips the revert)
      # rather than acting on an expired token.
      # ---------------------------------------------------------------------
      - name: Mint a fresh App token after the trace
        id: app-token-act
        if: >-
          always() && steps.gate.outputs.proceed == 'true'
          && steps.app-token.outputs.token != ''
        timeout-minutes: 5
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id || vars.SYLPHX_BUILDER_APP_ID }}
          private-key: ${{ secrets.app-private-key || secrets.SYLPHX_BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      # The Broker path needs the same fresh token: a one-hour installation
      # token minted before a long trace must be re-minted before the revert.
      - name: Mint a fresh Broker token after the trace
        id: broker-token-act
        if: >-
          always() && steps.gate.outputs.proceed == 'true'
          && steps.broker-token.outputs.token != ''
          && steps.broker-token.outputs.token != null
        timeout-minutes: 5
        uses: SylphxAI/.github/.github/actions/broker-write-token@083eff31aa012b3a24d5601abfc524ad461b2394 # main
        with:
          trust-policy: ${{ inputs.broker-trust-policy }}
          ci-name: ${{ inputs.broker-ci-name }}
          repository: ${{ github.repository }}
          soft-fail: 'true'

      # ---------------------------------------------------------------------
      # Revert (mode revert) or report (mode notify).
      # ---------------------------------------------------------------------
      - name: Revert the culprit or report it
        id: revert
        if: >-
          steps.gate.outputs.proceed == 'true' && steps.verdict.outputs.verdict == 'real'
          && steps.confirm.outputs.confirmed == 'yes'
          && (steps.trace.outputs.culprit != '' || steps.trace.outputs.revert-all != '')
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ steps.app-token-act.outputs.token || steps.broker-token-act.outputs.token || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug || steps.broker-token.outputs.app-slug }}
          APP_ID: ${{ inputs.app-id || vars.SYLPHX_BUILDER_APP_ID }}
          MODE: ${{ steps.key.outputs.mode || steps.gate.outputs.mode }}
          OWNER_LABEL: ${{ steps.gate.outputs.owner-label }}
          MIGRATION_PATHS: ${{ steps.gate.outputs.migration-paths }}
          HOLD_UTC: ${{ steps.gate.outputs.hold-utc }}
          TOKEN_MODE: ${{ steps.key.outputs.write == 'yes' && 'no' || 'yes' }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
          SHORT_SHA: ${{ steps.run.outputs.short-sha }}
          RUN_URL: ${{ steps.run.outputs.run-url }}
          FAILED_LANES: ${{ steps.run.outputs.failed-lanes }}
          PROTECTED_LABELS: ${{ inputs.protected-labels }}
          PROTECTED_PRS: ${{ inputs.protected-prs }}
          OPS_ISSUE: ${{ inputs.ops-issue }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          . "$RUNNER_TEMP/red-main/lib.sh"
          # Destructive handling needs a current authenticated failure and a
          # baseline supplied only by the authenticated ancestor selector.
          case "$(state_get proof-verdict)" in
            failure|timed_out|action_required|startup_failure) ;;
            *) say "**Unverified:** no authenticated post-main failure authorizes this revert."; exit 1 ;;
          esac
          newest=$(read_proof sha "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$HEAD_SHA" "$VERIFY_CHECK_NAME")
          case "$newest" in
            success) say "The newest approved same-SHA producer has authenticated success; no revert."; exit 0 ;;
            failure|timed_out|action_required|startup_failure) ;;
            *) say "**Unverified:** the newest approved same-SHA producer has proof '$newest'; escalating without revert authorization."; exit 1 ;;
          esac
          base=$(state_get base)
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]]; then
            say "**Unverified:** no trusted baseline authorizes this revert."
            exit 1
          fi
          # A per-unit baseline is a commit whose verify run cleared the traced
          # units while other lanes were red, so it has no `verified` success
          # to re-read; the trace admitted it from authenticated run history.
          if [ -z "$(state_get base-unit-run)" ]; then
            base_proof=$(read_proof sha "$REPO" "$TRUNK" "$VERIFY_WORKFLOW" "$base" "$VERIFY_CHECK_NAME")
            [ "$base_proof" = success ] || { say "**Unverified:** the baseline no longer has authenticated success; no revert authorization."; exit 1; }
          fi
          culprit=$(state_get culprit)
          revert_all=$(cat "$STATE_DIR/revert-all.json" 2>/dev/null || true)
          if [ -z "$culprit" ] && [ -z "$revert_all" ]; then
            say "**No action:** the trace named no culprit, so no revert pull request was opened."
            exit 0
          fi
          if [ -n "$culprit" ]; then
            shas=("$culprit")
            subject=$(state_get culprit-subject)
          else
            mapfile -t shas < <(jq -r '.[]' <<<"$revert_all")
            subject=""
          fi
          count=${#shas[@]}
          first=${shas[0]}
          last=${shas[$((count - 1))]}
          if [ "$count" -eq 1 ]; then
            title="revert: ${subject:-revert} (${first:0:9})"
          else
            title="revert: $count commits (${first:0:9}..${last:0:9})"
          fi
          # revert-window false: only a traced culprit is reverted. A window
          # (no single culprit named) takes the notify path below.
          not_reverted="this repository is in notify mode or holds no builder App key"
          if [ -z "$culprit" ] && [ "$REVERT_WINDOW" = false ]; then
            not_reverted="no single culprit was named and this repository reverts only a traced culprit (revert-window: false)"
            say "No single culprit was named: the $count unverified commit(s) are reported, nothing is reverted (revert-window is false)."
            MODE=notify
          fi
          if [ "$MODE" != "revert" ] && [ "$MODE" != "revert_pr_unarmed" ]; then
            say "Mode is notify: no revert pull request was opened. \`revert\` would revert $count commit(s):"
            for sha in "${shas[@]}"; do say "- \`$sha\`"; done
            if true; then
              # Token mode: tell the authors, on the pull request each
              # candidate landed through, what failed and what is suspected.
              if [ -n "$culprit" ]; then
                verdict_line="The trace names this commit as the culprit: it failed and every older unverified commit passed."
              else
                verdict_line="This commit is among the unverified commits that may have broken it."
              fi
              candidates=""
              for sha in "${shas[@]}"; do candidates="$candidates- \`$sha\`"$'\n'; done
              body="\`$TRUNK\` went red at \`$HEAD_SHA\`: $VERIFY_WORKFLOW failed in lane(s) \`${FAILED_LANES:-unknown}\` ([run]($RUN_URL)). $verdict_line"$'\n\n'"Candidate commit(s):"$'\n'"$candidates"$'\n'"Nothing was reverted: $not_reverted, so a person decides."
              : >"$WORK_DIR/notified"
              for sha in "${shas[@]}"; do
                pr=$(commit_prs "$sha" '.[0].number // empty')
                [ -n "$pr" ] || continue
                if grep -qxF "$pr" "$WORK_DIR/notified"; then continue; fi
                printf '%s\n' "$pr" >>"$WORK_DIR/notified"
                if gh api --method POST "repos/$REPO/issues/$pr/comments" --field body="$body" >/dev/null 2>"$WORK_DIR/comment.err"; then
                  say "Commented on pull request #$pr."
                else
                  write_refused "$(cat "$WORK_DIR/comment.err")" "pull requests: write" "commenting on pull request #$pr" || true
                  say "The comment on pull request #$pr was not posted."
                fi
              done
            fi
            exit 0
          fi
          # A live-outage or P0 fix, or a pull request on the never-revert list,
          # is left to a person: comment on it and on the ops issue instead.
          protected=""
          for sha in "${shas[@]}"; do
            pr_json=$(commit_prs "$sha" '.[0] | {number: (.number // 0), labels: [(.labels // [])[].name]}')
            [ -n "$pr_json" ] || continue
            verdict=$(python3 "$RUNNER_TEMP/red-main/revert-guard.py" <<<"$pr_json")
            case "$verdict" in
              protected*)
                pr=$(jq -r '.number' <<<"$pr_json")
                protected="$protected$pr "
                note="\`$TRUNK\` went red at \`$HEAD_SHA\` ($VERIFY_WORKFLOW, lane(s) \`${FAILED_LANES:-unknown}\`, [run]($RUN_URL)) and \`$sha\` from this pull request is a candidate. It is not reverted automatically (${verdict#protected: }): a person decides."
                gh api --method POST "repos/$REPO/issues/$pr/comments" --field body="$note" >/dev/null 2>&1 || true
                if [ -n "$OPS_ISSUE" ]; then
                  gh api --method POST "repos/$REPO/issues/$OPS_ISSUE/comments" --field body="$note" >/dev/null 2>&1 || true
                fi
                ;;
            esac
          done
          if [ -n "$protected" ]; then
            say "**No revert:** protected pull request(s) among the candidates (${protected% }); commented for a person to decide."
            exit 0
          fi
          # A deploy freeze: inside the configured window a revert is opened
          # but not armed, whatever on_red says.
          if [ "$MODE" = revert ] && [ "$(python3 "$RUNNER_TEMP/red-main/hold.py" "${HOLD_UTC:-}" "$(date -u +%H:%M)")" = in ]; then
            say "Inside the deploy freeze (\`$HOLD_UTC\` UTC): the revert is opened but not armed."
            MODE=revert_pr_unarmed
          fi
          require_grant contents "contents: write" "opening the revert pull request" || {
            say "**Blocked:** the App installation cannot push; the revert pull request was not opened."
            exit 1
          }
          require_grant pull-requests "pull requests: write" "opening the revert pull request" || {
            say "**Blocked:** the App installation cannot open pull requests; the revert pull request was not opened."
            exit 1
          }
          # Unarmed mode: the revert waits for a person, and every later push
          # to main re-runs this handler. Key the silence on the CULPRIT, not on
          # the red head: an open auto-revert pull request that already names
          # this culprit gets a comment and nothing else. A different culprit
          # still opens its own revert and alert.
          if [ "$MODE" = revert_pr_unarmed ]; then
            open_prs=$(gh pr list --repo "$REPO" --state open --label auto-revert --json number,body,author,isCrossRepository --limit 100 2>/dev/null || echo '[]')
            open_prs_by_branch=$(gh pr list --repo "$REPO" --state open --search "head:auto-revert/" --json number,body,headRefName,author,isCrossRepository --limit 100 2>/dev/null || echo '[]')
            # Only the handler's own pull requests count: same repository, and
            # authored by the builder App. A fork or collaborator pull request
            # with the culprit sha in its body must not silence the real revert.
            standing=$(jq -rn --arg sha "$first" --arg slug "$APP_SLUG" --argjson a "$open_prs" --argjson b "$open_prs_by_branch" \
              '[($a + $b)[]
                | select(.isCrossRepository == false and (.author.is_bot // false)
                    and (.author.login == ("app/" + $slug) or .author.login == ($slug + "[bot]")))
                | select((.body // "") | contains($sha))] | .[0].number // empty')
            if [ -n "$standing" ]; then
              gh api --method POST "repos/$REPO/issues/$standing/comments" \
                --field body="\`$TRUNK\` is still red at \`$HEAD_SHA\` ([run]($RUN_URL)) for the same culprit \`$first\`. This revert stays open and unarmed; a person decides." \
                >/dev/null 2>&1 || true
              say "An open revert pull request (#$standing) already names culprit \`$first\`; commented there and stopped."
              exit 0
            fi
          fi
          branch="auto-revert/$SHORT_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          repo_dir="$WORK_DIR/repo"
          window=$(state_get window)
          case "$window" in ''|*[!0-9]*) window=0 ;; esac
          depth=$((window + 20))
          mkdir -p "$repo_dir"
          git_c init --quiet "$repo_dir"
          cd "$repo_dir"
          git_c remote add origin "https://github.com/$REPO.git" 2>/dev/null || git_c remote set-url origin "https://github.com/$REPO.git"
          git_c fetch --quiet --depth="$depth" origin "$TRUNK"
          git_c checkout --quiet -B "$TRUNK" FETCH_HEAD
          bot_identity
          # Rule 1: never auto-revert a commit that adds or changes migrations.
          # A reverted migration can leave the schema and the code apart, so a
          # person forward-fixes. The diff is computed locally against the
          # first parent with renames split into both paths, so a file moved
          # out of a migration directory still counts. A commit with no
          # changed file, or one whose diff cannot be read, is a hold too.
          : >"$WORK_DIR/changed-files.txt"
          files_ok=yes
          for sha in "${shas[@]}"; do
            if ! git_c diff --no-renames --name-only -z "$sha^1" "$sha" >"$WORK_DIR/one-commit.z" 2>/dev/null; then
              files_ok=no
              continue
            fi
            tr '\0' '\n' <"$WORK_DIR/one-commit.z" >"$WORK_DIR/one-commit.txt"
            [ -s "$WORK_DIR/one-commit.txt" ] || files_ok=no
            cat "$WORK_DIR/one-commit.txt" >>"$WORK_DIR/changed-files.txt"
          done
          migration=$(python3 "$RUNNER_TEMP/red-main/migration.py" "${MIGRATION_PATHS:-**/migrations/**,**/migrate/**,**/atlas.sum,**/drizzle/**,**/prisma/migrations/**}" <"$WORK_DIR/changed-files.txt")
          if [ "$files_ok" = no ] || [ "${migration%% *}" = migration ]; then
            why="its changed files could not be read, or it changed none"
            if [ "${migration%% *}" = migration ]; then
              matched=$(printf '%s' "${migration#migration }" | tr -d '\140@')
              why="it changes a migration path (\`$matched\`)"
            fi
            for label in red-main-migration-hold "$OWNER_LABEL"; do
              gh api --method POST "repos/$REPO/labels" -f name="$label" -f color=b60205 \
                -f description="red-main handler alert" >/dev/null 2>&1 || true
            done
            prs=""
            for sha in "${shas[@]}"; do
              pr=$(commit_prs "$sha" '.[0].number // empty')
              [ -z "$pr" ] || prs="$prs #$pr"
            done
            hold_body="\`$TRUNK\` is red at \`$HEAD_SHA\` ($VERIFY_WORKFLOW, lane(s) \`${FAILED_LANES:-unknown}\`, [run]($RUN_URL)). Culprit \`$first\`${prs:+ (pull request$prs)} was NOT reverted: $why. Forward-fix it; the handler will not revert a migration. Owner: $OWNER_LABEL."
            existing=$(gh api "repos/$REPO/issues?state=open&labels=red-main-migration-hold&per_page=100" \
              --jq "[.[] | select(has(\"pull_request\") | not) | select(.user.login == (\"$APP_SLUG\" + \"[bot]\")) | select((.body // \"\") | contains(\"$first\"))] | .[0].number // empty" 2>/dev/null || true)
            if [ -z "$existing" ]; then
              gh api --method POST "repos/$REPO/issues" -f title="$TRUNK is red: migration culprit ${first:0:9} needs a forward-fix" -f body="$hold_body" \
                -f 'labels[]=red-main-migration-hold' -f "labels[]=$OWNER_LABEL" >/dev/null 2>&1 \
                || say "**Blocked:** the migration-hold issue was not opened (issues: write)."
              # Told once: the issue is the record; later red pushes for the
              # same culprit do not repeat the comments.
              if [ -n "$OPS_ISSUE" ]; then
                gh api --method POST "repos/$REPO/issues/${OPS_ISSUE#\#}/comments" --field body="$hold_body" >/dev/null 2>&1 || true
              fi
              for pr in $prs; do
                gh api --method POST "repos/$REPO/issues/${pr#\#}/comments" --field body="$hold_body" >/dev/null 2>&1 || true
              done
            fi
            say "**No revert (migration hold):** $why. An issue labelled \`red-main-migration-hold\` and \`$OWNER_LABEL\` names the culprit; a person forward-fixes."
            exit 0
          fi
          if ! git_c revert --no-edit "${shas[@]}" 2>"$WORK_DIR/revert.err"; then
            git_c revert --abort >/dev/null 2>&1 || true
            say "**No action:** the revert conflicts with $TRUNK ($(head -c 200 "$WORK_DIR/revert.err" | tr '\n' ' ')); a person must decide."
            exit 0
          fi
          # A new run attempt opens a new branch and pull request. A rejected
          # push preserves the remote branch and stops this attempt.
          if ! push_branch "$branch" 2>"$WORK_DIR/push.err"; then
            write_refused "$(cat "$WORK_DIR/push.err")" "contents: write" "pushing $branch" || true
            say "**Blocked:** the revert branch could not be pushed; no pull request."
            exit 1
          fi
          original=""
          original_number=""
          if [ "$count" -eq 1 ]; then
            original=$(commit_prs "$first" '.[0] | "#\(.number) \(.title)"')
            original_number=$(commit_prs "$first" '.[0].number // empty')
          fi
          {
            printf '%s\n' "The verify workflow failed on \`$TRUNK\` at \`$HEAD_SHA\` in lane(s) \`${FAILED_LANES:-unknown}\`."
            printf '%s\n' ""
            printf '%s\n' "- verify run: $RUN_URL"
            if [ -n "$original" ]; then printf '%s\n' "- original pull request: $original"; fi
            printf '%s\n' "- the commit is in the unverified window since the last passing $VERIFY_WORKFLOW run, and this prefix of the window reproduced the failure"
            printf '%s\n' ""
            printf '%s\n' "| reverted commit |"
            printf '%s\n' "| --- |"
            for sha in "${shas[@]}"; do printf "| \`%s\` |\n" "$sha"; done
            printf '%s\n' ""
            printf '%s\n' "This revert was opened automatically; the change can be re-landed once fixed."
          } >"$WORK_DIR/revert-body.md"
          payload=$(jq -n --arg title "$title" --arg head "$branch" --arg base "$TRUNK" \
            --arg body "$(cat "$WORK_DIR/revert-body.md")" \
            '{title: $title, head: $head, base: $base, body: $body, draft: false}')
          if ! number=$(gh api --method POST "repos/$REPO/pulls" --input - <<<"$payload" --jq '.number' 2>"$WORK_DIR/pr.err"); then
            write_refused "$(cat "$WORK_DIR/pr.err")" "pull requests: write" "opening the revert pull request" || true
            say "**Blocked:** the revert pull request was not opened."
            exit 1
          fi
          if [ "$MODE" = revert_pr_unarmed ]; then
            # No queue-jump label: nothing here jumps or arms anything.
            labels=$(labels_that_exist auto-revert owner:ci)
          else
            labels=$(labels_that_exist "queue-jump:red-main" auto-revert owner:ci)
          fi
          if [ "$labels" != "[]" ]; then
            gh api --method POST "repos/$REPO/issues/$number/labels" \
              --input - <<<"$(jq -n --argjson labels "$labels" '{labels: $labels}')" >/dev/null || true
          fi
          if [ "$MODE" = revert_pr_unarmed ]; then
            state_set revert-pr "$number"
            say "Revert pull request [#$number](https://github.com/$REPO/pull/$number) is open and NOT armed (\`on_red = revert_pr_unarmed\`): a person decides whether and when it merges."
            alert_body="\`$TRUNK\` is red at \`$HEAD_SHA\` ($VERIFY_WORKFLOW, lane(s) \`${FAILED_LANES:-unknown}\`, [run]($RUN_URL)). Culprit: \`$first\`. A revert pull request, #$number, is open and not armed: it will not merge until a person decides. Merge it, or fix forward."
            for label in red-main-revert-pending "$OWNER_LABEL"; do
              gh api --method POST "repos/$REPO/labels" -f name="$label" -f color=b60205 \
                -f description="red-main handler alert" >/dev/null 2>&1 || true
            done
            # One issue per culprit: an open alert naming THIS culprit silences a
            # repeat; a different culprit still alerts.
            existing=$(gh api "repos/$REPO/issues?state=open&labels=red-main-revert-pending&per_page=100" \
              --jq "[.[] | select(has(\"pull_request\") | not) | select(.user.login == (\"$APP_SLUG\" + \"[bot]\")) | select((.body // \"\") | contains(\"$first\"))] | .[0].number // empty" 2>/dev/null || true)
            if [ -n "$existing" ]; then
              say "An alert for culprit \`$first\` is already open (#$existing)."
            else
              gh api --method POST "repos/$REPO/issues" -f title="$TRUNK is red: revert #$number awaits a decision" -f body="$alert_body" \
                -f 'labels[]=red-main-revert-pending' -f "labels[]=$OWNER_LABEL" >/dev/null 2>&1 \
                || say "**Blocked:** the alert issue was not opened (issues: write)."
            fi
            if [ -n "$original_number" ]; then
              gh api --method POST "repos/$REPO/issues/$original_number/comments" \
                --field body="\`$TRUNK\` went red after this merged ([run]($RUN_URL)). A revert pull request, #$number, is open and not armed; a person decides." \
                >/dev/null 2>&1 || true
            fi
            if [ -n "$OPS_ISSUE" ]; then
              gh api --method POST "repos/$REPO/issues/${OPS_ISSUE#\#}/comments" --field body="$alert_body" >/dev/null 2>&1 || true
            fi
            exit 0
          fi
          if gh pr merge --auto "$number" --repo "$REPO" </dev/null >/dev/null 2>"$WORK_DIR/auto.err"; then
            say "Revert pull request [#$number](https://github.com/$REPO/pull/$number) is armed for auto-merge (no strategy flag: the queue decides)."
          else
            say "Revert pull request [#$number](https://github.com/$REPO/pull/$number) is open; auto-merge was not armed: $(head -c 200 "$WORK_DIR/auto.err" | tr '\n' ' ')"
          fi
          state_set revert-pr "$number"
          # --- The jump ------------------------------------------------------
          # `main` is red and blocks the whole queue, one of the runbook's
          # sanctioned jump cases. One jump per 30 minutes across the
          # repository, decided from the pull requests themselves, so a
          # restarted handler cannot lose the window.
          owner=${REPO%%/*}
          name=${REPO##*/}
          queue_state() {
            gh api graphql \
              -f query="query(\$owner:String!,\$name:String!,\$n:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$n){isInMergeQueue mergeQueueEntry{position state}}}}" \
              -f owner="$owner" -f name="$name" -F n="$number" \
              --jq '[.data.repository.pullRequest.isInMergeQueue, (.data.repository.pullRequest.mergeQueueEntry.position // -1)] | @tsv'
          }
          jump_mutation() {
            gh api graphql -f query="$1" -f id="$2" --jq "$3"
          }
          since=$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(minutes=30)).strftime("%Y-%m-%dT%H:%M:%SZ"))')
          others=0
          for label in "queue-jump:red-main" auto-revert; do
            count=$(gh pr list --repo "$REPO" --state all --label "$label" --search "updated:>=$since" \
              --json number --jq "map(select(.number != $number)) | length" 2>/dev/null) || count=unknown
            case "$count" in
              ''|*[!0-9]*) others=$((others + 1)) ;;
              *) others=$((others + count)) ;;
            esac
          done
          if [ "$others" -gt 0 ]; then
            say "Did not jump: another pull request labelled \`queue-jump:red-main\` or \`auto-revert\` moved inside the last 30 minutes, or that window could not be read; the revert waits its turn with auto-merge armed."
            gh api --method POST "repos/$REPO/issues/$number/comments" \
              --field body="The red-main handler did not jump this revert: another pull request moved inside the last 30 minutes, and one jump in 30 minutes is the rule. Auto-merge stays armed." \
              >/dev/null 2>&1 || true
          else
            node_id=$(gh api "repos/$REPO/pulls/$number" --jq '.node_id' 2>/dev/null || true)
            if [ -z "$node_id" ]; then
              say "**Blocked:** the pull request's node id could not be read, so the jump was not attempted; auto-merge stays armed."
            else
              jump=yes
              IFS=$'\t' read -r queued position <<<"$(queue_state 2>"$WORK_DIR/jump.err")" || true
              if [ -z "${queued:-}" ]; then
                # A read that fails is not proof of an empty queue: name the
                # permission and leave the enqueue to auto-merge.
                write_refused "$(cat "$WORK_DIR/jump.err")" "pull requests: write" "reading the merge-queue entry" || true
                say "**Blocked:** the merge-queue state could not be read, so the jump was not attempted; auto-merge stays armed."
                jump=no
              fi
              if [ "$jump" = "yes" ] && [ "$queued" = "true" ]; then
                entry_id=$(gh api graphql \
                  -f query="query(\$owner:String!,\$name:String!,\$n:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$n){mergeQueueEntry{id}}}}" \
                  -f owner="$owner" -f name="$name" -F n="$number" \
                  --jq '.data.repository.pullRequest.mergeQueueEntry.id // empty' 2>/dev/null || true)
                if [ -n "$entry_id" ]; then
                  if jump_mutation "mutation(\$id:ID!){dequeuePullRequest(input:{id:\$id}){pullRequest{number}}}" \
                       "$entry_id" '.data.dequeuePullRequest.pullRequest.number' >/dev/null 2>"$WORK_DIR/jump.err"; then
                    sleep 15
                  else
                    write_refused "$(cat "$WORK_DIR/jump.err")" "pull requests: write" "the dequeue before the jump" || true
                    say "**Blocked:** the queue entry could not be dequeued first, so the jump was not attempted; auto-merge stays armed."
                    jump=no
                  fi
                fi
              fi
              if [ "$jump" = "yes" ]; then
                if jump_mutation "mutation(\$id:ID!){enqueuePullRequest(input:{pullRequestId:\$id,jump:true}){mergeQueueEntry{position state}}}" \
                     "$node_id" '.data.enqueuePullRequest.mergeQueueEntry.position' >"$WORK_DIR/jump.out" 2>"$WORK_DIR/jump.err"; then
                  # A jumped entry can sit at the tail for up to a minute
                  # before it moves to the front, so the position is read
                  # twice before it is reported.
                  sleep 60
                  IFS=$'\t' read -r queued position <<<"$(queue_state 2>/dev/null)" || true
                  if [ "${position:--1}" = "-1" ]; then
                    sleep 60
                    IFS=$'\t' read -r queued position <<<"$(queue_state 2>/dev/null)" || true
                  fi
                  say "The red-main handler jumped the revert to the front of the merge queue under the red-\`$TRUNK\` rule (queue position ${position:--1})."
                else
                  write_refused "$(cat "$WORK_DIR/jump.err")" "pull requests: write" "the jump" || true
                  say "**Blocked:** the jump was refused, so the revert waits its turn; auto-merge stays armed."
                fi
              fi
            fi
          fi
          if [ -n "$original_number" ]; then
            gh api --method POST "repos/$REPO/issues/$original_number/comments" \
              --field body="\`$TRUNK\` went red after this merged: $VERIFY_WORKFLOW failed in lane(s) \`${FAILED_LANES:-unknown}\` ([run]($RUN_URL)). Reverted in #$number; the change can be re-landed once fixed." \
              >/dev/null 2>&1 || say "The comment on the original pull request could not be posted."
          fi
          # Rule 4: every auto-revert tells the owner and the ops issue (sha,
          # pull request, failing job, run link) and files the follow-up that
          # re-lands the change (a merged pull request cannot be reopened).
          notice="Auto-revert #$number of \`$first\`${original_number:+ (original pull request #$original_number)}: $VERIFY_WORKFLOW failed in lane(s) \`${FAILED_LANES:-unknown}\` at \`$HEAD_SHA\` ([run]($RUN_URL)). Owner: $OWNER_LABEL."
          gh api --method POST "repos/$REPO/labels" -f name="$OWNER_LABEL" -f color=b60205 \
            -f description="red-main handler alert" >/dev/null 2>&1 || true
          gh api --method POST "repos/$REPO/issues" -f title="re-land after auto-revert #$number (${first:0:9})" \
            -f body="$notice Re-land the change once the failure is fixed." -f "labels[]=$OWNER_LABEL" >/dev/null 2>&1 \
            || say "The follow-up issue was not opened."
          if [ -n "$OPS_ISSUE" ]; then
            gh api --method POST "repos/$REPO/issues/${OPS_ISSUE#\#}/comments" --field body="$notice" >/dev/null 2>&1 || true
          fi

      # ---------------------------------------------------------------------
      # One record, always. The comment is the audit trail; the step summary
      # carries it even when the installation cannot comment yet.
      # ---------------------------------------------------------------------
      - name: Record what the handler did
        if: >-
          always() && steps.gate.outputs.proceed == 'true'
          && (steps.helpers.outcome == 'success' || steps.helpers.outcome == 'failure')
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token-act.outputs.token || steps.broker-token-act.outputs.token || steps.app-token.outputs.token || steps.broker-token.outputs.token || github.token }}
          MODE: ${{ steps.key.outputs.mode || steps.gate.outputs.mode }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/red-main/lib.sh" ]; then
            echo "the handler stopped before its helpers were ready"
            exit 0
          fi
          . "$RUNNER_TEMP/red-main/lib.sh"
          if [ -s "$WORK_DIR/temp-branches" ]; then
            while IFS= read -r branch; do
              [ -n "$branch" ] || continue
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1 \
                || echo "the temporary branch $branch is still on the remote"
            done <"$WORK_DIR/temp-branches"
          fi
          {
            echo "### Red main handler on $REPO"
            echo
            echo "Mode: \`$MODE\`. Verify workflow: \`$VERIFY_WORKFLOW\`."
            echo
            if [ -s "$WORK_DIR/summary.md" ]; then cat "$WORK_DIR/summary.md"; else echo "The handler recorded no step."; fi
            if [ "$(state_get token-mode)" = yes ]; then
              echo
              echo "**Token mode (no builder App key).** The revert pull request was not opened: a pull request opened with GITHUB_TOKEN triggers no CI and could never pass the merge queue. A person must:"
              echo "- for a real failure, revert the candidate commit(s) above through a normal pull request;"
              echo "- or give this repository the builder App key so the handler can do it."
            fi
            if [ -n "$(state_get blocked)" ]; then
              echo
              echo "**Blocked by a missing App grant:** $(state_get blocked). The write it names did not happen."
            fi
            if [ -n "$(state_get culprit)" ]; then
              echo
              echo "Culprit commit: \`$(state_get culprit)\`"
            fi
            if [ -n "$(state_get revert-pr)" ]; then
              echo
              echo "Revert pull request: #$(state_get revert-pr)"
            fi
          } >"$WORK_DIR/final.md"
          cat "$WORK_DIR/final.md" >>"$GITHUB_STEP_SUMMARY"
          if [ -f "$STATE_DIR/quiet" ]; then
            echo "no comment: $(cat "$STATE_DIR/quiet")"
            exit 0
          fi
          [ -n "$HEAD_SHA" ] || { echo "no commit to comment on"; exit 0; }
          if gh api --method POST "repos/$REPO/commits/$HEAD_SHA/comments" \
               --field body="$(cat "$WORK_DIR/final.md")" >/dev/null 2>"$WORK_DIR/comment.err"; then
            echo "commented on $HEAD_SHA"
          else
            echo "::warning::the summary comment was not posted: $GRANT_HOLDER needs contents: write. The record is in this run's step summary."
            echo "the comment was not posted: $(head -c 300 "$WORK_DIR/comment.err" | tr '\n' ' ')"
          fi

      # ---------------------------------------------------------------------
      # The handler itself failed: page. One open issue labelled
      # `red-main-broken` + `owner:ops` per repository, commented on again for
      # each further failure, so a broken handler is never silent (it failed
      # 7+ times unseen on 2026-09-29). Runs on the caller's workflow token,
      # which every caller grants `issues: write`.
      # ---------------------------------------------------------------------
      - name: Alert that the red-main handler itself failed
        if: failure()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_URL: ${{ github.event.workflow_run.html_url || '' }}
          OWNER_LABEL: ${{ steps.gate.outputs.owner-label || 'owner:ops' }}
        run: |
          set -uo pipefail
          for label in red-main-broken "$OWNER_LABEL"; do
            gh api --method POST "repos/$REPO/labels" -f name="$label" -f color=b60205 \
              -f description="red-main handler alert" >/dev/null 2>&1 || true
          done
          body="The red-main handler failed on \`$REPO\`: $RUN_URL${TRIGGER_URL:+ (verify run: $TRIGGER_URL)}. A red \`$TRUNK\` may not be healing itself. Open the run, read the failed step, fix the cause (a missing App grant, an API error, or a handler bug), then close this issue."
          existing=$(gh api "repos/$REPO/issues?state=open&labels=red-main-broken&per_page=1" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api --method POST "repos/$REPO/issues/$existing/comments" -f body="$body" >/dev/null \
              && echo "commented on #$existing" || echo "::warning::the alert comment on #$existing was not posted"
          else
            gh api --method POST "repos/$REPO/issues" -f title="red-main handler failed" -f body="$body" \
              -f 'labels[]=red-main-broken' -f "labels[]=$OWNER_LABEL" >/dev/null \
              && echo "alert issue opened" || echo "::warning::the alert issue was not opened (the caller needs issues: write)"
          fi
