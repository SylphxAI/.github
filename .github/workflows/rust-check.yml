name: Rust check

# One remote `cargo check` for any repository, run on the ordinary Sylphx
# runner class at the priority of a ready pull request (never the merge gate),
# with the org's own sccache. A caller keeps a thin workflow_dispatch
# workflow and passes the inputs through; `sylphx build check` dispatches that
# caller and follows it (docs/rust-check.md).
#
# Trust boundary: caller inputs never reach a shell body. `packages`, `ref`
# and `workspace` travel through `env:` and are validated against a strict
# pattern before use.
#
# The step log carries three markers the CLI reads:
#   @@sylphx-check-begin   cargo output starts after this line
#   @@sylphx-check-end     cargo output ends before this line
#   @@sylphx-check-exit=N   cargo's exit status

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to check out.
        required: true
        type: string
      packages:
        description: Space-separated Cargo package names; empty checks the whole workspace.
        required: false
        type: string
        default: ''
      tests:
        description: Also check test targets (`--tests`).
        required: false
        type: boolean
        default: false
      workspace:
        description: Directory of the Cargo workspace, relative to the repository root.
        required: false
        type: string
        default: '.'
      git-deps:
        description: >
          Private git dependencies Cargo fetches, one OWNER/REPO per line. For
          each owner a read-only token for exactly those repositories is minted
          from the caller's own GitHub App (GIT_DEPS_APP_ID / GIT_DEPS_APP_KEY),
          and git fetches them through it. Empty: public dependencies only.
        required: false
        type: string
        default: ''
    secrets:
      GIT_DEPS_APP_ID:
        description: Id of the caller's own reader App, installed on the owners in git-deps.
        required: false
      GIT_DEPS_APP_KEY:
        description: That App's private key.
        required: false
      SYLPHX_CI_CACHE_ACCESS_KEY:
        description: >
          The organization's own cache user, used only on a runner without the
          per-org credential the platform injects. Optional.
        required: false
      SYLPHX_CI_CACHE_SECRET_KEY:
        description: Its secret key.
        required: false
      # Ignored, and declared only so a caller that still passes them does not
      # fail: the platform's ci-sccache key is never a repository's cache.
      RGW_S3_ACCESS_KEY:
        description: Ignored.
        required: false
      RGW_S3_SECRET_KEY:
        description: Ignored.
        required: false

permissions:
  contents: read

jobs:
  check:
    name: cargo check
    # id-token: the compile cache (BuildCache) knows the job by its GitHub OIDC
    # identity. Without it the cache action falls back to the static secrets,
    # then the Actions cache. The caller's job must grant it too.
    permissions:
      contents: read
      id-token: write
    runs-on: sylphx-linux-standard
    timeout-minutes: 45
    env:
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      SCCACHE_IDLE_TIMEOUT: '0'
      IN_REF: ${{ inputs.ref }}
      IN_PACKAGES: ${{ inputs.packages }}
      IN_TESTS: ${{ inputs.tests }}
      IN_WORKSPACE: ${{ inputs.workspace }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$IN_REF" =~ ^[A-Za-z0-9._/@+-]{1,200}$ && "$IN_REF" != -* ]] || { echo "bad ref"; exit 2; }
          [[ "$IN_PACKAGES" =~ ^[A-Za-z0-9_.\ -]*$ ]] || { echo "bad packages"; exit 2; }
          [[ "$IN_WORKSPACE" =~ ^[A-Za-z0-9_./-]{1,200}$ && "$IN_WORKSPACE" != /* && "$IN_WORKSPACE" != *..* ]] || { echo "bad workspace"; exit 2; }
          if [ ! -w "${HOME:-/}" ] || [ "${HOME:-/root}" = /root ]; then
            mkdir -p "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 10
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-home" RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          mkdir -p "$CARGO_HOME/bin" "$RUSTUP_HOME"
          { echo "CARGO_HOME=$CARGO_HOME"; echo "RUSTUP_HOME=$RUSTUP_HOME"; } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -sSfL https://sh.rustup.rs \
            | sh -s -- --default-toolchain none --profile minimal -y --no-modify-path
          cd "$IN_WORKSPACE"
          # The repository's pinned toolchain when it has one (the workspace or
          # any parent up to the checkout), else stable. A repository without a
          # toolchain file used to fail here: "no default is configured".
          pinned=""
          dir="$PWD"
          while :; do
            for f in rust-toolchain.toml rust-toolchain; do
              [ -f "$dir/$f" ] && { pinned="$dir/$f"; break 2; }
            done
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir="$(dirname "$dir")"
          done
          if [ -n "$pinned" ]; then
            echo "toolchain from $pinned"
            rustup toolchain install
            rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          else
            echo "no rust-toolchain file: stable"
            rustup default stable
          fi
          # cargo check itself needs no component; clippy is added so a caller's
          # later lint step finds it on the same toolchain.
          rustup component add clippy
          cargo --version
      - name: Private git dependencies
        if: inputs.git-deps != ''
        env:
          GIT_DEPS: ${{ inputs.git-deps }}
          APP_ID: ${{ secrets.GIT_DEPS_APP_ID }}
          APP_KEY: ${{ secrets.GIT_DEPS_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::git-deps is set but GIT_DEPS_APP_ID / GIT_DEPS_APP_KEY are not passed"; exit 2
          fi
          declare -A repos=()
          while IFS= read -r line; do
            line="${line//[[:space:]]/}"; [ -n "$line" ] || continue
            [[ "$line" =~ ^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::bad git-deps line: $line"; exit 2; }
            repos[${line%%/*}]+="${line#*/} "
          done <<<"$GIT_DEPS"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          head=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          body=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64)
          sig=$(printf '%s.%s' "$head" "$body" | openssl dgst -sha256 -sign <(printf '%s\n' "$APP_KEY") | b64)
          jwt="$head.$body.$sig"
          api() { curl -sSf --retry 3 -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" "${@:2}"; }
          for owner in "${!repos[@]}"; do
            inst=$(api "$jwt" "$GITHUB_API_URL/orgs/$owner/installation" | jq -r .id) \
              || { echo "::error::the git-deps App has no installation on $owner"; exit 1; }
            names=$(printf '%s\n' ${repos[$owner]} | jq -R . | jq -sc .)
            token=$(api "$jwt" -X POST "$GITHUB_API_URL/app/installations/$inst/access_tokens" \
              -d "{\"repositories\":$names,\"permissions\":{\"contents\":\"read\"}}" | jq -r .token)
            echo "::add-mask::$token"
            for r in ${repos[$owner]}; do
              git config --global url."https://x-access-token:${token}@github.com/$owner/$r".insteadOf "https://github.com/$owner/$r"
            done
            echo "read-only token for $owner: ${repos[$owner]}"
          done
          # Cargo's own git client does not read insteadOf; the git CLI does.
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - name: Compile cache (sccache)
        # The org's own compile cache, first that applies: BuildCache with the
        # job's OIDC identity, else the organization's own cache user. Never
        # the platform's ci-sccache key.
        id: sccache
        uses: SylphxAI/.github/.github/actions/rust-sccache@d4305368ad744cdb047d8cdfd7588d99618cb5b5 # main after #171
        with:
          s3-access-key: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}
          key-prefix: rustc
          actions-cache: 'false'
      - name: Compile cache on GitHub Actions cache
        # Only when no sccache backend is running.
        if: steps.sccache.outputs.backend != 'buildcache' && steps.sccache.outputs.backend != 'static'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.workspace }}
          shared-key: check-tests-${{ inputs.tests }}
          cache-on-failure: true
          save-if: true
      - name: cargo check
        working-directory: ${{ inputs.workspace }}
        run: |
          set -uo pipefail
          args=(check --locked --color never)
          if [ -z "$IN_PACKAGES" ]; then args+=(--workspace); else
            for p in $IN_PACKAGES; do args+=(-p "$p"); done
          fi
          if [ "$IN_TESTS" = true ]; then args+=(--tests); fi
          echo "@@sylphx-check-begin"
          cargo "${args[@]}" 2>&1
          code=$?
          echo "@@sylphx-check-end"
          echo "@@sylphx-check-exit=$code"
          exit "$code"
      - name: sccache stats
        if: always() && (steps.sccache.outputs.backend == 'buildcache' || steps.sccache.outputs.backend == 'static')
        env:
          BACKEND: ${{ steps.sccache.outputs.backend }}
        run: |
          stats="$(sccache --show-stats 2>&1)" || stats="sccache stats unavailable"
          printf '%s\n' "$stats"
          {
            echo "### Rust compile cache ($BACKEND, $GITHUB_EVENT_NAME)"
            echo '```'
            printf '%s\n' "$stats" | grep -E '^(Compile requests|Cache hits|Cache misses|Cache hits rate|Cache write errors|Non-cacheable calls|Cache location)' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Every miss followed by a failed write means the cache never fills
          # and the hit rate stays at zero: say so on the run, not only in the log.
          werr="$(printf '%s\n' "$stats" | awk '/^Cache write errors/ {print $4}')"
          if [ "${werr:-0}" -gt 0 ]; then
            echo "::warning title=sccache cannot write::${werr} cache writes failed on backend ${BACKEND}; the next run will miss again"
          fi
